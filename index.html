<body><style>
  :root{
    --bg:#FCFBF8;
    --card:#FFFFFF;
    --ink:#0F0F0F;
    --ink-mid:#444440;
    --ink-soft:#8A8A85;
    --line:#E4E3DC;
    --radius:16px;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
    --good:#16A34A;
    --warn:#D97706;
    --accent-a:#FF5FA0;
    --accent-b:#FF9152;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  .ph{vertical-align:-2px; line-height:1;}
  .icon-btn-gap{margin-right:5px;}
  html, body{
    margin:0;
    padding:0;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---- HEADER ---- */
  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:200;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    padding:20px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  #appRoot{
    padding-top:77px;
  }
  .logo-area{cursor:pointer; min-width:0; flex:1;}
  .logo-row{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .logo-row span.emoji{font-size:22px; line-height:1;}
  .logo-row h1{font-size:20px; font-weight:800; letter-spacing:-0.02em; color:var(--ink);}
  .logo-sub{font-size:13px; color:var(--ink-soft); font-weight:400;}

  /* ---- Lovable-referenced brand accent: pink→coral gradient ---- */
  .lv-gradient-text{
    background-image: linear-gradient(120deg, var(--accent-a) 0%, var(--accent-b) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lv-gradient-dot{ background-image: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%); }
  .hero-blob{
    position:fixed; border-radius:9999px; filter:blur(70px); pointer-events:none; z-index:-1;
  }
  @media(prefers-reduced-motion:reduce){.hero-blob{display:none;}}
  .eyebrow-badge{
    display:inline-flex; align-items:center; gap:6px; background:#F3F1EC; color:var(--ink-soft);
    font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; margin-bottom:10px;
  }
  .eyebrow-badge .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

  .header-nav{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .nav-btn{
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    height:38px;
    padding:0 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-mid);
    cursor:pointer;
    transition:.15s;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .nav-btn:hover{border-color:#A8A8A0; color:var(--ink);}
  .nav-btn.dark{background:var(--ink); border-color:var(--ink); color:#fff;}
  .nav-btn.dark:hover{background:#333;}
  .back-link{
    font-size:13.5px; font-weight:600; color:var(--ink-mid);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; background:none; border:none; padding:0; font-family:inherit;
  }
  .back-link:hover{color:var(--ink);}

  /* ---- MAIN ---- */
  .main{max-width:1100px; margin:0 auto; padding:20px 32px 64px;}
  .main.narrow{max-width:640px;}

  /* ---- SEARCH ---- */
  .search-wrap{position:relative; margin-bottom:20px;}
  .search-icon{position:absolute; left:18px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none;}
  .search{
    width:100%; padding:15px 18px 15px 46px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--card); font-size:14.5px;
    font-family:inherit; color:var(--ink); box-shadow:var(--shadow); outline:none; transition:.15s;
  }
  .search::placeholder{color:var(--ink-soft);}
  .search:focus{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}

  /* ---- FILTER PILLS / TABS ---- */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:32px;}
  .pill{
    font-size:13.5px; font-weight:600; font-family:inherit; padding:8px 18px;
    border-radius:999px; border:1.5px solid var(--line); background:var(--card);
    color:var(--ink-mid); cursor:pointer; transition:.15s;
  }
  .pill:hover{border-color:#A8A8A0; color:var(--ink);}
  .pill.active{background:var(--ink); border-color:var(--ink); color:#FFF;}
  .pill:focus-visible{outline:2px solid var(--accent-a); outline-offset:2px;}

  .tab-nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:16px;}
  .tab-btn{
    font-size:13.5px; font-weight:700; font-family:inherit; padding:9px 16px;
    border-radius:999px; border:1.5px solid transparent; background:transparent;
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{background:var(--ink); color:#fff;}

  .admin-layout{display:flex; align-items:flex-start; gap:28px;}
  .admin-sidebar{display:flex; flex-direction:column; gap:4px; width:190px; flex-shrink:0; position:sticky; top:20px;}
  .sidebar-tab-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; text-align:left; font-size:13.5px; font-weight:700; font-family:inherit;
    padding:11px 16px; border-radius:10px; border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .sidebar-tab-btn:hover{color:var(--ink); background:var(--card);}
  .sidebar-tab-btn.active{background:var(--ink); color:#fff;}
  .sidebar-tab-btn:disabled{opacity:.4; cursor:not-allowed; background:transparent;}
  .sidebar-tab-btn:disabled:hover{background:transparent; color:var(--ink-soft);}
  .notif-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    font-size:10px; font-weight:800; line-height:1; flex-shrink:0;
    background:#EF4444; color:#fff; transition:.15s;
  }
  .sidebar-tab-btn.active .notif-badge{background:rgba(255,255,255,.25); color:#fff;}
  .admin-notif-banner{
    display:flex; align-items:center; gap:10px; padding:12px 16px; margin-bottom:16px;
    background:color-mix(in srgb, #EF4444 8%, var(--card)); border:1px solid color-mix(in srgb, #EF4444 30%, var(--line));
    border-radius:var(--radius); font-size:13.5px; color:var(--ink);
  }
  .admin-notif-banner .notif-icon{font-size:16px; flex-shrink:0; color:#EF4444;}
  .notif-link{background:none; border:none; padding:0; font:inherit; font-weight:700; color:#EF4444; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .notif-link:hover{opacity:.8;}
  .admin-content{flex:1; min-width:0;}
  @media(max-width:760px){
    .admin-layout{flex-direction:column; gap:16px;}
    .admin-sidebar{width:100%; flex-direction:row; flex-wrap:wrap; position:static;}
    .sidebar-tab-btn{width:auto; border-radius:999px;}
  }

  /* ---- SECTION TITLE ---- */
  .section-title{
    font-size:22px; font-weight:800; letter-spacing:-0.02em; color:var(--ink);
    margin-bottom:20px; display:flex; align-items:baseline; gap:10px;
  }
  .section-sub{font-size:13.5px; color:var(--ink-soft); margin-top:4px; margin-bottom:20px;}
  .section-count{font-size:16px; font-weight:500; color:var(--ink-soft);}

  /* ---- GRID (links) ---- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px;}

  /* ---- LINK CARD ---- */
  .link-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); transition:.2s;
  }
  .link-card:hover{transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.07), 0 12px 28px rgba(0,0,0,.09);}
  .card-top-bar{height:4px; background:var(--cat-color, #E4E3DC); width:100%; flex-shrink:0;}
  .card-body{padding:18px 20px 16px; display:flex; flex-direction:column; flex:1; gap:10px;}
  .card-header{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card-title-row{display:flex; align-items:center; gap:9px; min-width:0;}
  .favicon{width:20px; height:20px; border-radius:5px; flex-shrink:0; object-fit:contain;}
  .card-title{
    font-size:16px; font-weight:700; color:var(--ink); text-decoration:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.01em;
  }
  .card-title:hover{color:#444;}
  .card-badge{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;
    background:var(--badge-bg); color:var(--badge-fg);
  }
  .card-desc{font-size:13.5px; color:var(--ink-mid); line-height:1.55; flex:1;}
  .card-footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-top:8px; border-top:1px solid var(--line); margin-top:4px;
  }
  .card-date{font-size:11.5px; color:var(--ink-soft); font-weight:500; line-height:1.3;}
  .card-date strong{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:1px;}
  .card-actions{display:flex; align-items:center; gap:7px; flex-shrink:0;}
  .btn-copy{
    display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; padding:0;
    border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--ink-mid);
    cursor:pointer; transition:.15s; flex-shrink:0;
  }
  .btn-copy .ph{font-size:15px;}
  .btn-copy:hover{border-color:#A8A8A0; color:var(--ink);}
  .btn-access{
    font-size:12.5px; font-weight:600; font-family:inherit; padding:7px 14px; border-radius:999px;
    border:none; background:var(--ink); color:#FFF; cursor:pointer; transition:.15s;
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .btn-access:hover{background:#333;}
  .copied-toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:10px 20px;
    border-radius:999px; opacity:0; transition:.2s; pointer-events:none; z-index:99;
  }
  .copied-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---- EMPTY ---- */
  .empty{
    text-align:center; padding:80px 20px; color:var(--ink-soft); background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); grid-column:1/-1;
  }
  .empty strong{display:block; font-size:18px; color:var(--ink); margin-bottom:6px; font-weight:700;}
  .empty.small{padding:32px 20px;}

  /* ---- LOGIN / GATE BOXES ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,15,15,.45); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--card); border-radius:var(--radius); padding:28px; max-width:400px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.28); text-align:left;
  }
  .modal-box h3{font-size:17px; font-weight:800; margin-bottom:12px; color:var(--ink);}
  .modal-box p{font-size:13.5px; color:var(--ink-mid); line-height:1.55;}
  .modal-field-label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .popover{
    position:absolute; z-index:900; background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 14px 36px rgba(0,0,0,.18); padding:16px; width:280px;
  }
  .popover h4{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:10px;}
  .popover .cat-chips{margin:10px 0 0;}

  .gate-box{
    max-width:400px; margin:60px auto; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:36px; text-align:center; box-shadow:var(--shadow);
  }
  .gate-box h2{font-size:20px; font-weight:800; margin-bottom:6px;}
  .gate-box p{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .field{
    display:block; width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:14px; color:var(--ink); margin-bottom:10px; background:var(--bg);
    outline:none; transition:.15s;
  }
  .field:focus{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}
  .field-icon-wrap{position:relative; display:block;}
  .field-icon-wrap .field{margin-bottom:0; padding-right:44px;}
  .field-icon-wrap.two-icons .field{padding-right:80px;}
  .field-icons{position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; gap:2px; align-items:center;}
  .field-icon-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border:none; background:transparent; cursor:pointer;
    color:var(--ink-soft); border-radius:8px; transition:.15s; font-size:16px; padding:0;
  }
  .field-icon-btn:hover{background:var(--line); color:var(--ink);}
  .btn-primary{
    display:block; width:100%; padding:12px; background:var(--ink); color:#fff; border:none;
    border-radius:999px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
    transition:.15s; margin-top:4px;
  }
  .btn-primary:hover:not(:disabled){background:#333;}
  .btn-primary:disabled{opacity:.45; cursor:default;}
  .btn-primary.auto{width:auto; display:inline-block; padding:10px 20px; border-radius:999px; margin-top:0;}
  .error-msg{font-size:13px; color:#DC2626; min-height:18px; margin:6px 0;}
  .success-msg{font-size:13px; color:var(--good); font-weight:600; min-height:18px; margin:6px 0;}

  /* ---- ADMIN BAR / SECTIONS ---- */
  .admin-bar{
    display:flex; justify-content:space-between; align-items:center; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 20px; margin-bottom:24px;
    box-shadow:var(--shadow); gap:16px; flex-wrap:wrap;
  }
  .admin-bar-left{font-size:13.5px; color:var(--ink-mid);}
  .session-label{
    text-align:right; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;
  }
  .session-label strong{color:var(--ink-mid); font-weight:600;}
  .admin-bar-left strong{color:var(--ink);}
  .btn-sm{
    font-size:13px; font-weight:600; font-family:inherit;
    height:36px; padding:0 14px;
    border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); color:var(--ink-mid); cursor:pointer; transition:.15s;
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    white-space:nowrap; flex-shrink:0;
  }
  .btn-sm:hover{border-color:#A8A8A0; color:var(--ink);}
  .btn-sm.danger:hover{border-color:#DC2626; color:#DC2626;}
  .btn-sm.primary-outline{border-color:var(--ink); color:var(--ink);}

  /* ---- FERRAMENTAS ---- */
  .tool-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px;}
  .tool-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:22px 22px 18px; display:flex; flex-direction:column; gap:8px; text-decoration:none; color:var(--ink); transition:.2s;
  }
  .tool-card:hover{transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.07), 0 12px 28px rgba(0,0,0,.09);}
  .tool-card:focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
  .tool-icon{
    width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:22px; color:#fff; margin-bottom:6px;
    background-image:linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%);
  }
  .tool-title{font-size:17px; font-weight:800; letter-spacing:-0.01em;}
  .tool-desc{font-size:13.5px; color:var(--ink-mid); line-height:1.55; flex:1;}
  .tool-open{
    display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:var(--ink-mid);
    padding-top:10px; margin-top:6px; border-top:1px solid var(--line);
  }
  .tool-card:hover .tool-open{color:var(--ink);}

  .admin-section{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .admin-section h3{font-size:15px; font-weight:700; margin-bottom:4px;}
  .admin-section .hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}

  .form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .form-row input, .form-row textarea, .form-row select{
    flex:1; min-width:180px; padding:10px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--bg); outline:none; transition:.15s;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}
  .form-row textarea{resize:vertical; min-height:40px;}
  .form-row .btn-primary{width:auto; display:inline-block; border-radius:999px; padding:10px 20px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .form-grid label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
  .form-grid .full{grid-column:1/-1;}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr;}}

  .cat-chips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .cat-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    padding:6px 12px; border-radius:999px;
  }
  .cat-chip .del{border:none; background:none; cursor:pointer; font-size:14px; line-height:1; padding:0; opacity:.7;}
  .cat-chip .del:hover{opacity:1;}

  .pick-pill{
    font-size:12.5px; font-weight:600; font-family:inherit; padding:6px 14px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-mid); cursor:pointer; transition:.15s;
  }
  .pick-pill.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .pick-pill:hover:not(.active){border-color:#A8A8A0;}

  .admin-link-list, .simple-list{display:flex; flex-direction:column; gap:8px;}
  .admin-link-row, .simple-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px; border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; background:var(--bg); flex-wrap:wrap;
  }
  /* Rows sem borda própria, separados por divider — usados dentro de containers com borda */
  .picker-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:300px;overflow-y:auto;}
  .picker-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;transition:background .1s;}
  .picker-row:last-child{border-bottom:none;}
  .picker-row:hover{background:color-mix(in srgb,var(--accent-a) 5%,transparent);}
  .picker-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer;accent-color:var(--accent-a);}
  /* Loading */
  @keyframes _spin{to{transform:rotate(360deg);}}
  .loading-state{display:flex;align-items:center;gap:8px;padding:16px 4px;font-size:13px;color:var(--ink-soft);}
  .loading-state::before{content:'';width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent-a);border-radius:50%;animation:_spin .7s linear infinite;flex-shrink:0;}
  .admin-link-row .meta, .simple-row .meta{flex:1; min-width:0;}
  .admin-link-row .meta strong, .simple-row .meta strong{font-size:13.5px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .admin-link-row .meta span, .simple-row .meta span{font-size:12px; color:var(--ink-soft);}
  .row-acts{display:flex; gap:6px; flex-shrink:0;}

  .status-badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.pending{background:#FEF3C7; color:#92400E;}
  .status-badge.assigned{background:#DCFCE7; color:#166534;}

  .config-warning{
    background:#FEF9C3; border:1px solid #FDE047; color:#713F12; border-radius:var(--radius);
    padding:16px 20px; font-size:13.5px; line-height:1.55; margin-bottom:24px;
  }
  .config-warning code{background:rgba(0,0,0,.07); padding:2px 6px; border-radius:5px; font-size:12.5px;}
  .info-box{
    background:#EFF6FF; border:1px solid #BFDBFE; color:#1E3A8A; border-radius:var(--radius);
    padding:16px 20px; font-size:13.5px; line-height:1.55; margin-bottom:18px;
  }
  .danger-zone{
    border:1.5px solid #FCA5A5; background:#FEF2F2; border-radius:var(--radius);
    padding:20px 24px; margin-top:28px;
  }
  .danger-zone h3{color:#991B1B; font-size:15px; font-weight:800; margin-bottom:6px;}
  .danger-zone p{color:#B91C1C; font-size:13px; line-height:1.55; margin-bottom:14px;}

  /* ---- GROUP CARDS (banca list) ---- */
  .group-cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px;}
  .group-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;
    box-shadow:var(--shadow); cursor:pointer; transition:.15s; display:flex; flex-direction:column; gap:6px;
    position:relative;
  }
  .group-card:hover{transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.07), 0 12px 28px rgba(0,0,0,.09);}
  .group-card.is-done{border-color:var(--good);}
  .card-done-badge{position:absolute;top:14px;right:16px;color:var(--good);font-size:20px;line-height:1;}
  .group-card .code{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--warn); text-transform:uppercase;}
  .group-card .proj-title{font-size:15px; font-weight:700; color:var(--ink); line-height:1.3;}
  .group-card .authors{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .group-card .pw-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .group-card .pw-status{font-size:12px;display:inline-flex;align-items:center;gap:4px;flex:1;}
  .group-card .pw-status.has-pw{color:var(--good);}
  .group-card .pw-status.no-pw{color:var(--ink-soft);font-style:italic;}
  .group-card .pw-edit{padding:2px 7px !important;font-size:11px !important;flex-shrink:0;line-height:1.6;}

  /* ---- EVALUATORS ---- */
  .evaluator-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:1px solid var(--line);
    padding:12px 4px;
  }
  .evaluator-row:last-of-type{border-bottom:none;}
  .evaluator-row .meta strong{font-size:13.5px; font-weight:700; display:block;}
  .evaluator-row .meta span{font-size:12px; color:var(--ink-soft);}
  .evaluator-row .comment{
    font-size:12.5px; color:var(--ink-mid); border-left:2px solid var(--warn); padding-left:10px; margin-top:6px; line-height:1.5;
  }

  /* ---- SCORE GRID ---- */
  .rubric-category{margin-bottom:22px;}
  .rubric-category .cat-heading{display:flex; align-items:center; gap:10px; font-size:15.5px; font-weight:800; margin-bottom:14px;}
  .rubric-category .cat-num{
    width:24px; height:24px; border-radius:50%; background:var(--warn); color:#fff; font-size:12.5px;
    font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rubric-question{margin-bottom:14px;}
  .rubric-question .q-text{font-size:13.5px; font-weight:600; color:var(--ink-mid); margin-bottom:8px;}
  .score-eval-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px;}
  .score-cell{
    border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--bg); transition:.15s;
  }
  .score-cell.answered{border-color:#86EFAC; background:#F0FDF4;}

  /* ---- Resultados (visualização, sem cara de formulário) ---- */
  .result-eval-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px;}
  .result-cell{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line);
  }
  .result-eval-name{font-size:12.5px; font-weight:600; color:var(--ink-mid);}
  .result-badge{font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap;}
  .result-badge.rating-excelente{background:#DCFCE7; color:#166534;}
  .result-badge.rating-muito_bom{background:#DBEAFE; color:#1E40AF;}
  .result-badge.rating-bom{background:#FEF3C7; color:#92400E;}
  .result-badge.rating-regular{background:#FFEDD5; color:#9A3412;}
  .result-badge.rating-muito_fraco{background:#FEE2E2; color:#991B1B;}
  .result-badge.rating-none{background:#EFEDE6; color:var(--ink-soft);}

  /* ---- Painel de resultados (nota geral / distribuição / médias) ---- */
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px;}
  @media(max-width:720px){.stats-grid{grid-template-columns:1fr;}}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);}
  .stat-card .stat-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:14px;}
  .stat-big-number{display:flex; align-items:baseline; gap:6px; line-height:1;}
  .stat-big-number .num{font-size:42px; font-weight:800; color:var(--ink);}
  .stat-big-number .denom{font-size:16px; font-weight:600; color:var(--ink-soft);}
  .stat-bar-track{height:8px; border-radius:999px; background:#E4E3DC; overflow:hidden; margin-top:16px;}
  .stat-bar-fill{height:100%; border-radius:999px; background:#16A34A;}
  .stat-concept{margin-top:14px; font-size:13.5px; color:var(--ink-mid);}
  .stat-concept strong{font-weight:700;}
  .stat-empty{font-size:13px; color:var(--ink-soft);}

  .dist-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .dist-row:last-child{margin-bottom:0;}
  .dist-label{width:88px; font-size:13px; color:var(--ink-mid); flex-shrink:0;}
  .dist-track{flex:1; height:8px; border-radius:999px; background:#E4E3DC; overflow:hidden;}
  .dist-fill{height:100%; border-radius:999px;}
  .dist-count{width:64px; text-align:right; font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}

  .criteria-heading{font-size:20px; font-weight:800; color:var(--ink); margin:6px 0 16px;}
  .criteria-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-bottom:28px;}
  .criteria-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .criteria-card .crit-num{font-size:12px; font-weight:800; color:var(--warn); margin-bottom:8px;}
  .criteria-card .crit-title{font-size:14px; font-weight:700; color:var(--ink); margin-bottom:14px; line-height:1.35; min-height:38px;}
  .criteria-card .crit-score{display:flex; align-items:baseline; gap:5px; margin-bottom:12px;}
  .criteria-card .crit-score .num{font-size:26px; font-weight:800; color:var(--ink);}
  .criteria-card .crit-score .denom{font-size:13px; font-weight:600; color:var(--ink-soft);}

  /* ---- Multiselect de categorias ---- */
  .ms-wrap{position:relative; width:100%;}
  .ms-box{
    display:flex; align-items:center; gap:8px; min-height:46px; padding:7px 10px; border:1.5px solid var(--line);
    border-radius:12px; background:var(--bg); cursor:pointer; flex-wrap:wrap; transition:.15s;
  }
  .ms-box.open{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}
  .ms-chips{display:flex; flex-wrap:wrap; gap:6px; flex:1;}
  .ms-placeholder{color:var(--ink-soft); font-size:13.5px; padding:2px 0;}
  .ms-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; padding:4px 4px 4px 10px;
    border-radius:999px; border:1px solid; background:#fff;
  }
  .ms-chip-x{border:none; background:none; cursor:pointer; font-size:14px; line-height:1; padding:2px; color:inherit; opacity:.65;}
  .ms-chip-x:hover{opacity:1;}
  .ms-toggle{border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:11px; padding:6px; flex-shrink:0;}
  .ms-dropdown{
    position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:80; background:var(--card);
    border:1px solid var(--line); border-radius:12px; box-shadow:0 14px 32px rgba(0,0,0,.16); max-height:280px;
    overflow-y:auto; padding:8px;
  }
  .ms-add-row{display:flex; gap:6px; padding:2px 2px 10px; border-bottom:1px solid var(--line); margin-bottom:6px;}
  .ms-add-row input{
    flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:13px; background:var(--bg);
  }
  .ms-add-row button{border:none; background:var(--ink); color:#fff; border-radius:8px; width:34px; font-size:16px; cursor:pointer; flex-shrink:0;}
  .ms-item{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 6px; border-radius:8px;}
  .ms-item:hover{background:var(--bg);}
  .ms-item-label{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink); cursor:pointer; flex:1; min-width:0;}
  .ms-item-label input[type="checkbox"]{width:16px; height:16px; accent-color:var(--accent-a); flex-shrink:0;}
  .ms-item-label span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ms-item-actions{display:flex; gap:2px; flex-shrink:0;}
  .ms-item-actions button{border:none; background:none; cursor:pointer; font-size:13px; padding:4px 6px; border-radius:6px;}
  .ms-item-actions button:hover{background:var(--line);}
  .ms-empty{padding:10px 6px; font-size:13px; color:var(--ink-soft);}

  /* ---- Assistente de notas (estilo Typeform) ---- */
  .wizard-overlay{
    position:fixed; inset:0; z-index:2000; background:var(--bg);
    display:flex; flex-direction:column;
  }
  .wizard-scroll{
    flex:1; overflow-y:auto; padding:24px; position:relative;
  }
  .wizard-close{
    position:absolute; top:20px; right:24px; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line); background:var(--card); font-size:18px; line-height:1; cursor:pointer; color:var(--ink-mid);
  }
  .wizard-close:hover{background:var(--line);}
  .wizard-inner{max-width:600px; margin:0 auto; width:100%; padding-top:36px;}
  .wizard-steps{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:44px;}
  .wizard-dot{
    width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    font-size:12.5px; font-weight:700; font-family:inherit; color:var(--ink-soft); cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:var(--shadow);
  }
  .wizard-dot:hover{border-color:var(--accent-a);}
  .wizard-dot.current{border-color:var(--accent-a); color:var(--accent-a);}
  .wizard-dot.done{background:var(--ink); border-color:var(--ink); color:#fff;}
  .wizard-body{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .wizard-eyebrow{font-size:12px; font-weight:700; font-family:inherit; text-transform:uppercase; letter-spacing:.05em; color:var(--warn); margin-bottom:10px; text-align:center;}
  .wizard-question{font-size:26px; font-weight:800; font-family:inherit; color:var(--ink); text-align:center; margin-bottom:32px; line-height:1.32;}
  .wizard-options{display:flex; flex-direction:column; gap:10px; margin-bottom:24px;}
  .wizard-option{
    padding:16px 20px; border:1px solid var(--line); border-radius:var(--radius); background:var(--card);
    font-size:15px; font-weight:600; font-family:inherit; color:var(--ink); cursor:pointer; text-align:left; transition:.15s;
    box-shadow:var(--shadow);
  }
  .wizard-thanks{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 0;gap:0;}
  .wizard-thanks-icon{font-size:56px;color:var(--good);margin-bottom:20px;line-height:1;}
  .wizard-thanks-title{font-size:26px;font-weight:800;color:var(--ink);margin-bottom:10px;line-height:1.3;}
  .wizard-thanks-text{font-size:15px;color:var(--ink-mid);max-width:380px;line-height:1.6;margin-bottom:28px;}
  .wizard-option:hover{border-color:var(--accent-a); background:color-mix(in srgb, var(--accent-a) 6%, var(--card));}
  .wizard-option.selected{border-color:var(--accent-a); background:color-mix(in srgb, var(--accent-a) 12%, var(--card)); color:var(--accent-a);}
  .wizard-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 24px; padding-bottom:max(12px, env(safe-area-inset-bottom));
    background:var(--bg); border-top:1px solid var(--line); flex-shrink:0;
  }
  .wizard-footer:empty{display:none;}
  .wizard-progress{font-size:12.5px; color:var(--ink-soft);}
  .wizard-textarea{
    width:100%; min-height:140px; padding:14px 16px; border:1px solid var(--line); border-radius:var(--radius);
    font-family:inherit; font-size:14.5px; background:var(--card); color:var(--ink); margin-bottom:16px; resize:vertical;
    box-shadow:var(--shadow);
  }
  @media(max-width:640px){
    .wizard-question{font-size:21px;}
    .wizard-scroll{padding:16px;}
    .wizard-inner{padding-top:48px;}
    .wizard-footer{padding:10px 16px; padding-bottom:max(10px, env(safe-area-inset-bottom));}
  }
  .score-cell .eval-name{font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:5px;}
  .score-cell .eval-name .check{color:var(--good); font-size:13px;}
  .score-cell select{
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:7px; font-family:inherit;
    font-size:12.5px; background:#fff; color:var(--ink);
  }

  footer{text-align:center; padding:32px; font-size:12px; color:var(--ink-soft);}

  @media(max-width:640px){
    .site-header{padding:16px 20px;}
    .main{padding:20px 16px 48px;}
    .section-title{font-size:18px;}
    .logo-sub{display:none;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important;}}

  /* ======================= CRONÔMETRO DA BANCA (?cronometro=1) =======================
     Tela cheia isolada do resto do site: identidade dos slides Senac (indigo/navy),
     Inter + Pragati Narrow. Tudo escopado em #timerApp / .tm-* para não colidir. */
  body.timer-mode{overflow:hidden;}
  body.timer-mode .site-header, body.timer-mode > footer, body.timer-mode .hero-blob{display:none !important;}
  body.timer-mode #appRoot{padding-top:0;}
  #timerApp [hidden]{display:none !important;}
  body.timer-mode.tm-idle, body.timer-mode.tm-idle *{cursor:none;}
  #timerApp{
    --tm-indigo:#2F2BD2; --tm-navy:#07038E; --tm-cream:#EEEFE9; --tm-paper:#FFFFFF; --tm-mist:#D9D8F6;
    --tm-warn:#F0612E; --tm-alert:#E11D48; --tm-ink-soft:rgba(7,3,142,.55);
    --tm-display:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --tm-body:"Pragati Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
    position:fixed; inset:0; z-index:500; background:var(--tm-indigo); color:var(--tm-navy);
    font-family:var(--tm-body); overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  #timerApp .tm-stage{height:100%; display:flex; flex-direction:column; gap:clamp(10px,2vh,22px);
    padding:clamp(14px,3vh,34px) max(16px,2.4vw);}
  #timerApp .tm-panel{position:relative; flex:1; min-height:0; background:var(--tm-paper); border-radius:clamp(14px,1.6vw,26px);
    display:flex; flex-direction:column; padding:clamp(18px,4vh,48px) clamp(18px,3.6vw,64px);}
  #timerApp .tm-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px;}
  #timerApp .tm-group{font:800 clamp(28px,4.4vw,72px)/1.02 var(--tm-display); letter-spacing:-.02em; text-wrap:balance; margin:0; min-width:0; overflow-wrap:anywhere; color:var(--tm-navy);}
  #timerApp .tm-chip{flex:none; font:700 clamp(12px,1.05vw,17px)/1 var(--tm-display); letter-spacing:.2em; text-transform:uppercase;
    padding:.75em 1.2em; border-radius:999px; background:var(--tm-mist); color:var(--tm-navy); transition:background .3s,color .3s;}
  #timerApp .tm-chip.running{background:var(--tm-indigo); color:#fff;}
  #timerApp .tm-chip.warn{background:var(--tm-warn); color:#fff;}
  #timerApp .tm-clock{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center;}
  #timerApp .tm-digits{font:900 clamp(96px,25vw,380px)/.86 var(--tm-display); letter-spacing:-.02em; font-variant-numeric:tabular-nums;
    margin:0; color:var(--tm-navy); transition:color .4s; white-space:nowrap;}
  #timerApp .tm-digits .tm-colon{display:inline-block; transform:translateY(-.06em); margin:0 -.02em;}
  #timerApp .tm-digits.warn{color:var(--tm-warn);}
  #timerApp .tm-digits.alert{color:var(--tm-alert);}
  #timerApp .tm-hint{font:400 clamp(16px,1.7vw,28px)/1.2 var(--tm-body); color:var(--tm-ink-soft); margin:.6em 0 0 .3em; min-height:1.2em;}
  #timerApp .tm-track{height:clamp(8px,1.1vh,14px); border-radius:999px; background:var(--tm-mist); overflow:hidden; margin-top:clamp(14px,3vh,34px);}
  #timerApp .tm-track i{display:block; height:100%; width:0; background:var(--tm-indigo); border-radius:inherit; transition:background .4s;}
  #timerApp .tm-track.warn i{background:var(--tm-warn);}
  #timerApp .tm-track.alert i{background:var(--tm-alert);}
  #timerApp .tm-steps{list-style:none; margin:clamp(14px,2.6vh,30px) 0 0; padding:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:clamp(6px,.9vw,14px);}
  #timerApp .tm-steps li{display:flex; align-items:center; gap:.6em; padding:.7em 1em; border-radius:999px; border:2px solid var(--tm-mist);
    font:700 clamp(12px,1.15vw,19px)/1.1 var(--tm-body); color:var(--tm-ink-soft); min-width:0; transition:all .3s;}
  #timerApp .tm-steps li b{font:800 .95em/1 var(--tm-display); font-variant-numeric:tabular-nums; flex:none; opacity:.9;}
  #timerApp .tm-steps li span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #timerApp .tm-steps li.done{color:var(--tm-navy); border-color:transparent; background:var(--tm-cream);}
  #timerApp .tm-steps li.now{background:var(--tm-indigo); border-color:var(--tm-indigo); color:#fff;}
  #timerApp .tm-foot{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; color:#fff; flex:none;}
  #timerApp .tm-foot strong{font:800 clamp(15px,1.6vw,24px)/1.1 var(--tm-display); letter-spacing:-.01em; display:block;}
  #timerApp .tm-foot small{font:400 clamp(14px,1.3vw,20px)/1.2 var(--tm-body); opacity:.85;}
  #timerApp .tm-logo{height:clamp(22px,2.6vw,40px); width:auto; flex:none; display:block;}
  #timerApp .tm-panel.pulse{animation:tmPulse 1s ease-in-out infinite;}
  @keyframes tmPulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}50%{box-shadow:0 0 0 clamp(6px,.8vw,12px) rgba(225,29,72,.55)}}
  #timerApp .tm-applause{position:absolute; inset:0; border-radius:inherit; background:var(--tm-navy); color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; overflow:hidden; opacity:0; pointer-events:none; transition:opacity .5s ease;}
  #timerApp .tm-panel.clap .tm-applause{opacity:1; pointer-events:auto;}
  #timerApp .tm-rings{position:absolute; left:50%; top:50%; width:0; height:0;}
  #timerApp .tm-rings i{position:absolute; left:0; top:0; width:20vmin; height:20vmin; margin:-10vmin 0 0 -10vmin; border-radius:50%;
    border:2px solid rgba(217,216,246,.55); animation:tmRing 3.6s cubic-bezier(.2,.6,.3,1) infinite; opacity:0;}
  #timerApp .tm-rings i:nth-child(2){animation-delay:.9s} #timerApp .tm-rings i:nth-child(3){animation-delay:1.8s} #timerApp .tm-rings i:nth-child(4){animation-delay:2.7s}
  @keyframes tmRing{0%{transform:scale(.4);opacity:0}15%{opacity:1}100%{transform:scale(7);opacity:0}}
  #timerApp .tm-emoji{position:relative; font-size:clamp(56px,10vw,160px); line-height:1; margin:0 0 .15em; animation:tmClap .5s ease-in-out infinite alternate;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;}
  @keyframes tmClap{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.08)}}
  #timerApp .tm-ap-eyebrow{position:relative; font:700 clamp(12px,1.3vw,20px)/1 var(--tm-display); letter-spacing:.36em; text-transform:uppercase; color:var(--tm-mist); margin:0 0 .6em;}
  #timerApp .tm-applause h2{position:relative; margin:0; font:900 clamp(64px,16vw,260px)/.9 var(--tm-display); letter-spacing:-.05em; color:#fff; animation:tmBeat .62s ease-in-out infinite alternate;}
  @keyframes tmBeat{from{transform:scale(1)}to{transform:scale(1.035)}}
  #timerApp .tm-ap-text{position:relative; margin:.7em 0 0; font:400 clamp(20px,2.6vw,42px)/1.15 var(--tm-body); color:var(--tm-mist); text-wrap:balance; max-width:28ch;}
  #timerApp .tm-ap-next{position:relative; margin-top:2.2em; font:700 clamp(12px,1vw,15px)/1 var(--tm-display); letter-spacing:.22em; text-transform:uppercase; color:rgba(217,216,246,.6);}
  @media(prefers-reduced-motion:reduce){#timerApp .tm-rings i, #timerApp .tm-applause h2, #timerApp .tm-emoji, #timerApp .tm-panel.pulse{animation:none;} #timerApp .tm-rings i{opacity:.25; transform:scale(2);}}
  #timerApp .tm-hotspot{position:fixed; right:0; bottom:0; width:110px; height:110px; z-index:30;}
  #timerApp .tm-hotspot::after{content:""; position:absolute; right:18px; bottom:18px; width:10px; height:10px; border-radius:50%; background:#fff; opacity:0; transition:opacity .2s;}
  #timerApp .tm-hotspot:hover::after{opacity:.5;}
  #timerApp .tm-drawer{position:fixed; top:0; right:0; bottom:0; z-index:40; width:min(440px,100vw); background:var(--tm-navy); color:#fff;
    padding:22px; display:flex; flex-direction:column; gap:18px; overflow-y:auto; transform:translateX(105%); transition:transform .28s ease;
    box-shadow:-20px 0 60px rgba(0,0,0,.25); font-family:var(--tm-body);}
  #timerApp .tm-drawer.open{transform:none;}
  #timerApp .tm-drawer h3{margin:0; font:800 20px/1.1 var(--tm-display); letter-spacing:-.01em; color:#fff;}
  #timerApp .tm-sync{display:flex; align-items:center; gap:8px; font:400 17px/1.2 var(--tm-body); color:var(--tm-mist); margin-top:6px;}
  #timerApp .tm-sync i{width:9px; height:9px; border-radius:50%; background:#8a89b8; flex:none;}
  #timerApp .tm-sync.on i{background:#4ade80;}
  #timerApp .tm-field{display:flex; flex-direction:column; gap:6px;}
  #timerApp .tm-field label{font:700 11px/1 var(--tm-display); letter-spacing:.24em; text-transform:uppercase; color:var(--tm-mist);}
  #timerApp .tm-drawer input, #timerApp .tm-drawer select{font:700 18px/1 var(--tm-display); color:var(--tm-navy); background:#fff; border:0; border-radius:12px;
    padding:12px 14px; width:100%; font-variant-numeric:tabular-nums;}
  #timerApp .tm-drawer select{font-size:15px;}
  #timerApp .tm-drawer input:focus-visible, #timerApp .tm-drawer select:focus-visible, #timerApp .tm-drawer button:focus-visible{outline:3px solid #fff; outline-offset:2px;}
  #timerApp .tm-dd{position:relative;}
  #timerApp .tm-dd-btn{width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left;
    font:700 16px/1.2 var(--tm-display) !important; color:var(--tm-navy) !important; background:#fff !important; border-radius:12px !important; padding:13px 14px !important;}
  #timerApp .tm-dd-btn span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #timerApp .tm-dd-btn i{flex:none; font-size:14px; transition:transform .2s;}
  #timerApp .tm-dd-btn[aria-expanded="true"] i{transform:rotate(180deg);}
  #timerApp .tm-dd-list{position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:5; list-style:none; margin:0; padding:6px; max-height:min(320px,50vh); overflow-y:auto;
    background:#fff; border-radius:14px; box-shadow:0 18px 40px rgba(3,1,60,.45);}
  #timerApp .tm-dd-list li{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; cursor:pointer;
    font:700 15px/1.2 var(--tm-display); color:var(--tm-navy); outline:none;}
  #timerApp .tm-dd-list li span{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #timerApp .tm-dd-list li b{flex:none; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--tm-mist); color:var(--tm-navy); font:800 12px/1 var(--tm-display);}
  #timerApp .tm-dd-list li i{flex:none; color:var(--tm-indigo);}
  #timerApp .tm-dd-list li.free{color:var(--tm-ink-soft); font-weight:500; border-bottom:1px solid var(--tm-mist); border-radius:10px 10px 0 0; margin-bottom:4px;}
  #timerApp .tm-dd-list li:hover, #timerApp .tm-dd-list li:focus{background:var(--tm-mist);}
  #timerApp .tm-dd-list li[aria-selected="true"]{background:var(--tm-indigo); color:#fff;}
  #timerApp .tm-dd-list li[aria-selected="true"] b{background:#fff; color:var(--tm-indigo);}
  #timerApp .tm-dd-list li[aria-selected="true"] i{color:#fff;}
  #timerApp .tm-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  #timerApp .tm-stack{display:flex; flex-direction:column; gap:10px;}
  #timerApp .tm-drawer button{white-space:nowrap; font:700 14px/1.1 var(--tm-display); border:0; border-radius:999px; padding:13px 16px; cursor:pointer;
    background:rgba(255,255,255,.12); color:#fff; transition:background .15s;}
  #timerApp .tm-drawer button:hover{background:rgba(255,255,255,.2);}
  #timerApp .tm-drawer button.primary{background:#fff; color:var(--tm-navy);}
  #timerApp .tm-drawer button.primary:hover{background:var(--tm-cream);}
  #timerApp .tm-drawer button.accent{background:var(--tm-indigo);}
  #timerApp .tm-drawer button.accent:hover{background:#4440e0;}
  #timerApp .tm-keys{font:400 16px/1.45 var(--tm-body); color:var(--tm-mist); margin:0;}
  #timerApp .tm-keys kbd{font:700 12px/1 var(--tm-display); background:rgba(255,255,255,.14); border-radius:6px; padding:3px 6px; color:#fff;}
  #timerApp .tm-close{position:absolute; top:16px; right:16px; width:38px; height:38px; padding:0 !important; font-size:20px !important;}

  /* ======================= SORTEIO DA ORDEM (?sorteio=1) =======================
     Reaproveita a base do cronômetro (#timerApp / .tm-*); aqui só o que é do sorteio. */
  #timerApp .dw-body{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:clamp(18px,3vw,56px); margin-top:clamp(14px,3vh,34px);}
  #timerApp .dw-stage{display:flex; flex-direction:column; justify-content:center; min-width:0;}
  #timerApp .dw-eyebrow{font:700 clamp(12px,1.25vw,20px)/1 var(--tm-display); letter-spacing:.32em; text-transform:uppercase; color:var(--tm-indigo); margin:0 0 .8em;}
  #timerApp .dw-pos{font:900 clamp(72px,13vw,220px)/.85 var(--tm-display); letter-spacing:-.04em; color:var(--tm-mist); margin:0; font-variant-numeric:tabular-nums; transition:color .3s;}
  #timerApp .dw-pos sup{font-size:.42em; vertical-align:.95em; letter-spacing:0; margin-left:.04em;}
  #timerApp .dw-name{font:800 clamp(32px,5.4vw,92px)/1.02 var(--tm-display); letter-spacing:-.025em; color:var(--tm-navy); margin:.18em 0 0; min-height:2.04em;
    text-wrap:balance; overflow-wrap:anywhere;}
  #timerApp .dw-stage.spinning .dw-name{color:var(--tm-ink-soft);}
  #timerApp .dw-stage.landed .dw-pos{color:var(--tm-indigo);}
  #timerApp .dw-stage.landed .dw-name{animation:dwLand .45s cubic-bezier(.2,1.4,.4,1);}
  @keyframes dwLand{from{transform:scale(.92); opacity:.4}to{transform:none; opacity:1}}
  #timerApp .dw-sub{font:400 clamp(16px,1.7vw,28px)/1.2 var(--tm-body); color:var(--tm-ink-soft); margin:.5em 0 0;}
  #timerApp .dw-list{list-style:none; margin:0; padding:0; align-self:center; display:grid; gap:clamp(6px,1vh,12px); min-width:0; counter-reset:none;}
  #timerApp .dw-list.two{grid-template-columns:repeat(2,minmax(0,1fr));}
  #timerApp .dw-list li{display:flex; align-items:center; gap:.8em; min-width:0; padding:.55em .9em .55em .55em; border-radius:999px; border:2px dashed var(--tm-mist);
    font:700 clamp(15px,1.5vw,24px)/1.1 var(--tm-body); color:var(--tm-ink-soft); transition:background .35s, border-color .35s, color .35s;}
  #timerApp .dw-list li b{flex:none; width:2em; height:2em; border-radius:50%; display:grid; place-items:center; background:var(--tm-mist); color:var(--tm-navy);
    font:800 .82em/1 var(--tm-display); font-variant-numeric:tabular-nums; transition:background .35s, color .35s;}
  #timerApp .dw-list li span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #timerApp .dw-list li.filled{border-style:solid; border-color:transparent; background:var(--tm-cream); color:var(--tm-navy);}
  #timerApp .dw-list li.filled b{background:var(--tm-navy); color:#fff;}
  #timerApp .dw-list li.now{background:var(--tm-indigo); color:#fff;}
  #timerApp .dw-list li.now b{background:#fff; color:var(--tm-indigo);}
  #timerApp .dw-list.movable li{cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;}
  #timerApp .dw-list.movable li:hover{border-color:var(--tm-mist); background:#E4E3F6;}
  #timerApp .dw-list.movable li:focus-visible{outline:3px solid var(--tm-indigo); outline-offset:2px;}
  #timerApp .dw-grip{margin-left:auto; flex:none; font-size:.9em; color:var(--tm-ink-soft); opacity:.6;}
  #timerApp .dw-list.movable li.dragging{background:var(--tm-indigo); color:#fff; box-shadow:0 10px 24px rgba(7,3,142,.3); transform:scale(1.02);}
  #timerApp .dw-list.movable li.dragging b{background:#fff; color:var(--tm-indigo);}
  #timerApp .dw-list li.dragging .dw-grip{color:#fff;}
  body.dw-dragging, body.dw-dragging *{cursor:grabbing !important;}
  #timerApp .dw-cta{align-self:flex-start; margin-top:1.4em; font:700 clamp(14px,1.2vw,18px)/1 var(--tm-display); letter-spacing:.04em; border:0; border-radius:999px;
    padding:1em 1.6em; background:var(--tm-indigo); color:#fff; cursor:pointer; transition:background .15s, transform .15s;}
  #timerApp .dw-cta:hover{background:#4440e0; transform:translateY(-1px);}
  #timerApp .dw-cta:focus-visible{outline:3px solid var(--tm-navy); outline-offset:3px;}
  #timerApp .tm-drawer textarea{font:700 16px/1.45 var(--tm-body); color:var(--tm-navy); background:#fff; border:0; border-radius:12px; padding:12px 14px; width:100%; min-height:180px; resize:vertical;}
  #timerApp .tm-drawer textarea:focus-visible{outline:3px solid #fff; outline-offset:2px;}
  #timerApp .tm-note{font:400 15px/1.35 var(--tm-body); color:var(--tm-mist); margin:-8px 0 0;}
  #timerApp a.tm-linkbtn{font:700 14px/1.1 var(--tm-display); border-radius:999px; padding:13px 16px; text-align:center; text-decoration:none; background:rgba(255,255,255,.12); color:#fff;}
  #timerApp a.tm-linkbtn:hover{background:rgba(255,255,255,.2);}
  @media(max-width:760px){ #timerApp .dw-body{grid-template-columns:1fr; overflow-y:auto;} #timerApp .dw-list.two{grid-template-columns:1fr;} }
  @media(prefers-reduced-motion:reduce){ #timerApp .dw-stage.landed .dw-name{animation:none;} }

  /* ======================= FERRAMENTAS · VISUAL DA PLATAFORMA (teste) =======================
     Alternativa ao visual Senac: fundo creme, tinta preta e Plus Jakarta Sans da plataforma,
     com as cores Senac: índigo #3630D7, azul #1854E3 e amarelo #FFB900. Liga com #timerApp.plat. */
  #timerApp.plat{
    --cpa-indigo:#3630D7; --cpa-yellow:#FFB900; --cpa-blue:#1854E3; --cpa-ink:#0F0F0F;
    --tm-indigo:var(--cpa-indigo); --tm-navy:var(--cpa-ink); --tm-cream:#F3F1EC; --tm-paper:#FFFFFF; --tm-mist:#ECEAE3;
    --tm-warn:var(--cpa-blue); --tm-alert:#DC2626; --tm-ink-soft:#8A8A85;
    --tm-display:'Plus Jakarta Sans',-apple-system,sans-serif;
    --tm-body:'Plus Jakarta Sans',-apple-system,sans-serif;
    --tm-wide:'Plus Jakarta Sans',-apple-system,sans-serif;
    background:#FCFBF8; color:var(--cpa-ink);
  }
  #timerApp.plat::before, #timerApp.plat::after{content:""; position:absolute; border-radius:9999px; filter:blur(90px); pointer-events:none;}
  #timerApp.plat::before{top:-140px; left:-100px; width:440px; height:440px; background:#FFB900; opacity:.24;}
  #timerApp.plat::after{bottom:-180px; right:-140px; width:500px; height:500px; background:#FB7014; opacity:.16;}
  #timerApp.plat .tm-stage{position:relative; z-index:1;}
  #timerApp.plat .tm-panel{border:1px solid #E4E3DC; box-shadow:0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06); border-radius:22px;}
  /* tipografia: só Plus Jakarta Sans, a fonte da plataforma */
  #timerApp.plat .tm-group, #timerApp.plat .dw-name{font-weight:800; letter-spacing:-.03em;}
  #timerApp.plat .tm-digits{font-weight:800; letter-spacing:-.04em;}
  #timerApp.plat .tm-digits .tm-colon{color:var(--cpa-blue);}
  #timerApp.plat .tm-digits.warn .tm-colon, #timerApp.plat .tm-digits.alert .tm-colon{color:inherit;}
  #timerApp.plat .dw-pos{font-weight:800; letter-spacing:-.04em; color:#ECEAE3;}
  #timerApp.plat .tm-chip, #timerApp.plat .dw-eyebrow, #timerApp.plat .tm-ap-eyebrow, #timerApp.plat .tm-ap-next, #timerApp.plat .tm-field label{letter-spacing:.08em; font-weight:700;}
  #timerApp.plat .tm-chip{background:#F3F1EC; color:#444440;}
  #timerApp.plat .dw-eyebrow{font-size:clamp(11px,1vw,16px); color:#8A8A85;}
  #timerApp.plat .tm-hint, #timerApp.plat .dw-sub{font-family:var(--tm-body); font-weight:500;}
  #timerApp.plat .tm-chip.running{background:var(--cpa-blue); color:#fff;}
  #timerApp.plat .tm-chip.warn{background:var(--cpa-yellow); color:var(--cpa-ink);}
  #timerApp.plat .tm-digits.warn{color:#D99A00;}
  #timerApp.plat .tm-track{background:#F3F1EC;}
  #timerApp.plat .tm-track i{background:var(--cpa-blue);}
  #timerApp.plat .tm-track.warn i{background:var(--cpa-yellow);}
  #timerApp.plat .tm-steps li{border:1.5px solid #E4E3DC; font-family:var(--tm-body); font-weight:600;}
  #timerApp.plat .tm-steps li.done{background:#F3F1EC; border-color:#F3F1EC; color:#444440;}
  #timerApp.plat .tm-steps li.now{background:var(--cpa-ink); border-color:var(--cpa-ink); color:#fff;}
  #timerApp.plat .tm-steps li.now b{color:var(--cpa-yellow);}
  #timerApp.plat .tm-foot{color:var(--cpa-ink);}
  #timerApp.plat .tm-foot{align-items:center; opacity:.9;}
  #timerApp.plat .tm-foot strong{font-size:13px; font-weight:700; color:#444440; display:inline;}
  #timerApp.plat .tm-foot strong::after{content:' · ';}

<script>

   (Project Settings → API → Project URL + anon public key)

const SUPABASE_URL      = "https://veefxcmqfzpnurriquri.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Dd53m02YLsnTMfX69m4euQ_B6RnDMU-";
/* ====================================================================== */

const isMockMode = !SUPABASE_URL.startsWith('http');

/* ======================================================================
   MODO DE TESTE — quando o Supabase real não está configurado, este
   objeto imita a mesma API do cliente Supabase (from/select/insert/
   update/delete/upsert/rpc/storage/auth), guardando os dados no
   armazenamento do próprio artifact (window.storage). Isso permite
   testar o fluxo inteiro aqui no chat sem nenhum backend real.
   Nada aqui é usado quando SUPABASE_URL está preenchida de verdade.
   ====================================================================== */
function createMockClient(){
  const DB_KEY = 'mock-db';
  const FILES_KEY = 'mock-files';
  let db = null;
  let files = null;
  let mockSession = null;

  function muid(){ return 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

  function seedDb(){
    const c1 = muid(), c2 = muid(), c3 = muid(), c4 = muid(), c5 = muid();
    return {
      categories: [], links: [], link_categories: [], groups: [], bancas: [], students: [], evaluators: [], scores: [],

        { id: muid(), category_id: c1, order_index: 1, question: 'O produto/serviço atende a uma necessidade real do mercado?' },
        { id: muid(), category_id: c1, order_index: 2, question: 'O produto/serviço apresenta algum diferencial inovador?' },

        { id: muid(), category_id: c5, order_index: 1, question: 'O produto/serviço tem potencial de impacto significativo na área de pessoas?' },
      ],
    };
  }

  async function loadDb(){
    if(db) return db;
    try {
      const res = await window.storage.get(DB_KEY, true);
      db = res?.value ? JSON.parse(res.value) : null;
    } catch { db = null; }
    if(!db) db = seedDb();
    return db;
  }
  async function saveDb(){
    try { await window.storage.set(DB_KEY, JSON.stringify(db), true); } catch { /* ignore in unsupported contexts */ }
  }
  async function loadFiles(){
    if(files) return files;
    try {
      const res = await window.storage.get(FILES_KEY, true);
      files = res?.value ? JSON.parse(res.value) : {};
    } catch { files = {}; }
    return files;
  }
  async function saveFiles(){
    try { await window.storage.set(FILES_KEY, JSON.stringify(files), true); } catch { /* ignore */ }
  }

  class MockQuery {
    constructor(table){ this.table = table; this._filters = []; this._order = null; this._single = false; this._action = 'select'; this._payload = null; this._onConflict = null; }
    select(){ return this; }
    order(col, opts){ this._order = { col, asc: !(opts && opts.ascending === false) }; return this; }
    eq(col, val){ this._filters.push([col, val]); return this; }
    single(){ this._single = true; return this; }
    insert(obj){ this._action = 'insert'; this._payload = obj; return this; }
    update(obj){ this._action = 'update'; this._payload = obj; return this; }
    upsert(obj, opts){ this._action = 'upsert'; this._payload = obj; this._onConflict = opts?.onConflict; return this; }
    delete(){ this._action = 'delete'; return this; }
    then(resolve, reject){ this._exec().then(resolve, reject); }
    async _exec(){
      await loadDb();
      if(!db[this.table]) db[this.table] = [];
      const rows = db[this.table];
      const matches = (row) => this._filters.every(([c, v]) => row[c] === v);

      if(this.table === 'groups' && this._action === 'insert'){
        const items = Array.isArray(this._payload) ? this._payload : [this._payload];
        const inserted = items.map(item => ({ id: item.id || muid(), created_at: new Date().toISOString(), ...item }));
        db.groups = rows.concat(inserted);
        // imita o trigger do banco real: cria as 3 bancas automaticamente
        inserted.forEach(g => {
          [1, 2, 3].forEach(stage => {
            db.bancas.push({ id: muid(), group_id: g.id, stage, scheduled_date: null, report_file_path: null, report_file_name: null, presentation_link: null });
          });
        });
        await saveDb();
        return { data: this._single ? inserted[0] : inserted, error: null };
      }
      if(this._action === 'insert'){
        const items = Array.isArray(this._payload) ? this._payload : [this._payload];
        const inserted = items.map(item => ({ id: item.id || muid(), created_at: new Date().toISOString(), ...item }));
        db[this.table] = rows.concat(inserted);
        await saveDb();
        return { data: this._single ? inserted[0] : inserted, error: null };
      }
      if(this._action === 'update'){
        db[this.table] = rows.map(r => matches(r) ? { ...r, ...this._payload } : r);
        await saveDb();
        return { data: null, error: null };
      }
      if(this._action === 'upsert'){
        const keyFields = (this._onConflict || 'id').split(',');
        const item = this._payload;
        const idx = rows.findIndex(r => keyFields.every(k => r[k] === item[k]));
        if(idx >= 0) rows[idx] = { ...rows[idx], ...item };
        else rows.push({ id: item.id || muid(), ...item });
        db[this.table] = rows;
        await saveDb();
        return { data: null, error: null };
      }
      if(this._action === 'delete'){
        db[this.table] = rows.filter(r => !matches(r));
        await saveDb();
        return { data: null, error: null };
      }
      // select
      let result = rows.filter(matches);
      if(this._order){
        result = [...result].sort((a, b) => {
          const av = a[this._order.col], bv = b[this._order.col];
          if(av == null && bv == null) return 0;
          if(av == null) return this._order.asc ? -1 : 1;
          if(bv == null) return this._order.asc ? 1 : -1;
          if(av < bv) return this._order.asc ? -1 : 1;
          if(av > bv) return this._order.asc ? 1 : -1;
          return 0;
        });
      }
      if(this._single) return { data: result[0] || null, error: null };
      return { data: result, error: null };
    }
  }

  function buildGroupsOverview(){
    const rubric = db.rubric_categories.slice().sort((a, b) => a.order_index - b.order_index).map(c => ({

    const groups = db.groups.map(g => ({

      bancas: db.bancas.filter(b => b.group_id === g.id).sort((a, b) => a.stage - b.stage).map(b => ({

    }));
    return { rubric, groups };
  }

      const id = muid();

      await saveDb();

      const g = (db.gestores || []).find(g => g.id === params.p_gestor_id);
      if(g) g.password_hash = params.p_password;

      return { data: null, error: null };

      const g = db.groups.find(x => x.slug === params.p_slug);
      if(!g) return { data: { error: 'grupo não encontrado' }, error: null };
      if(!g.password_hash || g.password_hash !== params.p_password) return { data: { error: 'senha incorreta' }, error: null };
      const bancas = db.bancas.filter(b => b.group_id === g.id).sort((a, b) => a.stage - b.stage).map(b => ({

        scores: db.scores.filter(s => s.banca_id === b.id).map(s => ({ evaluator_id: s.evaluator_id, question_id: s.question_id, rating: s.rating })),

      return {

          bancas,
        }, error: null,
      };
    }
    if(name === 'get_group_banca_comments'){
      const g = db.groups.find(x => x.slug === params.p_slug);
      if(!g || g.password_hash !== params.p_password) return { data: [], error: null };
      const groupBancaIds = (db.bancas||[]).filter(b => b.group_id === g.id).map(b => b.id);

      if(!matches.length) return { data: { error: 'e-mail não encontrado' }, error: null };
      const s = matches[0];
      if(s.status !== 'assigned' || !s.group_id) return { data: { error: 'pending' }, error: null };
      const g = db.groups.find(x => x.id === s.group_id);
      if(!g || !g.password_hash || g.password_hash !== params.p_password) return { data: { error: 'senha incorreta' }, error: null };
      const bancas = db.bancas.filter(b => b.group_id === g.id).sort((a, b) => a.stage - b.stage).map(b => ({
        id: b.id, stage: b.stage, scheduled_date: b.scheduled_date, report_file_path: b.report_file_path,
        report_file_name: b.report_file_name, presentation_link: b.presentation_link,
        evaluators: db.evaluators.filter(e => e.banca_id === b.id).map(e => ({ id: e.id, name: e.name, role: e.role, comment: e.comment })),
        scores: db.scores.filter(sc => sc.banca_id === b.id).map(sc => ({ evaluator_id: sc.evaluator_id, question_id: sc.question_id, rating: sc.rating })),
        comments: (db.banca_comments||[]).filter(c => c.banca_id === b.id).sort((a,b) => a.created_at < b.created_at ? -1 : 1),
      }));
      return {
        data: {
          id: g.id, slug: g.slug, group_name: g.group_name, project_title: g.project_title,
          students: db.students.filter(x => x.group_id === g.id).map(x => ({ full_name: x.full_name, email: x.email })),
          bancas,
        }, error: null,
      };
    }
    if(name === 'submit_banca_attachments'){
      const g = db.groups.find(x => x.slug === params.p_group_slug);
      if(!g || !g.password_hash || g.password_hash !== params.p_group_password) return { data: false, error: null };
      const banca = db.bancas.find(b => b.group_id === g.id && b.stage === params.p_stage);
      if(!banca) return { data: false, error: null };
      if(params.p_report_file_path){ banca.report_file_path = params.p_report_file_path; banca.report_file_name = params.p_report_file_name; }
      banca.presentation_link = params.p_presentation_link;
      await saveDb();
      return { data: true, error: null };
    }
    return { data: null, error: { message: `RPC mock não implementada: ${name}` } };
  }

  // getPublicUrl precisa ser síncrona (mesma assinatura do Supabase real),
  // então pré-carrega os arquivos assim que o cliente é criado.
  loadFiles();

  return {
    from(table){ return new MockQuery(table); },
    rpc: (name, params) => mockRpc(name, params || {}),
    storage: {
      from(bucket){
        return {
          async upload(path, file){
            await loadFiles();
            const base64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
              reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
              reader.readAsDataURL(file);
            });
            files[path] = { data: base64, type: file.type || 'application/octet-stream' };
            await saveFiles();
            return { data: { path }, error: null };
          },
          getPublicUrl(path){
            const f = files && files[path];
            if(!f) return { data: { publicUrl: '' } };
            return { data: { publicUrl: `data:${f.type};base64,${f.data}` } };
          },
        };
      },
    },
    auth: {
      // Modo de teste: qualquer e-mail e senha preenchidos entram como admin.
      async signInWithPassword({ email, password }){
        if(!email || !password) return { data: null, error: { message: 'Preencha e-mail e senha.' } };
        mockSession = { user: { email } };
        return { data: { session: mockSession }, error: null };
      },
      async getSession(){ return { data: { session: mockSession } }; },
      async signOut(){ mockSession = null; },
    },
  };
}

function generateRandomPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*';
  let out = '';
  for(let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];

}
function slugify(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,24) || 'GRUPO';
}
function rgba(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;

function favicons(url){

function sanitizeFileName(name){
  return name
    .normalize('NFD').replace(/[̀-ͯ]/g, '')  // remove acentos
    .replace(/[–—]/g, '-')                              // em/en dash → hífen
    .replace(/\s+/g, '_')                               // espaços → underscore

    .replace(/_{2,}/g, '_');                            // underscores duplos

/* ---- Modais próprios (substituem prompt()/confirm() nativos, que ficam
   bloqueados dentro do sandbox do preview do artifact) ---- */
function showModal(contentBuilder){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    overlay.appendChild(box);
    function close(result){ overlay.remove(); resolve(result); }
    overlay.onclick = (e) => { if(e.target === overlay) close(null); };
    document.addEventListener('keydown', function onEsc(e){
      if(e.key === 'Escape'){ document.removeEventListener('keydown', onEsc); close(null); }
    });
    contentBuilder(box, close);
    document.body.appendChild(overlay);
  });
}
function showConfirm(message, title){
  return showModal((box, close) => {
    box.innerHTML = `
      <h3>${esc(title || 'Confirmar ação')}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-sm" id="modalOk" style="border-color:#DC2626; color:#DC2626;">Confirmar</button>
      </div>`;
    box.querySelector('#modalCancel').onclick = () => close(false);
    box.querySelector('#modalOk').onclick = () => close(true);
  });
}
function showPrompt(title, fields){
  return showModal((box, close) => {
    box.innerHTML = `
      <h3>${esc(title)}</h3>
      ${fields.map(f => `
        <div style="margin-bottom:10px;">
          <span class="modal-field-label">${esc(f.label)}</span>
          <input class="field" style="margin-bottom:0;" data-key="${esc(f.key)}" placeholder="${esc(f.placeholder||'')}" value="${esc(f.value||'')}">
        </div>`).join('')}
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalOk">Salvar</button>
      </div>`;
    const inputs = box.querySelectorAll('input[data-key]');
    if(inputs[0]) inputs[0].focus();
    function submit(){
      const result = {};
      inputs.forEach(inp => { result[inp.dataset.key] = inp.value.trim(); });
      close(result);
    }
    inputs.forEach(inp => inp.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); }));
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalOk').onclick = submit;
  });
}
function showAlert(message, title){
  return showModal((box, close) => {
    box.innerHTML = `
      <h3>${esc(title || 'Aviso')}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn-primary auto" id="modalOk">OK</button>
      </div>`;
    box.querySelector('#modalOk').onclick = () => close(true);
  });
}

let openPopoverEl = null;
function closePopover(){
  if(openPopoverEl){ openPopoverEl.remove(); openPopoverEl = null; }
  document.removeEventListener('mousedown', onPopoverOutsideClick);
}
function onPopoverOutsideClick(e){
  if(openPopoverEl && !openPopoverEl.contains(e.target) && e.target !== openPopoverEl._anchor){
    closePopover();
  }
}
function showPopover(anchorEl, render){
  closePopover();
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop._anchor = anchorEl;
  pop._render = () => render(pop);
  document.body.appendChild(pop);
  const rect = anchorEl.getBoundingClientRect();
  const top = rect.bottom + window.scrollY + 8;
  let left = rect.left + window.scrollX;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 296;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
  openPopoverEl = pop;
  pop._render();
  setTimeout(() => document.addEventListener('mousedown', onPopoverOutsideClick), 0);
  return pop;
}

}
