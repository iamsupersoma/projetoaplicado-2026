<body><style>
  :root{
    --bg:#FCFBF8;
    --card:#FFFFFF;
    --ink:#0F0F0F;
    --ink-mid:#444440;
    --ink-soft:#8A8A85;
    --line:#E4E3DC;
    --radius:16px;
    --shadow:0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.06);
    --good:#16A34A;
    --warn:#D97706;
    --accent-a:#FF5FA0;
    --accent-b:#FF9152;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  .ph{vertical-align:-2px; line-height:1;}
  .icon-btn-gap{margin-right:5px;}
  html, body{
    margin:0;
    padding:0;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  /* ---- HEADER ---- */
  .site-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:200;
    border-bottom:1px solid var(--line);
    background:var(--bg);
    padding:20px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  #appRoot{
    padding-top:77px;
  }
  .logo-area{cursor:pointer; min-width:0; flex:1;}
  .logo-row{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .logo-row span.emoji{font-size:22px; line-height:1;}
  .logo-row h1{font-size:20px; font-weight:800; letter-spacing:-0.02em; color:var(--ink);}
  .logo-sub{font-size:13px; color:var(--ink-soft); font-weight:400;}

  /* ---- Lovable-referenced brand accent: pink→coral gradient ---- */
  .lv-gradient-text{
    background-image: linear-gradient(120deg, var(--accent-a) 0%, var(--accent-b) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lv-gradient-dot{ background-image: linear-gradient(135deg, var(--accent-a) 0%, var(--accent-b) 100%); }
  .hero-blob{
    position:fixed; border-radius:9999px; filter:blur(70px); pointer-events:none; z-index:-1;
  }
  @media(prefers-reduced-motion:reduce){.hero-blob{display:none;}}
  .eyebrow-badge{
    display:inline-flex; align-items:center; gap:6px; background:#F3F1EC; color:var(--ink-soft);
    font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; margin-bottom:10px;
  }
  .eyebrow-badge .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}

  .header-nav{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .nav-btn{
    font-size:13px;
    font-weight:700;
    font-family:inherit;
    padding:9px 16px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--card);
    color:var(--ink-mid);
    cursor:pointer;
    transition:.15s;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .nav-btn:hover{border-color:#A8A8A0; color:var(--ink);}
  .nav-btn.dark{background:var(--ink); border-color:var(--ink); color:#fff;}
  .nav-btn.dark:hover{background:#333;}
  .back-link{
    font-size:13.5px; font-weight:600; color:var(--ink-mid);
    text-decoration:none; display:inline-flex; align-items:center; gap:6px;
    cursor:pointer; background:none; border:none; padding:0; font-family:inherit;
  }
  .back-link:hover{color:var(--ink);}

  /* ---- MAIN ---- */
  .main{max-width:1100px; margin:0 auto; padding:20px 32px 64px;}
  .main.narrow{max-width:640px;}

  /* ---- SEARCH ---- */
  .search-wrap{position:relative; margin-bottom:20px;}
  .search-icon{position:absolute; left:18px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none;}
  .search{
    width:100%; padding:15px 18px 15px 46px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--card); font-size:14.5px;
    font-family:inherit; color:var(--ink); box-shadow:var(--shadow); outline:none; transition:.15s;
  }
  .search::placeholder{color:var(--ink-soft);}
  .search:focus{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}

  /* ---- FILTER PILLS / TABS ---- */
  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:32px;}
  .pill{
    font-size:13.5px; font-weight:600; font-family:inherit; padding:8px 18px;
    border-radius:999px; border:1.5px solid var(--line); background:var(--card);
    color:var(--ink-mid); cursor:pointer; transition:.15s;
  }
  .pill:hover{border-color:#A8A8A0; color:var(--ink);}
  .pill.active{background:var(--ink); border-color:var(--ink); color:#FFF;}
  .pill:focus-visible{outline:2px solid var(--accent-a); outline-offset:2px;}

  .tab-nav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:24px; border-bottom:1px solid var(--line); padding-bottom:16px;}
  .tab-btn{
    font-size:13.5px; font-weight:700; font-family:inherit; padding:9px 16px;
    border-radius:999px; border:1.5px solid transparent; background:transparent;
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{background:var(--ink); color:#fff;}

  .admin-layout{display:flex; align-items:flex-start; gap:28px;}
  .admin-sidebar{display:flex; flex-direction:column; gap:4px; width:190px; flex-shrink:0; position:sticky; top:20px;}
  .sidebar-tab-btn{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    width:100%; text-align:left; font-size:13.5px; font-weight:700; font-family:inherit;
    padding:11px 16px; border-radius:10px; border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; transition:.15s;
  }
  .sidebar-tab-btn:hover{color:var(--ink); background:var(--card);}
  .sidebar-tab-btn.active{background:var(--ink); color:#fff;}
  .sidebar-tab-btn:disabled{opacity:.4; cursor:not-allowed; background:transparent;}
  .sidebar-tab-btn:disabled:hover{background:transparent; color:var(--ink-soft);}
  .notif-badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    font-size:10px; font-weight:800; line-height:1; flex-shrink:0;
    background:#EF4444; color:#fff; transition:.15s;
  }
  .sidebar-tab-btn.active .notif-badge{background:rgba(255,255,255,.25); color:#fff;}
  .admin-notif-banner{
    display:flex; align-items:center; gap:10px; padding:12px 16px; margin-bottom:16px;
    background:color-mix(in srgb, #EF4444 8%, var(--card)); border:1px solid color-mix(in srgb, #EF4444 30%, var(--line));
    border-radius:var(--radius); font-size:13.5px; color:var(--ink);
  }
  .admin-notif-banner .notif-icon{font-size:16px; flex-shrink:0; color:#EF4444;}
  .notif-link{background:none; border:none; padding:0; font:inherit; font-weight:700; color:#EF4444; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .notif-link:hover{opacity:.8;}
  .admin-content{flex:1; min-width:0;}
  @media(max-width:760px){
    .admin-layout{flex-direction:column; gap:16px;}
    .admin-sidebar{width:100%; flex-direction:row; flex-wrap:wrap; position:static;}
    .sidebar-tab-btn{width:auto; border-radius:999px;}
  }

  /* ---- SECTION TITLE ---- */
  .section-title{
    font-size:22px; font-weight:800; letter-spacing:-0.02em; color:var(--ink);
    margin-bottom:20px; display:flex; align-items:baseline; gap:10px;
  }
  .section-sub{font-size:13.5px; color:var(--ink-soft); margin-top:4px; margin-bottom:20px;}
  .section-count{font-size:16px; font-weight:500; color:var(--ink-soft);}

  /* ---- GRID (links) ---- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:18px;}

  /* ---- LINK CARD ---- */
  .link-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow); transition:.2s;
  }
  .link-card:hover{transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.07), 0 12px 28px rgba(0,0,0,.09);}
  .card-top-bar{height:4px; background:var(--cat-color, #E4E3DC); width:100%; flex-shrink:0;}
  .card-body{padding:18px 20px 16px; display:flex; flex-direction:column; flex:1; gap:10px;}
  .card-header{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .card-title-row{display:flex; align-items:center; gap:9px; min-width:0;}
  .favicon{width:20px; height:20px; border-radius:5px; flex-shrink:0; object-fit:contain;}
  .card-title{
    font-size:16px; font-weight:700; color:var(--ink); text-decoration:none;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.01em;
  }
  .card-title:hover{color:#444;}
  .card-badge{
    font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:4px 9px; border-radius:999px; white-space:nowrap; flex-shrink:0;
    background:var(--badge-bg); color:var(--badge-fg);
  }
  .card-desc{font-size:13.5px; color:var(--ink-mid); line-height:1.55; flex:1;}
  .card-footer{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-top:8px; border-top:1px solid var(--line); margin-top:4px;
  }
  .card-date{font-size:11.5px; color:var(--ink-soft); font-weight:500; line-height:1.3;}
  .card-date strong{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:1px;}
  .card-actions{display:flex; align-items:center; gap:7px; flex-shrink:0;}
  .btn-copy{
    display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; padding:0;
    border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--ink-mid);
    cursor:pointer; transition:.15s; flex-shrink:0;
  }
  .btn-copy .ph{font-size:15px;}
  .btn-copy:hover{border-color:#A8A8A0; color:var(--ink);}
  .btn-access{
    font-size:12.5px; font-weight:600; font-family:inherit; padding:7px 14px; border-radius:999px;
    border:none; background:var(--ink); color:#FFF; cursor:pointer; transition:.15s;
    text-decoration:none; display:inline-flex; align-items:center; gap:4px;
  }
  .btn-access:hover{background:#333;}
  .copied-toast{
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:10px 20px;
    border-radius:999px; opacity:0; transition:.2s; pointer-events:none; z-index:99;
  }
  .copied-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---- EMPTY ---- */
  .empty{
    text-align:center; padding:80px 20px; color:var(--ink-soft); background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); grid-column:1/-1;
  }
  .empty strong{display:block; font-size:18px; color:var(--ink); margin-bottom:6px; font-weight:700;}
  .empty.small{padding:32px 20px;}

  /* ---- LOGIN / GATE BOXES ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,15,15,.45); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--card); border-radius:var(--radius); padding:28px; max-width:400px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.28); text-align:left;
  }
  .modal-box h3{font-size:17px; font-weight:800; margin-bottom:12px; color:var(--ink);}
  .modal-box p{font-size:13.5px; color:var(--ink-mid); line-height:1.55;}
  .modal-field-label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .popover{
    position:absolute; z-index:900; background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 14px 36px rgba(0,0,0,.18); padding:16px; width:280px;
  }
  .popover h4{font-size:13px; font-weight:800; color:var(--ink); margin-bottom:10px;}
  .popover .cat-chips{margin:10px 0 0;}

  .gate-box{
    max-width:400px; margin:60px auto; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:36px; text-align:center; box-shadow:var(--shadow);
  }
  .gate-box h2{font-size:20px; font-weight:800; margin-bottom:6px;}
  .gate-box p{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
  .field{
    display:block; width:100%; padding:12px 16px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:14px; color:var(--ink); margin-bottom:10px; background:var(--bg);
    outline:none; transition:.15s;
  }
  .field:focus{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}
  .btn-primary{
    display:block; width:100%; padding:12px; background:var(--ink); color:#fff; border:none;
    border-radius:999px; font-family:inherit; font-size:14.5px; font-weight:700; cursor:pointer;
    transition:.15s; margin-top:4px;
  }
  .btn-primary:hover:not(:disabled){background:#333;}
  .btn-primary:disabled{opacity:.45; cursor:default;}
  .btn-primary.auto{width:auto; display:inline-block; padding:10px 20px; border-radius:999px; margin-top:0;}
  .error-msg{font-size:13px; color:#DC2626; min-height:18px; margin:6px 0;}
  .success-msg{font-size:13px; color:var(--good); font-weight:600; min-height:18px; margin:6px 0;}

  /* ---- ADMIN BAR / SECTIONS ---- */
  .admin-bar{
    display:flex; justify-content:space-between; align-items:center; background:var(--card);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 20px; margin-bottom:24px;
    box-shadow:var(--shadow); gap:16px; flex-wrap:wrap;
  }
  .admin-bar-left{font-size:13.5px; color:var(--ink-mid);}
  .session-label{
    text-align:right; font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;
  }
  .session-label strong{color:var(--ink-mid); font-weight:600;}
  .admin-bar-left strong{color:var(--ink);}
  .btn-sm{
    font-size:13px; font-weight:600; font-family:inherit; padding:8px 16px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-mid); cursor:pointer; transition:.15s;
  }
  .btn-sm:hover{border-color:#A8A8A0; color:var(--ink);}
  .btn-sm.danger:hover{border-color:#DC2626; color:#DC2626;}
  .btn-sm.primary-outline{border-color:var(--ink); color:var(--ink);}

  .admin-section{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .admin-section h3{font-size:15px; font-weight:700; margin-bottom:4px;}
  .admin-section .hint{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}

  .form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .form-row input, .form-row textarea, .form-row select{
    flex:1; min-width:180px; padding:10px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:13.5px; color:var(--ink); background:var(--bg); outline:none; transition:.15s;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus{border-color:var(--accent-a); box-shadow:0 0 0 3px rgba(255,95,160,.14);}
  .form-row textarea{resize:vertical; min-height:40px;}
  .form-row .btn-primary{width:auto; display:inline-block; border-radius:999px; padding:10px 20px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
  .form-grid label{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:5px;}
  .form-grid .full{grid-column:1/-1;}
  @media(max-width:640px){.form-grid{grid-template-columns:1fr;}}

  .cat-chips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0;}
  .cat-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700;
    padding:6px 12px; border-radius:999px;
  }
  .cat-chip .del{border:none; background:none; cursor:pointer; font-size:14px; line-height:1; padding:0; opacity:.7;}
  .cat-chip .del:hover{opacity:1;}

  .pick-pill{
    font-size:12.5px; font-weight:600; font-family:inherit; padding:6px 14px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--card); color:var(--ink-mid); cursor:pointer; transition:.15s;
  }
  .pick-pill.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .pick-pill:hover:not(.active){border-color:#A8A8A0;}

  .admin-link-list, .simple-list{display:flex; flex-direction:column; gap:8px;}
  .admin-link-row, .simple-row{
    display:flex; justify-content:space-between; align-items:center; gap:12px; border:1px solid var(--line);
    border-radius:12px; padding:12px 16px; background:var(--bg); flex-wrap:wrap;
  }
  /* Rows sem borda própria, separados por divider — usados dentro de containers com borda */
  .picker-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-height:300px;overflow-y:auto;}
  .picker-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;transition:background .1s;}
  .picker-row:last-child{border-bottom:none;}
  .picker-row:hover{background:color-mix(in srgb,var(--accent-a) 5%,transparent);}
  .picker-row input[type=checkbox]{width:16px;height:16px;flex-shrink:0;cursor:pointer;accent-color:var(--accent-a);}
  /* Loading */
  @keyframes _spin{to{transform:rotate(360deg);}}
  .loading-state{display:flex;align-items:center;gap:8px;padding:16px 4px;font-size:13px;color:var(--ink-soft);}
  .loading-state::before{content:'';width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent-a);border-radius:50%;animation:_spin .7s linear infinite;flex-shrink:0;}
  .admin-link-row .meta, .simple-row .meta{flex:1; min-width:0;}
  .admin-link-row .meta strong, .simple-row .meta strong{font-size:13.5px; font-weight:700; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .admin-link-row .meta span, .simple-row .meta span{font-size:12px; color:var(--ink-soft);}
  .row-acts{display:flex; gap:6px; flex-shrink:0;}

  .status-badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .status-badge.pending{background:#FEF3C7; color:#92400E;}
  .status-badge.assigned{background:#DCFCE7; color:#166534;}

  .config-warning{
    background:#FEF9C3; border:1px solid #FDE047; color:#713F12; border-radius:var(--radius);
    padding:16px 20px; font-size:13.5px; line-height:1.55; margin-bottom:24px;
  }
  .config-warning code{background:rgba(0,0,0,.07); padding:2px 6px; border-radius:5px; font-size:12.5px;}
  .info-box{
    background:#EFF6FF; border:1px solid #BFDBFE; color:#1E3A8A; border-radius:var(--radius);
    padding:16px 20px; font-size:13.5px; line-height:1.55; margin-bottom:18px;
  }
  .danger-zone{
    border:1.5px solid #FCA5A5; background:#FEF2F2; border-radius:var(--radius);
    padding:20px 24px; margin-top:28px;
  }
  .danger-zone h3{color:#991B1B; font-size:15px; font-weight:800; margin-bottom:6px;}
  .danger-zone p{color:#B91C1C; font-size:13px; line-height:1.55; margin-bottom:14px;}

  /* ---- GROUP CARDS (banca list) ---- */
  .group-cards-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:14px;}
  .group-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;
    box-shadow:var(--shadow); cursor:pointer; transition:.15s; display:flex; flex-direction:column; gap:6px;
  }
  .group-card:hover{transform:translateY(-2px); box-shadow:0 4px 8px rgba(0,0,0,.07), 0 12px 28px rgba(0,0,0,.09);}
  .group-card .code{font-size:11px; font-weight:800; letter-spacing:.05em; color:var(--warn); text-transform:uppercase;}
  .group-card .proj-title{font-size:15px; font-weight:700; color:var(--ink); line-height:1.3;}
  .group-card .authors{font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stage-pill-row{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .stage-pill{padding:6px 16px;border-radius:20px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:all .15s;}
  .stage-pill:hover{border-color:var(--accent-a);color:var(--accent-a);}
  .stage-pill.active{background:var(--accent-a);border-color:var(--accent-a);color:#fff;font-weight:600;}
  .group-card .pw-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);}
  .group-card .pw-status{font-size:12px;display:inline-flex;align-items:center;gap:4px;flex:1;}
  .group-card .pw-status.has-pw{color:var(--good);}
  .group-card .pw-status.no-pw{color:var(--ink-soft);font-style:italic;}
  .group-card .pw-edit{padding:2px 7px !important;font-size:11px !important;flex-shrink:0;line-height:1.6;}

  /* ---- EVALUATORS ---- */
  .evaluator-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px; border-bottom:1px solid var(--line);
    padding:12px 4px;
  }
  .evaluator-row:last-of-type{border-bottom:none;}
  .evaluator-row .meta strong{font-size:13.5px; font-weight:700; display:block;}
  .evaluator-row .meta span{font-size:12px; color:var(--ink-soft);}
  .evaluator-row .comment{
    font-size:12.5px; color:var(--ink-mid); border-left:2px solid var(--warn); padding-left:10px; margin-top:6px; line-height:1.5;
  }

  /* ---- SCORE GRID ---- */
  .rubric-category{margin-bottom:22px;}
  .rubric-category .cat-heading{display:flex; align-items:center; gap:10px; font-size:15.5px; font-weight:800; margin-bottom:14px;}
  .rubric-category .cat-num{
    width:24px; height:24px; border-radius:50%; background:var(--warn); color:#fff; font-size:12.5px;
    font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .rubric-question{margin-bottom:14px;}
  .rubric-question .q-text{font-size:13.5px; font-weight:600; color:var(--ink-mid); margin-bottom:8px;}
  .score-eval-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px;}
  .score-cell{
    border:1.5px solid var(--line); border-radius:12px; padding:8px 10px; background:var(--bg); transition:.15s;
  }
  .score-cell.answered{border-color:#86EFAC; background:#F0FDF4;}

  /* ---- Resultados (visualização, sem cara de formulário) ---- */
  .result-eval-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:8px;}
  .result-cell{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 12px; border-radius:10px; background:var(--bg); border:1px solid var(--line);
  }
  .result-eval-name{font-size:12.5px; font-weight:600; color:var(--ink-mid);}
  .result-badge{font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; white-space:nowrap;}
  .result-badge.rating-excelente{background:#DCFCE7; color:#166534;}
  .result-badge.rating-muito_bom{background:#DBEAFE; color:#1E40AF;}
  .result-badge.rating-bom{background:#FEF3C7; color:#92400E;}
  .result-badge.rating-regular{background:#FFEDD5; color:#9A3412;}
  .result-badge.rating-muito_fraco{background:#FEE2E2; color:#991B1B;}
  .result-badge.rating-none{background:#EFEDE6; color:var(--ink-soft);}

  /* ---- Painel de resultados (nota geral / distribuição / médias) ---- */
  .stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px;}
  @media(max-width:720px){.stats-grid{grid-template-columns:1fr;}}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow);}
  .stat-card .stat-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:14px;}
  .stat-big-number{display:flex; align-items:baseline; gap:6px; line-height:1;}
  .stat-big-number .num{font-size:42px; font-weight:800; color:var(--ink);}
  .stat-big-number .denom{font-size:16px; font-weight:600; color:var(--ink-soft);}
  .stat-bar-track{height:8px; border-radius:999px; background:#E4E3DC; overflow:hidden; margin-top:16px;}
  .stat-bar-fill{height:100%; border-radius:999px; background:#16A34A;}
  .stat-concept{margin-top:14px; font-size:13.5px; color:var(--ink-mid);}
  .stat-concept strong{font-weight:700;}
  .stat-empty{font-size:13px; color:var(--ink-soft);}

  .dist-row{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .dist-row:last-child{margin-bottom:0;}
  .dist-label{width:88px; font-size:13px; color:var(--ink-mid); flex-shrink:0;}
  .dist-track{flex:1; height:8px; border-radius:999px; background:#E4E3DC; overflow:hidden;}
  .dist-fill{height:100%; border-radius:999px;}
  .dist-count{width:64px; text-align:right; font-size:12.5px; color:var(--ink-soft); flex-shrink:0;}

  .criteria-heading{font-size:20px; font-weight:800; color:var(--ink); margin:6px 0 16px;}
  .criteria-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:14px; margin-bottom:28px;}
  .criteria-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .criteria-card .crit-num{font-size:12px; font-weight:800; color:var(--warn); margin-bottom:8px;}
  .criteria-card .crit-title{font-size:14px; font-weight:700; color:var(--ink); margin-bottom:14px; line-height:1.35; min-height:38px;}
  .criteria-card .crit-score{display:flex; align-items:baseline; gap:5px; margin-bottom:12px;}
  .criteria-card .crit-score .num{font-size:26px; font-weight:800; color:var(--ink);}
  .criteria-card .crit-score .denom{font-size:13px; font-weight:600; color:var(--ink-soft);}

const SUPABASE_URL      = "https://veefxcmqfzpnurriquri.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Dd53m02YLsnTMfX69m4euQ_B6RnDMU-";

const isMockMode = !SUPABASE_URL.startsWith('http');

/* ======================================================================
   MODO DE TESTE — quando o Supabase real não está configurado, este
   objeto imita a mesma API do cliente Supabase (from/select/insert/
   update/delete/upsert/rpc/storage/auth), guardando os dados no
   armazenamento do próprio artifact (window.storage). Isso permite
   testar o fluxo inteiro aqui no chat sem nenhum backend real.
   Nada aqui é usado quando SUPABASE_URL está preenchida de verdade.
   ====================================================================== */
function createMockClient(){
  const DB_KEY = 'mock-db';
  const FILES_KEY = 'mock-files';
  let db = null;
  let files = null;
  let mockSession = null;

  function muid(){ return 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }

  function seedDb(){
    const c1 = muid(), c2 = muid(), c3 = muid(), c4 = muid(), c5 = muid();
    return {
      categories: [], links: [], link_categories: [], groups: [], bancas: [], students: [], evaluators: [], scores: [],

        { id: c1, order_index: 1, title: 'Relevância e Inovação do Produto/Serviço' },

        { id: c4, order_index: 4, title: 'Apresentação e Comunicação' },
        { id: c5, order_index: 5, title: 'Impacto Potencial' },
      ],
      rubric_questions: [
        { id: muid(), category_id: c1, order_index: 1, question: 'O produto/serviço atende a uma necessidade real do mercado?' },
        { id: muid(), category_id: c1, order_index: 2, question: 'O produto/serviço apresenta algum diferencial inovador?' },
        { id: muid(), category_id: c2, order_index: 1, question: 'O projeto é bem embasado teoricamente?' },
        { id: muid(), category_id: c3, order_index: 1, question: 'O projeto é tecnicamente viável?' },

        { id: muid(), category_id: c4, order_index: 2, question: 'Os alunos souberam responder adequadamente às perguntas dos avaliadores?' },
        { id: muid(), category_id: c5, order_index: 1, question: 'O produto/serviço tem potencial de impacto significativo na área de pessoas?' },
      ],
    };
  }

  async function loadDb(){
    if(db) return db;
    try {
      const res = await window.storage.get(DB_KEY, true);
      db = res?.value ? JSON.parse(res.value) : null;
    } catch { db = null; }
    if(!db) db = seedDb();
    return db;
  }
  async function saveDb(){
    try { await window.storage.set(DB_KEY, JSON.stringify(db), true); } catch { /* ignore in unsupported contexts */ }
  }
  async function loadFiles(){
    if(files) return files;
    try {
      const res = await window.storage.get(FILES_KEY, true);
      files = res?.value ? JSON.parse(res.value) : {};
    } catch { files = {}; }
    return files;
  }
  async function saveFiles(){
    try { await window.storage.set(FILES_KEY, JSON.stringify(files), true); } catch { /* ignore */ }
  }

  class MockQuery {
    constructor(table){ this.table = table; this._filters = []; this._order = null; this._single = false; this._action = 'select'; this._payload = null; this._onConflict = null; }
    select(){ return this; }
    order(col, opts){ this._order = { col, asc: !(opts && opts.ascending === false) }; return this; }
    eq(col, val){ this._filters.push([col, val]); return this; }
    single(){ this._single = true; return this; }
    insert(obj){ this._action = 'insert'; this._payload = obj; return this; }
    update(obj){ this._action = 'update'; this._payload = obj; return this; }
    upsert(obj, opts){ this._action = 'upsert'; this._payload = obj; this._onConflict = opts?.onConflict; return this; }
    delete(){ this._action = 'delete'; return this; }
    then(resolve, reject){ this._exec().then(resolve, reject); }
    async _exec(){
      await loadDb();
      if(!db[this.table]) db[this.table] = [];
      const rows = db[this.table];
      const matches = (row) => this._filters.every(([c, v]) => row[c] === v);

      if(this.table === 'groups' && this._action === 'insert'){
        const items = Array.isArray(this._payload) ? this._payload : [this._payload];
        const inserted = items.map(item => ({ id: item.id || muid(), created_at: new Date().toISOString(), ...item }));
        db.groups = rows.concat(inserted);
        // imita o trigger do banco real: cria as 3 bancas automaticamente
        inserted.forEach(g => {
          [1, 2, 3].forEach(stage => {
            db.bancas.push({ id: muid(), group_id: g.id, stage, scheduled_date: null, report_file_path: null, report_file_name: null, presentation_link: null });
          });
        });
        await saveDb();
        return { data: this._single ? inserted[0] : inserted, error: null };
      }
      if(this._action === 'insert'){
        const items = Array.isArray(this._payload) ? this._payload : [this._payload];
        const inserted = items.map(item => ({ id: item.id || muid(), created_at: new Date().toISOString(), ...item }));
        db[this.table] = rows.concat(inserted);
        await saveDb();
        return { data: this._single ? inserted[0] : inserted, error: null };
      }
      if(this._action === 'update'){
        db[this.table] = rows.map(r => matches(r) ? { ...r, ...this._payload } : r);
        await saveDb();
        return { data: null, error: null };
      }
      if(this._action === 'upsert'){
        const keyFields = (this._onConflict || 'id').split(',');
        const item = this._payload;
        const idx = rows.findIndex(r => keyFields.every(k => r[k] === item[k]));
        if(idx >= 0) rows[idx] = { ...rows[idx], ...item };
        else rows.push({ id: item.id || muid(), ...item });
        db[this.table] = rows;
        await saveDb();
        return { data: null, error: null };
      }
      if(this._action === 'delete'){
        db[this.table] = rows.filter(r => !matches(r));
        await saveDb();
        return { data: null, error: null };
      }
      // select
      let result = rows.filter(matches);
      if(this._order){
        result = [...result].sort((a, b) => {
          const av = a[this._order.col], bv = b[this._order.col];
          if(av == null && bv == null) return 0;
          if(av == null) return this._order.asc ? -1 : 1;
          if(bv == null) return this._order.asc ? 1 : -1;
          if(av < bv) return this._order.asc ? -1 : 1;
          if(av > bv) return this._order.asc ? 1 : -1;
          return 0;
        });
      }
      if(this._single) return { data: result[0] || null, error: null };
      return { data: result, error: null };
    }
  }

  function buildGroupsOverview(){
    const rubric = db.rubric_categories.slice().sort((a, b) => a.order_index - b.order_index).map(c => ({

    return { rubric, groups };
  }

        stage: b.stage, scheduled_date: b.scheduled_date, report_file_path: b.report_file_path,
        report_file_name: b.report_file_name, presentation_link: b.presentation_link,
        evaluators: db.evaluators.filter(e => e.banca_id === b.id).map(e => ({ id: e.id, name: e.name, role: e.role, comment: e.comment })),
        scores: db.scores.filter(sc => sc.banca_id === b.id).map(sc => ({ evaluator_id: sc.evaluator_id, question_id: sc.question_id, rating: sc.rating })),
      }));
      return {
        data: {
          id: g.id, slug: g.slug, group_name: g.group_name, project_title: g.project_title,
          students: db.students.filter(x => x.group_id === g.id).map(x => ({ full_name: x.full_name, email: x.email })),
          bancas,
        }, error: null,
      };
    }
    if(name === 'submit_banca_attachments'){
      const g = db.groups.find(x => x.slug === params.p_group_slug);
      if(!g || !g.password_hash || g.password_hash !== params.p_group_password) return { data: false, error: null };
      const banca = db.bancas.find(b => b.group_id === g.id && b.stage === params.p_stage);
      if(!banca) return { data: false, error: null };
      if(params.p_report_file_path){ banca.report_file_path = params.p_report_file_path; banca.report_file_name = params.p_report_file_name; }
      banca.presentation_link = params.p_presentation_link;
      await saveDb();
      return { data: true, error: null };
    }
    return { data: null, error: { message: `RPC mock não implementada: ${name}` } };
  }

  // getPublicUrl precisa ser síncrona (mesma assinatura do Supabase real),
  // então pré-carrega os arquivos assim que o cliente é criado.
  loadFiles();

  return {
    from(table){ return new MockQuery(table); },
    rpc: (name, params) => mockRpc(name, params || {}),
    storage: {
      from(bucket){
        return {
          async upload(path, file){
            await loadFiles();
            const base64 = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
              reader.onerror = () => reject(new Error('Falha ao ler o arquivo.'));
              reader.readAsDataURL(file);
            });
            files[path] = { data: base64, type: file.type || 'application/octet-stream' };
            await saveFiles();
            return { data: { path }, error: null };
          },
          getPublicUrl(path){
            const f = files && files[path];
            if(!f) return { data: { publicUrl: '' } };
            return { data: { publicUrl: `data:${f.type};base64,${f.data}` } };
          },
        };
      },
    },
    auth: {
      // Modo de teste: qualquer e-mail e senha preenchidos entram como admin.
      async signInWithPassword({ email, password }){
        if(!email || !password) return { data: null, error: { message: 'Preencha e-mail e senha.' } };
        mockSession = { user: { email } };
        return { data: { session: mockSession }, error: null };
      },
      async getSession(){ return { data: { session: mockSession } }; },
      async signOut(){ mockSession = null; },
    },
  };
}

function fmtDate(iso){ if(!iso) return ''; try{ return new Date(iso).toLocaleDateString('pt-BR'); }catch{ return ''; } }

function generateRandomPassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%&*';
  let out = '';
  for(let i = 0; i < 5; i++) out += chars[Math.floor(Math.random() * chars.length)];

function slugify(s){
  return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,24) || 'GRUPO';
}
function rgba(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function favicons(url){
  try{

    return [`https://www.google.com/s2/favicons?domain=${h}&sz=64`, `https://icons.duckduckgo.com/ip3/${h}.ico`, `https://${h}/favicon.ico`];

function sanitizeFileName(name){
  return name
    .normalize('NFD').replace(/[̀-ͯ]/g, '')  // remove acentos
    .replace(/[–—]/g, '-')                              // em/en dash → hífen
    .replace(/\s+/g, '_')                               // espaços → underscore
    .replace(/[^a-zA-Z0-9._\-]/g, '')                  // remove demais especiais
    .replace(/_{2,}/g, '_');                            // underscores duplos

/* ---- Modais próprios (substituem prompt()/confirm() nativos, que ficam
   bloqueados dentro do sandbox do preview do artifact) ---- */
function showModal(contentBuilder){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const box = document.createElement('div');
    box.className = 'modal-box';
    overlay.appendChild(box);
    function close(result){ overlay.remove(); resolve(result); }
    overlay.onclick = (e) => { if(e.target === overlay) close(null); };
    document.addEventListener('keydown', function onEsc(e){
      if(e.key === 'Escape'){ document.removeEventListener('keydown', onEsc); close(null); }
    });
    contentBuilder(box, close);
    document.body.appendChild(overlay);
  });
}
function showConfirm(message, title){
  return showModal((box, close) => {
    box.innerHTML = `
      <h3>${esc(title || 'Confirmar ação')}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-sm" id="modalOk" style="border-color:#DC2626; color:#DC2626;">Confirmar</button>
      </div>`;
    box.querySelector('#modalCancel').onclick = () => close(false);
    box.querySelector('#modalOk').onclick = () => close(true);
  });
}
function showPrompt(title, fields){
  return showModal((box, close) => {
    box.innerHTML = `
      <h3>${esc(title)}</h3>
      ${fields.map(f => `
        <div style="margin-bottom:10px;">
          <span class="modal-field-label">${esc(f.label)}</span>
          <input class="field" style="margin-bottom:0;" data-key="${esc(f.key)}" placeholder="${esc(f.placeholder||'')}" value="${esc(f.value||'')}">
        </div>`).join('')}
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalOk">Salvar</button>
      </div>`;
    const inputs = box.querySelectorAll('input[data-key]');
    if(inputs[0]) inputs[0].focus();
    function submit(){
      const result = {};
      inputs.forEach(inp => { result[inp.dataset.key] = inp.value.trim(); });
      close(result);
    }
    inputs.forEach(inp => inp.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); }));
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalOk').onclick = submit;
  });
}
function showAlert(message, title){
  return showModal((box, close) => {
    box.innerHTML = `
      <h3>${esc(title || 'Aviso')}</h3>
      <p>${esc(message)}</p>
      <div class="modal-actions">
        <button class="btn-primary auto" id="modalOk">OK</button>
      </div>`;
    box.querySelector('#modalOk').onclick = () => close(true);
  });
}

let openPopoverEl = null;
function closePopover(){
  if(openPopoverEl){ openPopoverEl.remove(); openPopoverEl = null; }
  document.removeEventListener('mousedown', onPopoverOutsideClick);
}
function onPopoverOutsideClick(e){
  if(openPopoverEl && !openPopoverEl.contains(e.target) && e.target !== openPopoverEl._anchor){
    closePopover();
  }
}
function showPopover(anchorEl, render){
  closePopover();
  const pop = document.createElement('div');
  pop.className = 'popover';
  pop._anchor = anchorEl;
  pop._render = () => render(pop);
  document.body.appendChild(pop);
  const rect = anchorEl.getBoundingClientRect();
  const top = rect.bottom + window.scrollY + 8;
  let left = rect.left + window.scrollX;
  const maxLeft = window.scrollX + document.documentElement.clientWidth - 296;
  if(left > maxLeft) left = Math.max(8, maxLeft);
  pop.style.top = top + 'px';
  pop.style.left = left + 'px';
  openPopoverEl = pop;
  pop._render();
  setTimeout(() => document.addEventListener('mousedown', onPopoverOutsideClick), 0);
  return pop;
}

function parseRouteFromLocation(){
  try {
    const p = new URLSearchParams(location.search);
    if(p.get('admin') === '1') return { name: 'admin', slug: null };
    if(p.get('aluno') === '1') return { name: 'aluno', slug: null };
    if(p.get('grupo')) return { name: 'grupo', slug: p.get('grupo') };
  } catch { /* about:srcdoc and similar sandboxed contexts */ }
  return { name: 'home', slug: null };
}

function navigateTo(routeObj, search){
  currentRoute = routeObj;
  // Best-effort URL sync — some preview contexts (e.g. a sandboxed srcdoc
  // iframe) reject pushState entirely. The route itself lives in memory
  // above, so navigation keeps working either way.
  try { history.pushState(null, '', search); } catch { /* ignore */ }
  renderRoute();
}

async function submitStudentRegistration(){

async function submitStudentLogin(){
  const email = $('alunoLoginEmail').value.trim();
  const password = $('alunoLoginPassword').value;
  $('alunoLoginError').textContent = '';
  if(!email || !password){ $('alunoLoginError').textContent = 'Preencha e-mail e senha.'; return; }
  $('alunoLoginBtn').disabled = true;
  const { data, error } = await sb.rpc('student_group_login', { p_email: email, p_password: password });
  $('alunoLoginBtn').disabled = false;
  if(error){ $('alunoLoginError').textContent = 'Não foi possível entrar agora. Tente novamente.'; return; }
  if(!data || data.error === 'e-mail não encontrado'){ $('alunoLoginError').textContent = 'E-mail não encontrado. Use a aba "Quero me registrar".'; return; }
  if(data.error === 'pending'){ $('alunoLoginError').textContent = 'Seu registro ainda está pendente — aguarde o professor te incluir em um grupo.'; return; }
  if(data.error === 'senha incorreta'){ $('alunoLoginError').textContent = 'Senha incorreta.'; return; }
  await loadRubric();
  groupSession = { slug: data.slug, password };
  currentRoute = { name: 'grupo', slug: data.slug };
  renderHeaderNav();
  renderGrupoPublic(data);
}

function renderRubricGrid(rubricData, group, opts){
  const wrapper = document.createElement('div');
  const evaluators = group.evaluators || [];
  const scores = group.scores || [];
  if(!evaluators.length){
    wrapper.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum avaliador cadastrado para este grupo ainda.</p>';
    return wrapper;
  }
  rubricData.forEach(cat => {
    const catDiv = document.createElement('div'); catDiv.className = 'rubric-category';
    const heading = document.createElement('div'); heading.className = 'cat-heading';
    heading.innerHTML = `<span class="cat-num">${cat.order_index}</span>${esc(cat.title)}`;
    catDiv.appendChild(heading);
    (cat.questions||[]).forEach(q => {
      const qDiv = document.createElement('div'); qDiv.className = 'rubric-question';
      const qText = document.createElement('div'); qText.className = 'q-text'; qText.textContent = q.question;
      qDiv.appendChild(qText);
      const grid = document.createElement('div'); grid.className = 'score-eval-grid';
      evaluators.forEach(ev => {
        const existing = scores.find(s => s.evaluator_id === ev.id && s.question_id === q.id);
        const cell = document.createElement('div');
        cell.className = 'score-cell' + (existing && existing.rating ? ' answered' : '');
        const nameRow = document.createElement('div'); nameRow.className = 'eval-name';
        const nameSpan = document.createElement('span'); nameSpan.textContent = ev.name;
        const checkSpan = document.createElement('span'); checkSpan.className = 'check';
        checkSpan.innerHTML = existing && existing.rating ? phIcon('check', {weight:'bold'}) : '';
        nameRow.append(nameSpan, checkSpan);
        const select = document.createElement('select');
        select.disabled = !opts.canEdit;
        select.innerHTML = '<option value="">— sem nota —</option>' +
          RATING_ORDER.map(r => `<option value="${r}" ${existing && existing.rating===r ? 'selected':''}>${RATING_LABELS[r]}</option>`).join('');
        if(opts.canEdit){
          select.onchange = async () => {
            select.disabled = true;
            await opts.onScoreChange(ev.id, q.id, select.value || null);
            select.disabled = false;
            cell.classList.toggle('answered', !!select.value);
            checkSpan.innerHTML = select.value ? phIcon('check', {weight:'bold'}) : '';
          };
        }
        cell.append(nameRow, select);
        grid.appendChild(cell);
      });
      qDiv.appendChild(grid); catDiv.appendChild(qDiv);
    });
    wrapper.appendChild(catDiv);
  });
  return wrapper;
}

/* ---- Versão de visualização (sem cara de formulário) — usada só na
   página pública do grupo, mostra o conceito como selo, não como select ---- */
/* ---- Painel de resultados: nota geral, distribuição, médias por critério ---- */
const RATING_VALUES = { muito_fraco: 1, regular: 2, bom: 3, muito_bom: 4, excelente: 5 };
const RATING_BAR_COLORS = { muito_fraco: '#DC2626', regular: '#D97706', bom: '#D4A017', muito_bom: '#4ADE80', excelente: '#16A34A' };

function computeBancaStats(rubricData, banca){
  const scores = (banca.scores || []).filter(s => s.rating && RATING_VALUES[s.rating] != null);
  const total = scores.length;
  const overallAvg = total ? scores.reduce((sum, s) => sum + RATING_VALUES[s.rating], 0) / total : null;

  const distribution = {};
  RATING_ORDER.forEach(r => { distribution[r] = 0; });
  scores.forEach(s => { distribution[s.rating]++; });

  const perCategory = rubricData.map(cat => {
    const qIds = new Set((cat.questions || []).map(q => q.id));
    const catScores = scores.filter(s => qIds.has(s.question_id));
    const avg = catScores.length ? catScores.reduce((sum, s) => sum + RATING_VALUES[s.rating], 0) / catScores.length : null;
    return { title: cat.title, order_index: cat.order_index, avg };
  });

  return { overallAvg, total, distribution, perCategory };
}
function nearestRatingKey(avg){
  const rounded = Math.min(5, Math.max(1, Math.round(avg)));
  return RATING_ORDER[rounded - 1];
}
function renderResultsDashboard(rubricData, banca){
  const wrapper = document.createElement('div');
  const stats = computeBancaStats(rubricData, banca);

  const statsGrid = document.createElement('div');
  statsGrid.className = 'stats-grid';

  const geralCard = document.createElement('div');
  geralCard.className = 'stat-card';
  if(stats.overallAvg == null){
    geralCard.innerHTML = `<div class="stat-label">Nota geral</div><p class="stat-empty">A banca ainda não avaliou esta etapa.</p>`;
  } else {
    const key = nearestRatingKey(stats.overallAvg);
    const pct = (stats.overallAvg / 5) * 100;
    geralCard.innerHTML = `
      <div class="stat-label">Nota geral</div>
      <div class="stat-big-number"><span class="num">${stats.overallAvg.toFixed(2)}</span><span class="denom">/ 5,00</span></div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%; background:${RATING_BAR_COLORS[key]};"></div></div>
      <div class="stat-concept">Conceito final: <strong style="color:${RATING_BAR_COLORS[key]}">${esc(RATING_LABELS[key])}</strong></div>`;
  }
  statsGrid.appendChild(geralCard);

  const distCard = document.createElement('div');
  distCard.className = 'stat-card';
  const distRows = RATING_ORDER.map(r => {
    const count = stats.distribution[r];
    const pct = stats.total ? (count / stats.total) * 100 : 0;
    return `
      <div class="dist-row">
        <span class="dist-label">${esc(RATING_LABELS[r])}</span>
        <div class="dist-track"><div class="dist-fill" style="width:${pct}%; background:${RATING_BAR_COLORS[r]};"></div></div>
        <span class="dist-count">${count} (${Math.round(pct)}%)</span>
      </div>`;
  }).join('');
  distCard.innerHTML = `<div class="stat-label">Distribuição das avaliações</div>${distRows}`;
  statsGrid.appendChild(distCard);

  wrapper.appendChild(statsGrid);

  const critHeading = document.createElement('div');
  critHeading.className = 'criteria-heading';
  critHeading.textContent = 'Médias por Critério';
  wrapper.appendChild(critHeading);

  const critGrid = document.createElement('div');
  critGrid.className = 'criteria-grid';
  stats.perCategory.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'criteria-card';
    if(cat.avg == null){
      card.innerHTML = `<div class="crit-num">${String(cat.order_index).padStart(2,'0')}</div><div class="crit-title">${esc(cat.title)}</div><p class="stat-empty">Sem notas ainda.</p>`;
    } else {
      const key = nearestRatingKey(cat.avg);
      const pct = (cat.avg / 5) * 100;
      card.innerHTML = `
        <div class="crit-num">${String(cat.order_index).padStart(2,'0')}</div>
        <div class="crit-title">${esc(cat.title)}</div>
        <div class="crit-score"><span class="num">${cat.avg.toFixed(2)}</span><span class="denom">/ 5</span></div>
        <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%; background:${RATING_BAR_COLORS[key]};"></div></div>`;
    }
    critGrid.appendChild(card);
  });
  wrapper.appendChild(critGrid);

  return wrapper;
}

  const wrapper = document.createElement('div');

  if(!evaluators.length){

  readerPassword = pw;

let leituraData = null; // { reader_id, reader_name, reader_stages, rubric, groups }

function myAssignments(g){
  if(!readerStages.length) return [];
  return (g.bancas || [])
    .filter(b => readerStages.includes(b.stage))
    .map(b => ({
      banca: b,
      evaluator: (b.evaluators || []).find(e => e.reader_id === leituraData.reader_id) || null,
    }));
}
function myProgress(banca, evaluatorId){
  const total = (leituraData.rubric || []).reduce((sum, cat) => sum + (cat.questions || []).length, 0);
  if(!evaluatorId) return { answered: 0, total };
  const answered = (banca.scores || []).filter(s => s.evaluator_id === evaluatorId && s.rating).length;
  return { answered, total };
}

function renderLeituraPanel(data){
  leituraData = data;
  readerStages = data.reader_stages || [];
  renderLeituraGroupList();
}
function renderLeituraGroupList(){
  const allGroups = leituraData.groups || [];
  const myGroups = allGroups.filter(g => myAssignments(g).length > 0);
  root().innerHTML = `
    <div class="main">
      <div class="section-title">Olá, ${esc(leituraData.reader_name || '')} <span class="section-count">(${myGroups.length} ${myGroups.length === 1 ? 'grupo' : 'grupos'})</span></div>
      <div class="section-sub">Selecione o grupo para lançar as notas.</div>
      <div class="group-cards-grid" id="leituraGroupsGrid"></div>
    </div>`;
  const grid = $('leituraGroupsGrid');
  if(!myGroups.length){
    const msg = readerStages.length
      ? '<div class="empty small"><strong>Nenhum grupo cadastrado para as suas etapas ainda</strong>Aguarde o professor finalizar a configuração dos grupos.</div>'
      : '<div class="empty small"><strong>Você ainda não foi atribuído a nenhuma etapa</strong>Fale com o professor para ser adicionado a uma banca.</div>';
    grid.innerHTML = msg;
    return;
  }
  myGroups.forEach(g => {
    const assignments = myAssignments(g);
    const card = document.createElement('div'); card.className = 'group-card';
    let subtitle;
    if(assignments.length === 1){
      const { answered, total } = myProgress(assignments[0].banca, assignments[0].evaluator?.id);
      subtitle = `${esc(BANCA_LABELS[assignments[0].banca.stage])} · ${answered}/${total} respondidas`;
    } else {
      subtitle = `${assignments.length} etapas atribuídas a você`;
    }
    card.innerHTML = `<span class="proj-title">${esc(g.project_title || g.group_name)}</span><span class="authors">${subtitle}</span>`;
    card.onclick = () => openGroupAssignment(g);
    grid.appendChild(card);
  });
}
function openGroupAssignment(g){
  const assignments = myAssignments(g);
  if(assignments.length === 1){
    const { banca, evaluator } = assignments[0];
    openNotesWizard(leituraData.rubric || [], g, banca, evaluator, () => renderLeituraGroupList());
    return;
  }
  root().innerHTML = `
    <div class="main">
      <button type="button" class="back-link" id="leituraBack" style="margin-bottom:16px; display:inline-flex;">${phIcon('arrow-left')}Voltar aos grupos</button>
      <div class="section-title" style="margin-bottom:2px;">${esc(g.project_title || g.group_name)}</div>
      <div class="section-sub">Você está em mais de uma etapa deste grupo — escolha qual avaliar.</div>
      <div class="group-cards-grid" id="leituraStageGrid"></div>
    </div>`;
  $('leituraBack').onclick = () => renderLeituraGroupList();
  const grid = $('leituraStageGrid');
  assignments.forEach(({ banca, evaluator }) => {
    const { answered, total } = myProgress(banca, evaluator?.id);
    const card = document.createElement('div'); card.className = 'group-card';
    card.innerHTML = `<span class="proj-title">${esc(BANCA_LABELS[banca.stage])}</span><span class="authors">${answered}/${total} respondidas${banca.scheduled_date ? ' · ' + fmtDate(banca.scheduled_date) : ''}</span>`;
    card.onclick = () => openNotesWizard(leituraData.rubric || [], g, banca, evaluator, () => renderLeituraGroupList());
    grid.appendChild(card);
  });
}

  adminGroups = data || [];
}
async function loadAdminStudents(){
  const { data } = await sb.from('students').select('*').order('created_at');
  adminStudents = data || [];
}
function renderAdminPanel(){
  const pendingStudents = adminStudents.filter(s => s.status === 'pending').length;
  const groupsSemSenha = adminGroups.filter(g => !g.password_hash).length;

  root().innerHTML = `
    <div class="main">
      <div class="session-label">Logado como <strong>${esc(session?.user?.email || '')}</strong></div>
      <div id="adminNotifArea"></div>
      <div class="admin-layout">
        <div class="admin-sidebar" id="adminTabNav"></div>
        <div class="admin-content" id="adminTabBody"></div>
      </div>
    </div>`;

  const tabs = [ ['links','Links'], ['alunos','Alunos'], ['grupos','Grupos'], ['bancas','Bancas'], ['usuarios','Usuários'], ['config','Configurações'] ];
  const badges = { alunos: pendingStudents, grupos: groupsSemSenha };
  const nav = $('adminTabNav');
  tabs.forEach(([id,label]) => {
    const b = document.createElement('button');
    b.className = 'sidebar-tab-btn' + (adminTab === id ? ' active' : '');
    const count = badges[id] || 0;
    b.innerHTML = `<span>${esc(label)}</span>${count ? `<span class="notif-badge">${count}</span>` : ''}`;
    b.onclick = () => { adminTab = id; openGroupId = null; renderAdminPanel(); };
    nav.appendChild(b);
  });

  const body = $('adminTabBody');

  // Banner de notificações pendentes (container separado, não sobrescrito pelas tabs)
  const notifArea = $('adminNotifArea');
  const items = [];
  if(pendingStudents) items.push(`<button class="notif-link" data-tab="alunos">${pendingStudents} aluno${pendingStudents > 1 ? 's' : ''} aguardando atribuição</button>`);
  if(groupsSemSenha) items.push(`<button class="notif-link" data-tab="grupos">${groupsSemSenha} grupo${groupsSemSenha > 1 ? 's' : ''} sem senha definida</button>`);
  if(items.length){
    notifArea.innerHTML = `
      <div class="admin-notif-banner">
        <span class="notif-icon">${phIcon('bell-ringing', {weight:'fill'})}</span>
        <span>Atenção: ${items.join(' · ')}</span>
      </div>`;
    notifArea.querySelectorAll('.notif-link').forEach(btn => {
      btn.onclick = () => { adminTab = btn.dataset.tab; openGroupId = null; renderAdminPanel(); };
    });
  }

  if(adminTab === 'links') renderAdminLinksTab(body);
  else if(adminTab === 'alunos') renderAdminAlunosTab(body);
  else if(adminTab === 'grupos') { openGroupId ? renderAdminGroupDetail(body, openGroupId) : renderAdminGruposTab(body); }
  else if(adminTab === 'bancas') renderAdminBancasTab(body);
  else if(adminTab === 'usuarios') renderAdminUsuariosTab(body);
  else if(adminTab === 'config') renderAdminConfigTab(body);
}

const PALETTE = ['#2563EB','#16A34A','#DC2626','#9333EA','#D97706','#0891B2','#DB2777','#475569'];
function nextColor(){
  const used = new Set(categories.map(c => c.color));
  const pool = PALETTE.filter(c => !used.has(c));
  const src = pool.length ? pool : PALETTE;
  return src[Math.floor(Math.random() * src.length)];
}

async function importLinksFromCSV(file, body){
  if(!file) return;
  const status = $('csvImportStatus');
  status.style.display = 'block';
  status.style.background = '#FEF9C3';
  status.style.color = '#713F12';
  status.textContent = 'Lendo arquivo…';

  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if(!lines.length){ status.textContent = 'Arquivo vazio.'; return; }

  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';

  function parseCSVLine(line){
    const cols=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'&&!inQ){inQ=true;continue;}
      if(c==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;continue;}
      if(c==='"'&&inQ){inQ=false;continue;}
      if(c===sep&&!inQ){cols.push(cur.trim());cur='';continue;}
      cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  }

  const header = parseCSVLine(lines[0]).map(h => h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''));
  const iTitle = header.findIndex(h => h.includes('tit') || h.includes('nom') || h.includes('name'));
  const iUrl   = header.findIndex(h => h.includes('url') || h.includes('link') || h.includes('end'));
  const iDesc  = header.findIndex(h => h.includes('desc') || h.includes('obs'));
  const iCat   = header.findIndex(h => h.includes('cat') || h.includes('tipo') || h.includes('tag'));

  if(iUrl === -1){
    status.style.background='#FEE2E2'; status.style.color='#991B1B';
    status.textContent='Coluna de URL não encontrada. Nomeie-a "url" ou "link".';
    return;
  }

  const rows = lines.slice(1).map(l => parseCSVLine(l)).filter(r => r[iUrl]?.startsWith('http'));

  if(!rows.length){
    status.style.background='#FEE2E2'; status.style.color='#991B1B';
    status.textContent='Nenhuma URL válida encontrada (precisam começar com http).';
    return;
  }

  status.textContent = `Importando ${rows.length} links…`;

  // Garante categorias: busca existente ou cria nova
  const catCache = {};
  async function getOrCreateCategory(name){
    if(!name) return null;
    if(catCache[name]) return catCache[name];
    const existing = categories.find(c => c.name.toLowerCase() === name.toLowerCase());
    if(existing){ catCache[name] = existing.id; return existing.id; }
    const { data, error } = await sb.from('categories').insert({ name, color: nextColor() }).select().single();
    if(error || !data) return null;
    categories.push(data);
    catCache[name] = data.id;
    return data.id;
  }

  let ok=0; let fail=0;
  for(const r of rows){
    const payload = {
      title: (iTitle >= 0 ? r[iTitle] : '') || r[iUrl],
      url: r[iUrl],
      description: (iDesc >= 0 && r[iDesc]) ? r[iDesc] : null,
    };
    const { data: linkData, error } = await sb.from('links').insert(payload).select().single();
    if(error || !linkData){ fail++; continue; }
    if(iCat >= 0 && r[iCat]){
      const catId = await getOrCreateCategory(r[iCat]);
      if(catId) await sb.from('link_categories').insert({ link_id: linkData.id, category_id: catId });
    }
    ok++;
  }

  await loadLinksData();
  renderLinkList(body);

  status.style.background = fail===0 ? '#DCFCE7' : '#FEF9C3';
  status.style.color = fail===0 ? '#166534' : '#713F12';
  status.textContent = fail===0
    ? `${ok} link${ok>1?'s':''} importado${ok>1?'s':''} com sucesso.`
    : `${ok} importados, ${fail} falharam (URLs duplicadas ou erro de rede).`;
  $('csvImportInput').value='';
}

/* Modal única para criar/editar link (título, URL, descrição, categoria,
   data), no mesmo padrão do "+ Novo grupo". */
function openLinkModal(link, body){
  const isEdit = !!link;
  showModal((box, close) => {
    box.style.maxWidth = '460px';
    box.innerHTML = `
      <h3>${isEdit ? 'Editar link' : 'Novo link'}</h3>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Título</span>
        <input class="field" id="modalLinkTitle" style="margin-bottom:0;" placeholder="Título">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">URL</span>
        <input class="field" id="modalLinkUrl" style="margin-bottom:0;" placeholder="https://exemplo.com">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Descrição (opcional)</span>
        <textarea class="field" id="modalLinkDesc" style="margin-bottom:0; resize:vertical; min-height:60px;" placeholder="Descrição curta"></textarea>
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Categoria</span>
        <div class="ms-wrap" id="modalCategoryMs"></div>
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Data de publicação</span>
        <input type="date" class="field" id="modalLinkDate" style="margin-bottom:0;">
      </div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalSave">Salvar</button>
      </div>`;
    box.querySelector('#modalLinkTitle').value = isEdit ? link.title : '';
    box.querySelector('#modalLinkUrl').value = isEdit ? link.url : '';
    box.querySelector('#modalLinkDesc').value = isEdit ? link.desc : '';
    box.querySelector('#modalLinkDate').value = isEdit ? fmtDateInput(link.createdAt) : new Date().toISOString().slice(0, 10);
    renderCategoryMultiselect(box.querySelector('#modalCategoryMs'), isEdit ? (link.categoryIds || []) : [], () => {});
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalSave').onclick = async () => {
      const title = box.querySelector('#modalLinkTitle').value.trim();
      const url = box.querySelector('#modalLinkUrl').value.trim();
      const desc = box.querySelector('#modalLinkDesc').value.trim();
      const categoryIds = box.querySelector('#modalCategoryMs')._getSelectedIds();
      const dateValue = box.querySelector('#modalLinkDate').value;
      if(!title || !url){ showAlert('Preencha ao menos o título e a URL.'); return; }
      const payload = { title, url, description: desc };
      if(dateValue) payload.created_at = new Date(dateValue + 'T12:00:00').toISOString();
      let linkId = isEdit ? link.id : null;
      if(isEdit){
        const { error } = await sb.from('links').update(payload).eq('id', link.id);
        if(error){ showAlert(error.message); return; }
      } else {
        const { data, error } = await sb.from('links').insert(payload).select().single();
        if(error){ showAlert(error.message); return; }
        linkId = data.id;
      }
      await saveLinkCategories(linkId, categoryIds);
      await loadLinksData();
      close(true);
      renderLinkList(body);
    };
  });
}

function renderLinkList(body){
  const wrap = $('adminLinkList'); wrap.innerHTML = '';
  if(!links.length){ wrap.innerHTML = '<span style="font-size:13px;color:var(--ink-soft)">Nenhum link ainda.</span>'; return; }
  links.forEach(link => wrap.appendChild(buildLinkDisplayRow(link, body)));
}
function buildLinkDisplayRow(link, body){
  const cats = (link.categoryIds || []).map(id => categories.find(c => c.id === id)).filter(Boolean);
  const row = document.createElement('div'); row.className = 'admin-link-row';
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.style.cssText = 'display:flex; align-items:center; gap:10px; min-width:0;';
  const favList = favicons(link.url);
  if(favList.length){
    const img = document.createElement('img'); img.className = 'favicon'; img.referrerPolicy = 'no-referrer';
    let attempt = 0; img.src = favList[0];
    img.onerror = () => { attempt++; attempt < favList.length ? (img.src = favList[attempt]) : (img.style.display = 'none'); };
    meta.appendChild(img);
  }
  const textWrap = document.createElement('div'); textWrap.style.minWidth = '0';
  textWrap.innerHTML = `<strong>${esc(link.title)}</strong><span>${cats.length ? esc(cats.map(c=>c.name).join(', ')) : 'Sem categoria'}</span>`;
  meta.appendChild(textWrap);
  const acts = document.createElement('div'); acts.className = 'row-acts';
  const eb = document.createElement('button'); eb.className = 'btn-sm'; eb.textContent = 'Editar';
  eb.onclick = () => openLinkModal(link, body);
  const db = document.createElement('button'); db.className = 'btn-sm danger'; db.textContent = 'Excluir';
  db.onclick = async () => {
    if(!(await showConfirm('Excluir este link?'))) return;
    const { error } = await sb.from('links').delete().eq('id', link.id);
    if(error){ showAlert(error.message); return; }
    links = links.filter(l => l.id !== link.id);
    renderLinkList(body);
  };
  acts.append(eb, db); row.append(meta, acts);
  return row;
}

/* Multiselect de categorias: chips removíveis + dropdown com checkboxes,
   com adicionar/renomear/excluir embutidos na própria lista.
   container._getSelectedIds() devolve o array de ids selecionados. */
function renderCategoryMultiselect(container, initialIds, onCategoriesChanged){
  const instanceName = 'catradio-' + Math.random().toString(36).slice(2, 9);
  const selected = new Set((initialIds || []).slice(0, 1)); // só uma categoria por link
  container._getSelectedIds = () => Array.from(selected);

  container.innerHTML = `
    <div class="ms-box">
      <div class="ms-chips"></div>
      <button type="button" class="ms-toggle">${phIcon('caret-down')}</button>
    </div>
    <div class="ms-dropdown" style="display:none;">
      <div class="ms-add-row">
        <input type="text" class="ms-add-input" placeholder="Nova categoria">
        <button type="button" class="ms-add-btn">+</button>
      </div>
      <div class="ms-list"></div>
    </div>`;
  const box = container.querySelector('.ms-box');
  const chipsWrap = container.querySelector('.ms-chips');
  const dropdown = container.querySelector('.ms-dropdown');
  const list = container.querySelector('.ms-list');

  function renderChips(){
    if(!selected.size){ chipsWrap.innerHTML = '<span class="ms-placeholder">Selecionar categoria</span>'; return; }
    chipsWrap.innerHTML = '';
    Array.from(selected).forEach(id => {
      const cat = categories.find(c => c.id === id);
      if(!cat) return;
      const chip = document.createElement('span'); chip.className = 'ms-chip';
      chip.style.borderColor = rgba(cat.color, 0.5); chip.style.color = cat.color; chip.style.background = rgba(cat.color, 0.1);
      const label = document.createElement('span'); label.textContent = cat.name;
      const x = document.createElement('button'); x.type = 'button'; x.className = 'ms-chip-x'; x.innerHTML = phIcon('x');
      x.onclick = (e) => { e.stopPropagation(); selected.delete(id); renderChips(); renderList(); };
      chip.append(label, x); chipsWrap.appendChild(chip);
    });
  }
  function renderList(){
    list.innerHTML = '';
    if(!categories.length){ list.innerHTML = '<p class="ms-empty">Nenhuma categoria ainda.</p>'; return; }
    categories.forEach(cat => {
      const item = document.createElement('div'); item.className = 'ms-item';
      const label = document.createElement('label'); label.className = 'ms-item-label';
      const cb = document.createElement('input'); cb.type = 'radio'; cb.name = instanceName; cb.checked = selected.has(cat.id);
      cb.onchange = () => { selected.clear(); selected.add(cat.id); renderChips(); };
      const span = document.createElement('span'); span.textContent = cat.name;
      label.append(cb, span);
      const acts = document.createElement('span'); acts.className = 'ms-item-actions';
      const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.innerHTML = phIcon('pencil-simple'); editBtn.title = 'Renomear';
      editBtn.onclick = async (e) => {
        e.stopPropagation();
        const result = await showPrompt('Renomear categoria', [{ key: 'name', label: 'Nome', value: cat.name }]);
        if(!result || !result.name) return;
        const { error } = await sb.from('categories').update({ name: result.name }).eq('id', cat.id);
        if(error){ showAlert(error.message); return; }
        cat.name = result.name;
        renderChips(); renderList();
        if(onCategoriesChanged) onCategoriesChanged();
      };
      const delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.innerHTML = phIcon('trash'); delBtn.title = 'Excluir';
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        if(!(await showConfirm(`Excluir a categoria "${cat.name}"?`))) return;
        const { error } = await sb.from('categories').delete().eq('id', cat.id);
        if(error){ showAlert(error.message); return; }
        categories = categories.filter(c => c.id !== cat.id);
        selected.delete(cat.id);
        renderChips(); renderList();
        if(onCategoriesChanged) onCategoriesChanged();
      };
      acts.append(editBtn, delBtn);
      item.append(label, acts);
      list.appendChild(item);
    });
  }
  function setOpen(next){
    dropdown.style.display = next ? '' : 'none';
    box.classList.toggle('open', next);
  }
  box.addEventListener('click', (e) => { if(e.target.closest('.ms-chip-x')) return; setOpen(dropdown.style.display === 'none'); });
  document.addEventListener('mousedown', (e) => { if(!container.contains(e.target)) setOpen(false); });

  const addInput = container.querySelector('.ms-add-input');
  container.querySelector('.ms-add-btn').onclick = async () => {
    const name = addInput.value.trim();
    if(!name) return;
    const { data, error } = await sb.from('categories').insert({ name, color: nextColor() }).select().single();
    if(error){ showAlert(error.message); return; }
    categories.push(data);
    selected.clear();
    selected.add(data.id);
    addInput.value = '';
    renderChips(); renderList();
    if(onCategoriesChanged) onCategoriesChanged();
  };
  addInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); container.querySelector('.ms-add-btn').click(); } });
  addInput.addEventListener('click', e => e.stopPropagation());

  renderChips();
  renderList();
}

/* ======================= ADMIN: ALUNOS TAB ======================= */
function renderAdminAlunosTab(body){
  const pending = adminStudents.filter(s => s.status === 'pending');
  const assigned = adminStudents.filter(s => s.status === 'assigned');
  body.innerHTML = `
    <div class="admin-section">
      <h3>Registros pendentes <span style="font-weight:400;color:var(--ink-soft);">(${pending.length})</span></h3>
      <div class="hint">Alunos que se registraram e ainda não foram incluídos em um grupo.</div>
      <div class="simple-list" id="pendingList"></div>
    </div>
    <div class="admin-section">
      <h3>Alunos atribuídos <span style="font-weight:400;color:var(--ink-soft);">(${assigned.length})</span></h3>
      <div class="simple-list" id="assignedList"></div>
    </div>`;
  const pendingWrap = $('pendingList');
  if(!pending.length){ pendingWrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum registro pendente.</p>'; }
  else pending.forEach(s => {
    const row = document.createElement('div'); row.className = 'simple-row';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = `<strong>${esc(s.full_name)}</strong><span>${esc(s.email)}</span>`;
    const sel = document.createElement('select'); sel.className = 'btn-sm'; sel.style.cssText='padding:8px 10px;';
    sel.innerHTML = '<option value="">Atribuir a um grupo…</option>' + adminGroups.map(g => `<option value="${g.id}">${esc(g.group_name)}</option>`).join('');
    sel.onchange = async () => {
      if(!sel.value) return;
      const { error } = await sb.from('students').update({ status: 'assigned', group_id: sel.value }).eq('id', s.id);
      if(error){ showAlert(error.message); return; }
      await loadAdminStudents();
      renderAdminAlunosTab(body);
    };
    const del = document.createElement('button'); del.className = 'btn-sm danger'; del.textContent = 'Remover';
    del.onclick = async () => {
      if(!(await showConfirm('Remover este registro?'))) return;
      await sb.from('students').delete().eq('id', s.id);
      await loadAdminStudents(); renderAdminAlunosTab(body);
    };
    const acts = document.createElement('div'); acts.className = 'row-acts'; acts.append(sel, del);
    row.append(meta, acts); pendingWrap.appendChild(row);
  });
  const assignedWrap = $('assignedList');
  if(!assigned.length){ assignedWrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum aluno atribuído ainda.</p>'; }
  else assigned.forEach(s => {
    const g = adminGroups.find(g => g.id === s.group_id);
    const row = document.createElement('div'); row.className = 'simple-row';
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = `<strong>${esc(s.full_name)}</strong><span>${esc(s.email)} · ${esc(g?.group_name || 'grupo removido')}</span>`;
    const unassign = document.createElement('button'); unassign.className = 'btn-sm'; unassign.textContent = 'Remover do grupo';
    unassign.onclick = async () => {
      await sb.from('students').update({ status: 'pending', group_id: null }).eq('id', s.id);
      await loadAdminStudents(); renderAdminAlunosTab(body);
    };
    const acts = document.createElement('div'); acts.className = 'row-acts'; acts.appendChild(unassign);
    row.append(meta, acts); assignedWrap.appendChild(row);
  });
}

/* ======================= ADMIN: GRUPOS TAB (lista) ======================= */
async function generateAllGroupPasswords(){
  if(!adminGroups.length){ showAlert('Nenhum grupo cadastrado.'); return; }

  const semSenha = adminGroups.filter(g => !g.password_hash);
  const comSenha = adminGroups.filter(g => !!g.password_hash);

  let targets = adminGroups;
  if(semSenha.length && comSenha.length){
    const soSemSenha = await showConfirm(
      `${semSenha.length} grupo(s) ainda não têm senha e ${comSenha.length} já têm.\n\nGerar apenas para os sem senha? (Cancelar gera para todos)`
    );
    targets = soSemSenha ? semSenha : adminGroups;
  }

  const btn = $('genAllPasswordsBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando…'; }

  const results = [];
  for(const g of targets){
    const pw = generateRandomPassword();
    const { error } = await sb.rpc('admin_set_group_password', { p_group_id: g.id, p_password: pw });
    results.push({ group: g, pw, ok: !error });
    if(!error) g.password_hash = pw;
  }

  if(btn){ btn.disabled = false; btn.innerHTML = phIcon('key') + ' Gerar senhas'; }

  // Modal com resultado
  showModal((box) => {
    const rows = results.map(r => `
      <tr>
        <td style="padding:8px 10px;font-weight:600;">${esc(r.group.group_name)}</td>
        <td style="padding:8px 10px;">
          <code style="background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px;letter-spacing:.04em;">${esc(r.pw)}</code>
        </td>
        <td style="padding:8px 10px;color:${r.ok ? 'var(--good)' : '#EF4444'};font-size:12px;">
          ${r.ok ? phIcon('check-circle') : phIcon('x-circle')} ${r.ok ? 'Salvo' : 'Erro'}
        </td>
      </tr>`).join('');

    box.innerHTML = `
