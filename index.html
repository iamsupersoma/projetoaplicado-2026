async function importLinksFromCSV(file, body){
  if(!file) return;
  const status = $('csvImportStatus');
  status.style.display = 'block';
  status.style.background = '#FEF9C3';
  status.style.color = '#713F12';
  status.textContent = 'Lendo arquivo…';

  const text = await file.text();
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if(!lines.length){ status.textContent = 'Arquivo vazio.'; return; }

  const sep = (lines[0].match(/;/g)||[]).length > (lines[0].match(/,/g)||[]).length ? ';' : ',';

  function parseCSVLine(line){
    const cols=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'&&!inQ){inQ=true;continue;}
      if(c==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;continue;}
      if(c==='"'&&inQ){inQ=false;continue;}
      if(c===sep&&!inQ){cols.push(cur.trim());cur='';continue;}
      cur+=c;
    }
    cols.push(cur.trim());
    return cols;
  }

  const header = parseCSVLine(lines[0]).map(h => h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''));
  const iTitle = header.findIndex(h => h.includes('tit') || h.includes('nom') || h.includes('name'));
  const iUrl   = header.findIndex(h => h.includes('url') || h.includes('link') || h.includes('end'));
  const iDesc  = header.findIndex(h => h.includes('desc') || h.includes('obs'));
  const iCat   = header.findIndex(h => h.includes('cat') || h.includes('tipo') || h.includes('tag'));

  if(iUrl === -1){
    status.style.background='#FEE2E2'; status.style.color='#991B1B';
    status.textContent='Coluna de URL não encontrada. Nomeie-a "url" ou "link".';
    return;
  }

  const rows = lines.slice(1).map(l => parseCSVLine(l)).filter(r => r[iUrl]?.startsWith('http'));

  if(!rows.length){
    status.style.background='#FEE2E2'; status.style.color='#991B1B';
    status.textContent='Nenhuma URL válida encontrada (precisam começar com http).';
    return;
  }

  status.textContent = `Importando ${rows.length} links…`;

  // Garante categorias: busca existente ou cria nova
  const catCache = {};
  async function getOrCreateCategory(name){
    if(!name) return null;
    if(catCache[name]) return catCache[name];
    const existing = categories.find(c => c.name.toLowerCase() === name.toLowerCase());
    if(existing){ catCache[name] = existing.id; return existing.id; }
    const { data, error } = await sb.from('categories').insert({ name, color: nextColor() }).select().single();
    if(error || !data) return null;
    categories.push(data);
    catCache[name] = data.id;
    return data.id;
  }

  let ok=0; let fail=0;
  for(const r of rows){
    const payload = {
      title: (iTitle >= 0 ? r[iTitle] : '') || r[iUrl],
      url: r[iUrl],
      description: (iDesc >= 0 && r[iDesc]) ? r[iDesc] : null,
    };
    const { data: linkData, error } = await sb.from('links').insert(payload).select().single();
    if(error || !linkData){ fail++; continue; }
    if(iCat >= 0 && r[iCat]){
      const catId = await getOrCreateCategory(r[iCat]);
      if(catId) await sb.from('link_categories').insert({ link_id: linkData.id, category_id: catId });
    }
    ok++;
  }

  await loadLinksData();
  renderLinkList(body);

  status.style.background = fail===0 ? '#DCFCE7' : '#FEF9C3';
  status.style.color = fail===0 ? '#166534' : '#713F12';
  status.textContent = fail===0
    ? `${ok} link${ok>1?'s':''} importado${ok>1?'s':''} com sucesso.`
    : `${ok} importados, ${fail} falharam (URLs duplicadas ou erro de rede).`;
  $('csvImportInput').value='';
}

/* Modal única para criar/editar link (título, URL, descrição, categoria,
   data), no mesmo padrão do "+ Novo grupo". */
function openLinkModal(link, body){
  const isEdit = !!link;
  showModal((box, close) => {
    box.style.maxWidth = '460px';
    box.innerHTML = `
      <h3>${isEdit ? 'Editar link' : 'Novo link'}</h3>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Título</span>
        <input class="field" id="modalLinkTitle" style="margin-bottom:0;" placeholder="Título">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">URL</span>
        <input class="field" id="modalLinkUrl" style="margin-bottom:0;" placeholder="https://exemplo.com">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Descrição (opcional)</span>
        <textarea class="field" id="modalLinkDesc" style="margin-bottom:0; resize:vertical; min-height:60px;" placeholder="Descrição curta"></textarea>
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Categoria</span>
        <div class="ms-wrap" id="modalCategoryMs"></div>
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Data de publicação</span>
        <input type="date" class="field" id="modalLinkDate" style="margin-bottom:0;">
      </div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalSave">Salvar</button>
      </div>`;
    box.querySelector('#modalLinkTitle').value = isEdit ? link.title : '';
    box.querySelector('#modalLinkUrl').value = isEdit ? link.url : '';
    box.querySelector('#modalLinkDesc').value = isEdit ? link.desc : '';
    box.querySelector('#modalLinkDate').value = isEdit ? fmtDateInput(link.createdAt) : new Date().toISOString().slice(0, 10);
    renderCategoryMultiselect(box.querySelector('#modalCategoryMs'), isEdit ? (link.categoryIds || []) : [], () => {});
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalSave').onclick = async () => {
      const title = box.querySelector('#modalLinkTitle').value.trim();
      const url = box.querySelector('#modalLinkUrl').value.trim();
      const desc = box.querySelector('#modalLinkDesc').value.trim();
      const categoryIds = box.querySelector('#modalCategoryMs')._getSelectedIds();
      const dateValue = box.querySelector('#modalLinkDate').value;
      if(!title || !url){ showAlert('Preencha ao menos o título e a URL.'); return; }
      const createdAt = dateValue ? new Date(dateValue + 'T12:00:00').toISOString() : new Date().toISOString();
      let linkId = isEdit ? link.id : null;
      if(gestorSession){
        const { data, error } = await sbAnon.rpc('gestor_save_link', {
          p_id: isEdit ? link.id : null,
          p_title: title, p_url: url, p_description: desc,
          p_created_at: createdAt, p_category_ids: categoryIds,
        });
        if(error){ showAlert(error.message); return; }
        if(!isEdit) linkId = data;
      } else {
        const payload = { title, url, description: desc, created_at: createdAt };
        if(isEdit){
          const { error } = await sb.from('links').update(payload).eq('id', link.id);
          if(error){ showAlert(error.message); return; }
        } else {
          const { data, error } = await sb.from('links').insert(payload).select().single();
          if(error){ showAlert(error.message); return; }
          linkId = data.id;
        }
        await saveLinkCategories(linkId, categoryIds);
      }
      await loadLinksData();
      close(true);
      renderLinkList(body);
    };
  });
}

function renderLinkList(body){
  const wrap = $('adminLinkList'); wrap.innerHTML = '';
  if(!links.length){ wrap.innerHTML = '<span style="font-size:13px;color:var(--ink-soft)">Nenhum link ainda.</span>'; return; }
  links.forEach(link => wrap.appendChild(buildLinkDisplayRow(link, body)));
}
function buildLinkDisplayRow(link, body){
  const cats = (link.categoryIds || []).map(id => categories.find(c => c.id === id)).filter(Boolean);
  const row = document.createElement('div'); row.className = 'admin-link-row';
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.style.cssText = 'display:flex; align-items:center; gap:10px; min-width:0;';
  const favList = favicons(link.url);
  if(favList.length){
    const img = document.createElement('img'); img.className = 'favicon'; img.referrerPolicy = 'no-referrer';
    let attempt = 0; img.src = favList[0];
    img.onerror = () => { attempt++; attempt < favList.length ? (img.src = favList[attempt]) : (img.style.display = 'none'); };
    meta.appendChild(img);
  }
  const textWrap = document.createElement('div'); textWrap.style.minWidth = '0';
  textWrap.innerHTML = `<strong><a href="${esc(link.url)}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">${esc(link.title)}</a></strong><span>${cats.length ? esc(cats.map(c=>c.name).join(', ')) : 'Sem categoria'}</span>`;
  meta.appendChild(textWrap);
  const acts = document.createElement('div'); acts.className = 'row-acts';
  if(!gestorSession || gestorCanEdit){
    const eb = document.createElement('button'); eb.className = 'btn-sm'; eb.textContent = 'Editar';
    eb.onclick = () => openLinkModal(link, body);
    const db = document.createElement('button'); db.className = 'btn-sm danger'; db.textContent = 'Excluir';
    db.onclick = async () => {
      if(!(await showConfirm('Excluir este link?'))) return;
      const { error } = gestorSession
        ? await sb.rpc('gestor_delete_link', { p_link_id: link.id })
        : await sb.from('links').delete().eq('id', link.id);
      if(error){ showAlert(error.message); return; }
      links = links.filter(l => l.id !== link.id);
      renderLinkList(body);
    };
    acts.append(eb, db);
  }
  row.append(meta, acts);
  return row;
}

/* Multiselect de categorias: chips removíveis + dropdown com checkboxes,
   com adicionar/renomear/excluir embutidos na própria lista.
   container._getSelectedIds() devolve o array de ids selecionados. */
function renderCategoryMultiselect(container, initialIds, onCategoriesChanged){
  const instanceName = 'catradio-' + Math.random().toString(36).slice(2, 9);
  const selected = new Set((initialIds || []).slice(0, 1)); // só uma categoria por link
  container._getSelectedIds = () => Array.from(selected);

  container.innerHTML = `
    <div class="ms-box">
      <div class="ms-chips"></div>
      <button type="button" class="ms-toggle">${phIcon('caret-down')}</button>
    </div>
    <div class="ms-dropdown" style="display:none;">
      <div class="ms-add-row">
        <input type="text" class="ms-add-input" placeholder="Nova categoria">
        <button type="button" class="ms-add-btn">+</button>
      </div>
      <div class="ms-list"></div>
    </div>`;
  const box = container.querySelector('.ms-box');
  const chipsWrap = container.querySelector('.ms-chips');
  const dropdown = container.querySelector('.ms-dropdown');
  const list = container.querySelector('.ms-list');

  function renderChips(){
    if(!selected.size){ chipsWrap.innerHTML = '<span class="ms-placeholder">Selecionar categoria</span>'; return; }
    chipsWrap.innerHTML = '';
    Array.from(selected).forEach(id => {
      const cat = categories.find(c => c.id === id);
      if(!cat) return;
      const chip = document.createElement('span'); chip.className = 'ms-chip';
      chip.style.borderColor = rgba(cat.color, 0.5); chip.style.color = cat.color; chip.style.background = rgba(cat.color, 0.1);
      const label = document.createElement('span'); label.textContent = cat.name;
      const x = document.createElement('button'); x.type = 'button'; x.className = 'ms-chip-x'; x.innerHTML = phIcon('x');
      x.onclick = (e) => { e.stopPropagation(); selected.delete(id); renderChips(); renderList(); };
      chip.append(label, x); chipsWrap.appendChild(chip);
    });
  }
  function renderList(){
    list.innerHTML = '';
    if(!categories.length){ list.innerHTML = '<p class="ms-empty">Nenhuma categoria ainda.</p>'; return; }
    categories.forEach(cat => {
      const item = document.createElement('div'); item.className = 'ms-item';
      const label = document.createElement('label'); label.className = 'ms-item-label';
      const cb = document.createElement('input'); cb.type = 'radio'; cb.name = instanceName; cb.checked = selected.has(cat.id);
      cb.onchange = () => { selected.clear(); selected.add(cat.id); renderChips(); };
      const span = document.createElement('span'); span.textContent = cat.name;
      label.append(cb, span);
      const acts = document.createElement('span'); acts.className = 'ms-item-actions';
      const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.innerHTML = phIcon('pencil-simple'); editBtn.title = 'Renomear';
      editBtn.onclick = async (e) => {
        e.stopPropagation();
        const result = await showPrompt('Renomear categoria', [{ key: 'name', label: 'Nome', value: cat.name }]);
        if(!result || !result.name) return;
        const { error } = await sb.from('categories').update({ name: result.name }).eq('id', cat.id);
        if(error){ showAlert(error.message); return; }
        cat.name = result.name;
        renderChips(); renderList();
        if(onCategoriesChanged) onCategoriesChanged();
      };
      const delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.innerHTML = phIcon('trash'); delBtn.title = 'Excluir';
      delBtn.onclick = async (e) => {
        e.stopPropagation();
        if(!(await showConfirm(`Excluir a categoria "${cat.name}"?`))) return;
        const { error } = await sb.from('categories').delete().eq('id', cat.id);
        if(error){ showAlert(error.message); return; }
        categories = categories.filter(c => c.id !== cat.id);
        selected.delete(cat.id);
        renderChips(); renderList();
        if(onCategoriesChanged) onCategoriesChanged();
      };
      acts.append(editBtn, delBtn);
      item.append(label, acts);
      list.appendChild(item);
    });
  }
  function setOpen(next){
    dropdown.style.display = next ? '' : 'none';
    box.classList.toggle('open', next);
  }
  box.addEventListener('click', (e) => { if(e.target.closest('.ms-chip-x')) return; setOpen(dropdown.style.display === 'none'); });
  document.addEventListener('mousedown', (e) => { if(!container.contains(e.target)) setOpen(false); });

  const addInput = container.querySelector('.ms-add-input');
  container.querySelector('.ms-add-btn').onclick = async () => {
    const name = addInput.value.trim();
    if(!name) return;
    const { data, error } = await sb.from('categories').insert({ name, color: nextColor() }).select().single();
    if(error){ showAlert(error.message); return; }
    categories.push(data);
    selected.clear();
    selected.add(data.id);
    addInput.value = '';
    renderChips(); renderList();
    if(onCategoriesChanged) onCategoriesChanged();
  };
  addInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); container.querySelector('.ms-add-btn').click(); } });
  addInput.addEventListener('click', e => e.stopPropagation());

  renderChips();
  renderList();
}

        ${(!gestorSession || gestorCanEdit) ? `<button class="btn-sm pw-edit" title="Editar senha">Editar senha</button>` : ''}
      </span>`;
    if(!gestorSession || gestorCanEdit) card.querySelector('.pw-edit').onclick = e => { e.stopPropagation(); openGroupPasswordModal(g); };

        <div><label>Nome do grupo</label><input id="gName" class="field" value="${esc(g.group_name)}"></div>
        <div><label>Título do projeto</label><input id="gTitle" class="field" value="${esc(g.project_title||'')}"></div>

      </div>
      <div style="display:flex; justify-content:flex-end;">
        <button class="btn-primary auto" id="saveGroupBtn">Salvar dados</button>
      </div>
    </div>`}

    <div id="groupBancasSection"><div class="loading-state" style="margin:8px 0;">Carregando avaliações…</div></div>

    ${!gestorSession ? `<div class="danger-zone">
      <h3>Zona de risco</h3>
      <p>Excluir o grupo remove permanentemente seus dados, senha, anexos e notas das 3 etapas. Os alunos atribuídos ficam sem grupo. Esta ação não pode ser desfeita.</p>
      <button class="btn-sm danger" id="deleteGroupBtn">Excluir grupo</button>
    </div>` : ''}`;


  $('backToGroups').onclick = () => { openGroupId = null; renderAdminPanel(); };

  if(!gestorSession || gestorCanEdit){
    $('saveGroupBtn').onclick = async () => {
      const group_name = $('gName').value.trim() || g.group_name;
      const project_title = $('gTitle').value.trim() || null;
      let error;
      if(gestorSession){
        ({ error } = await sbAnon.rpc('gestor_update_group', { p_group_id: g.id, p_group_name: group_name, p_project_title: project_title }));
      } else {
        ({ error } = await sb.from('groups').update({ group_name, project_title }).eq('id', g.id));
      }
      if(error){ showAlert(error.message); return; }
      await loadAdminGroups();
      renderAdminPanel();
    };
    if($('deleteGroupBtn')) $('deleteGroupBtn').onclick = async () => {
      if(!(await showConfirm('Excluir este grupo? Os alunos atribuídos ficam sem grupo. Esta ação não pode ser desfeita.'))) return;
      const { error } = await sb.from('groups').delete().eq('id', g.id);
      if(error){ showAlert(error.message); return; }
      await Promise.all([loadAdminGroups(), loadAdminStudents()]);
      openGroupId = null; renderAdminPanel();
    };
  }

  // load banca scores async so the page appears immediately
  (async () => {
    const section = $('groupBancasSection');
    try {
    let bancasData = [], evaluatorsData = [], scoresData = [], readersData = [];
    if(gestorSession){
      // fetch direto evita qualquer interferência do cliente Supabase JS em modo gestor (anon)
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 10000);
      let resp;
      try {
        resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_group_banca_data`, {
          method: 'POST',
          signal: ctrl.signal,
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ p_group_id: g.id }),
        });
      } finally { clearTimeout(tid); }
      if(!resp.ok){ const t = await resp.text(); throw new Error(`HTTP ${resp.status}: ${t}`); }
      const raw = await resp.json();
      const d = Array.isArray(raw) ? raw[0] : raw;
      bancasData      = d?.bancas      || [];
      evaluatorsData  = d?.evaluators  || [];
      scoresData      = d?.scores      || [];
      readersData     = d?.readers     || [];
    } else {
      const deadline = new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout (10s)')), 10000));
      const [r1, r2, r3, r4] = await Promise.race([
        Promise.allSettled([
          sb.from('bancas').select('id,stage,scheduled_date,report_file_path,report_file_name,presentation_link').eq('group_id', g.id),
          sb.from('evaluators').select('id,banca_id,reader_id,comment'),
          sb.from('scores').select('evaluator_id,question_id,rating,banca_id'),
          sb.from('banca_readers').select('id,name,role'),
        ]),
        deadline,
      ]);
      bancasData      = r1?.value?.data || [];
      evaluatorsData  = r2?.value?.data || [];
      scoresData      = r3?.value?.data || [];
      readersData     = r4?.value?.data || [];
    }
    const readerMap = Object.fromEntries((readersData || []).map(r => [r.id, r]));
    section.innerHTML = '';

    [1, 2, 3].forEach(stage => {
      const bancaRecord = (bancasData || []).find(b => b.stage === stage);
      const evaluators = bancaRecord
        ? (evaluatorsData || []).filter(e => e.banca_id === bancaRecord.id)
            .map(e => { const r = readerMap[e.reader_id]; return { ...e, name: r?.name || 'Avaliador', role: r?.role || null }; })
        : [];
      const bancaScores = bancaRecord
        ? (scoresData || []).filter(s => s.banca_id === bancaRecord.id)
        : [];
      const bancaObj = { evaluators, scores: bancaScores };

      const wrap = document.createElement('div');
      wrap.className = 'admin-section';
      wrap.style.marginBottom = '16px';

      const stageHeader = document.createElement('div');
      stageHeader.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;';
      stageHeader.innerHTML = `
        <h3 style="margin:0;">${esc(BANCA_LABELS[stage])}</h3>
        ${bancaRecord?.scheduled_date ? `<span style="font-size:12px;color:var(--ink-soft);">${fmtDate(bancaRecord.scheduled_date)}</span>` : ''}`;
      wrap.appendChild(stageHeader);

      // entregáveis
      const hasFile = bancaRecord?.report_file_path;
      const hasLink = bancaRecord?.presentation_link;
      if(hasFile || hasLink){
        const deliverWrap = document.createElement('div');
        deliverWrap.style.cssText = 'background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;';
        if(hasFile){
          const fileUrl = getPublicFileUrl(bancaRecord.report_file_path);
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:8px;';
          row.innerHTML = `
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;flex:1;min-width:0;color:var(--ink);">
              ${phIcon('file-pdf')} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(bancaRecord.report_file_name || bancaRecord.report_file_path)}</span>
            </span>
            ${fileUrl ? `<a href="${esc(fileUrl)}" target="_blank" rel="noopener" class="btn-sm" style="flex-shrink:0;">${phIcon('download-simple')} Baixar</a>` : ''}`;
          deliverWrap.appendChild(row);
        }
        if(hasLink){
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:8px;';
          row.innerHTML = `
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:13px;flex:1;min-width:0;color:var(--ink);">
              ${phIcon('presentation')} <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(bancaRecord.presentation_link)}</span>
            </span>
            <a href="${esc(bancaRecord.presentation_link)}" target="_blank" rel="noopener" class="btn-sm" style="flex-shrink:0;">${phIcon('arrow-square-out')} Abrir</a>`;
          deliverWrap.appendChild(row);
        }
        wrap.appendChild(deliverWrap);
      }

      wrap.appendChild(renderResultsDashboard(rubric || [], bancaObj));
      wrap.appendChild(renderRubricResultsView(rubric || [], bancaObj));
      section.appendChild(wrap);
    });
    } catch(err) {
      section.innerHTML = `<p style="padding:16px 0;font-size:13px;color:var(--err);">Erro ao carregar avaliações: ${esc(err?.message || String(err))}</p>`;
    }
  })();
}

/* Assistente de notas — uma pergunta por vez, estilo Typeform, com
   indicador de passos (check nos já respondidos) e etapa final de
   Considerações. Aberto por avaliador, dentro de uma banca específica. */
function openNotesWizard(rubricData, group, banca, evaluator, onClose){
  const steps = [];
  rubricData.forEach(cat => {
    (cat.questions || []).forEach(q => {
      steps.push({ type: 'question', category: cat.title, question: q });
    });
  });
  steps.push({ type: 'considerations' });

  // evaluator pode ser null (ainda não criado — auto-criado no primeiro submit)
  let myEvaluatorId = evaluator?.id || null;
  const answers = {};
  if(myEvaluatorId){
    (banca.scores || []).forEach(s => { if(s.evaluator_id === myEvaluatorId && s.rating) answers[s.question_id] = s.rating; });
  }
  let commentValue = evaluator?.comment || '';
  let stepIndex = steps.findIndex(st => st.type === 'question' && !answers[st.question.id]);
  if(stepIndex === -1) stepIndex = 0;

  const overlay = document.createElement('div');
  overlay.className = 'wizard-overlay';
  overlay.innerHTML = `
    <div class="wizard-scroll">
      <button type="button" class="wizard-close" id="wizClose">${phIcon('x')}</button>
      <div class="wizard-inner">
        <div class="wizard-steps" id="wizSteps"></div>
        <div class="wizard-body" id="wizBody"></div>
      </div>
    </div>
    <div class="wizard-footer" id="wizFooter"></div>`;
  document.body.appendChild(overlay);

  function isStepComplete(i){
    const st = steps[i];
    if(st.type === 'question') return !!answers[st.question.id];
    return !!(commentValue && commentValue.trim());
  }
  function close(){
    overlay.remove();
    document.removeEventListener('keydown', onEsc);
    if(onClose) onClose();
  }
  function onEsc(e){ if(e.key === 'Escape') close(); }
  document.addEventListener('keydown', onEsc);
  overlay.querySelector('#wizClose').onclick = close;

  function renderStepsIndicator(){
    const stepsWrap = overlay.querySelector('#wizSteps');
    stepsWrap.innerHTML = '';
    steps.forEach((st, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'wizard-dot' + (i === stepIndex ? ' current' : '') + (isStepComplete(i) ? ' done' : '');
      dot.innerHTML = isStepComplete(i) ? phIcon('check', {weight:'bold'}) : (i === steps.length - 1 ? phIcon('pencil-simple') : String(i + 1));
      dot.title = st.type === 'question' ? st.question.question : 'Considerações';
      dot.onclick = () => { stepIndex = i; renderStep(); };
      stepsWrap.appendChild(dot);
    });
  }
  function renderStep(){
    renderStepsIndicator();
    const body = overlay.querySelector('#wizBody');
    const st = steps[stepIndex];
    const footer = overlay.querySelector('#wizFooter');
    if(st.type === 'question'){
      body.innerHTML = `
        <div class="wizard-eyebrow">${esc(st.category)}</div>
        <h2 class="wizard-question">${esc(st.question.question)}</h2>
        <div class="wizard-options" id="wizOptions"></div>`;
      footer.innerHTML = `
        <button type="button" class="btn-sm" id="wizBack" ${stepIndex === 0 ? 'disabled' : ''}>${phIcon('arrow-left')} Voltar</button>
        <span class="wizard-progress">${stepIndex + 1} de ${steps.length}</span>`;
      const optsWrap = overlay.querySelector('#wizOptions');
      RATING_ORDER.forEach(r => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wizard-option' + (answers[st.question.id] === r ? ' selected' : '');
        btn.textContent = RATING_LABELS[r];
        btn.onclick = async () => {
          answers[st.question.id] = r;
          const { data: evId } = await sb.rpc('reader_submit_score', {
            p_password: readerPassword, p_group_slug: group.slug, p_stage: banca.stage, p_question_id: st.question.id, p_rating: r,
          });
          if(!evId){ showAlert('Não foi possível salvar a nota agora. Tente novamente.'); return; }
          if(!myEvaluatorId){
            myEvaluatorId = evId;
            banca.evaluators = banca.evaluators || [];
            if(!banca.evaluators.find(e => e.id === evId)){
              banca.evaluators.push({ id: evId, reader_id: leituraData.reader_id, comment: null });
            }
          }
          const existing = banca.scores.find(s => s.evaluator_id === myEvaluatorId && s.question_id === st.question.id);
          if(existing) existing.rating = r; else banca.scores.push({ evaluator_id: myEvaluatorId, question_id: st.question.id, rating: r });
          if(stepIndex < steps.length - 1){
            setTimeout(() => { stepIndex++; renderStep(); }, 200);
          } else {
            renderStep();
          }
        };
        optsWrap.appendChild(btn);
      });
      footer.querySelector('#wizBack').onclick = () => { if(stepIndex > 0){ stepIndex--; renderStep(); } };
    } else {
      body.innerHTML = `
        <div class="wizard-eyebrow">Última etapa</div>
        <h2 class="wizard-question">Considerações</h2>
        <textarea id="wizComment" class="wizard-textarea" placeholder="Comentário/observação (opcional)"></textarea>`;
      footer.innerHTML = `
        <button type="button" class="btn-sm" id="wizBack">${phIcon('arrow-left')} Voltar</button>
        <button type="button" class="btn-primary auto" id="wizFinish">Concluir</button>`;
      overlay.querySelector('#wizComment').value = commentValue;
      footer.querySelector('#wizBack').onclick = () => { stepIndex--; renderStep(); };
      footer.querySelector('#wizFinish').onclick = async () => {
        const btn = footer.querySelector('#wizFinish');
        btn.disabled = true; btn.textContent = 'Salvando…';
        commentValue = overlay.querySelector('#wizComment').value;
        const { data: ok } = await sb.rpc('reader_submit_comment', {
          p_password: readerPassword, p_group_slug: group.slug, p_stage: banca.stage, p_comment: commentValue.trim() || null,
        });
        if(!ok){ btn.disabled = false; btn.textContent = 'Concluir'; showAlert('Não foi possível salvar agora. Tente novamente.'); return; }
        const ev = banca.evaluators?.find(e => e.id === myEvaluatorId);
        if(ev) ev.comment = commentValue.trim() || null;
        renderThanksScreen();
      };
    }
  }
  function renderThanksScreen(){
    const allDone = steps.every((_, i) => isStepComplete(i));
    steps.forEach((_, i) => { if(i < steps.length - 1) answers[steps[i].question?.id || ''] = answers[steps[i].question?.id || '']; });
    renderStepsIndicator();
    overlay.querySelector('#wizFooter').innerHTML = '';
    const body = overlay.querySelector('#wizBody');
    body.innerHTML = `
      <div class="wizard-thanks">
        <div class="wizard-thanks-icon">${phIcon('check-circle', {weight:'fill'})}</div>
        <h2 class="wizard-thanks-title">Avaliação concluída!</h2>
        <p class="wizard-thanks-text">Obrigado pela sua participação. Suas notas e considerações foram registradas com sucesso.</p>
        <button type="button" class="btn-primary auto" id="wizDone">Fechar</button>
      </div>`;
    overlay.querySelector('#wizDone').onclick = close;
  }

  renderStep();
}

        <span style="font-size:11px;color:var(--ink-soft);max-width:72px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(ev.name)}</span>`;
      scoresWrap.appendChild(evChip);
    });

    if(!overallAvg && !evaluators.length){
      scoresWrap.innerHTML = `<span style="font-size:13px;color:var(--ink-soft);">Sem avaliações registradas.</span>`;
    }

    card.appendChild(scoresWrap);

    // ── comentários ──
    if(bancaRecord){
      const bancaComments = (commentsData || []).filter(c => c.banca_id === bancaRecord.id);
      card.appendChild(buildBancaCommentsSection(bancaRecord.id, bancaComments, body));
    }

    content.appendChild(card);
  });
}

/* ======================= BANCA COMMENTS ======================= */
function buildBancaCommentsSection(bancaId, comments, body){
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:18px;border-top:1px solid var(--line);padding-top:14px;';

  const title = document.createElement('div');
  title.style.cssText = 'font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:10px;';
  title.textContent = 'Comentários';
  wrap.appendChild(title);

  const listEl = document.createElement('div');
  listEl.style.cssText = 'display:flex;flex-direction:column;gap:8px;';

  function renderCommentList(){
    listEl.innerHTML = '';
    if(!comments.length){
      const empty = document.createElement('p');
      empty.style.cssText = 'font-size:13px;color:var(--ink-soft);margin:0;';
      empty.textContent = 'Nenhum comentário ainda.';
      listEl.appendChild(empty);
      return;
    }
    comments.forEach(c => {
      const canEdit   = !gestorSession || c.author_name === gestorName;
      const canDelete = !gestorSession || c.author_name === gestorName;

      const row = document.createElement('div');
      row.style.cssText = 'background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;position:relative;';

      // meta: author | date + trash icon
      const meta = document.createElement('div');
      meta.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;';

      const author = document.createElement('span');
      author.style.cssText = 'font-size:12px;font-weight:700;color:var(--ink);';
      author.textContent = c.author_name;

      const metaRight = document.createElement('div');
      metaRight.style.cssText = 'display:flex;align-items:center;gap:6px;';

      const dateSpan = document.createElement('span');
      dateSpan.style.cssText = 'font-size:11px;color:var(--ink-soft);';
      dateSpan.textContent = fmtDate(c.created_at);
      metaRight.appendChild(dateSpan);

      if(canDelete){
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.title = 'Excluir';
        delBtn.style.cssText = 'background:none;border:none;padding:2px 3px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;opacity:0;transition:opacity .15s;line-height:1;';
        delBtn.innerHTML = phIcon('trash');
        row.addEventListener('mouseenter', () => delBtn.style.opacity = '1');
        row.addEventListener('mouseleave', () => delBtn.style.opacity = '0');
        delBtn.onclick = async () => {
          if(!(await showConfirm('Excluir este comentário?'))) return;
          const { error } = await sb.rpc('delete_banca_comment', { p_comment_id: c.id });
          if(error){ showAlert(error.message); return; }
          comments = comments.filter(x => x.id !== c.id);
          renderCommentList();
        };
        metaRight.appendChild(delBtn);
      }

      meta.appendChild(author);
      meta.appendChild(metaRight);
      row.appendChild(meta);

      // content area — click to edit on hover
      const contentWrap = document.createElement('div');

      function showContentView(){
        contentWrap.innerHTML = '';
        const p = document.createElement('p');
        p.style.cssText = 'font-size:13px;color:var(--ink);margin:0;white-space:pre-wrap;' +
          (canEdit ? 'cursor:text;border-radius:5px;padding:2px 5px;margin:-2px -5px;transition:background .15s;' : '');
        p.textContent = c.content;
        if(canEdit){
          p.addEventListener('mouseenter', () => p.style.background = 'var(--line)');
          p.addEventListener('mouseleave', () => p.style.background = '');
          p.onclick = () => showEditView();
        }
        contentWrap.appendChild(p);
      }

      function showEditView(){
        contentWrap.innerHTML = '';
        const ta = document.createElement('textarea');
        ta.className = 'field';
        ta.value = c.content;
        ta.rows = 3;
        ta.style.cssText = 'resize:vertical;min-height:56px;margin-bottom:6px;';
        const btnRow = document.createElement('div');
        btnRow.style.cssText = 'display:flex;gap:6px;justify-content:flex-end;';
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'btn-sm';
        cancelBtn.textContent = 'Cancelar';
        cancelBtn.onclick = () => showContentView();
        const saveBtn = document.createElement('button');
        saveBtn.className = 'btn-sm primary-outline';
        saveBtn.textContent = 'Salvar';
        saveBtn.onclick = async () => {
          const text = ta.value.trim();
          if(!text) return;
          saveBtn.disabled = true;
          const { error } = await sb.rpc('update_banca_comment', { p_comment_id: c.id, p_content: text });
          saveBtn.disabled = false;
          if(error){ showAlert(error.message); return; }
          c.content = text;
          showContentView();
        };
        btnRow.appendChild(cancelBtn);
        btnRow.appendChild(saveBtn);
        contentWrap.appendChild(ta);
        contentWrap.appendChild(btnRow);
        ta.focus();
      }

      showContentView();
      row.appendChild(contentWrap);
      listEl.appendChild(row);
    });
  }

  renderCommentList();
  wrap.appendChild(listEl);

  // form (admin + gestor only)
  const authorName = gestorSession ? gestorName : 'Thiago Reis';
  const form = document.createElement('div');
  form.style.cssText = 'margin-top:10px;display:flex;flex-direction:column;gap:6px;';
  const ta = document.createElement('textarea');
  ta.className = 'field';
  ta.placeholder = 'Escreva um comentário…';
  ta.rows = 2;
  ta.style.cssText = 'resize:vertical;min-height:56px;margin-bottom:0;';
  const sendBtn = document.createElement('button');
  sendBtn.className = 'btn-sm primary-outline';
  sendBtn.style.alignSelf = 'flex-end';
  sendBtn.textContent = 'Comentar';
  sendBtn.onclick = async () => {
    const text = ta.value.trim();
    if(!text) return;
    sendBtn.disabled = true;
    const { data: newId, error } = await sb.rpc('add_banca_comment', {
      p_banca_id: bancaId, p_author_name: authorName, p_content: text,
    });
    sendBtn.disabled = false;
    if(error){ showAlert(error.message); return; }
    comments.push({ id: newId, banca_id: bancaId, author_name: authorName, content: text, created_at: new Date().toISOString() });
    ta.value = '';
    renderCommentList();
  };
  form.appendChild(ta);
  form.appendChild(sendBtn);
  wrap.appendChild(form);

  return wrap;
}

function buildGestorRow(g, body){
  const row = document.createElement('div'); row.className = 'simple-row';

    ? `<span style="font-size:11px;font-weight:600;color:#16a34a;background:#dcfce7;border-radius:6px;padding:2px 7px;margin-left:8px;">Pode editar</span>`
    : `<span style="font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-left:8px;">Somente leitura</span>`;
  row.innerHTML = `<div class="meta"><strong>${esc(g.name)}</strong>${editBadge}</div>`;
  const acts = document.createElement('div'); acts.className = 'row-acts';
  if(!gestorSession){
    const edit = document.createElement('button'); edit.className = 'btn-sm'; edit.textContent = 'Editar';
    edit.onclick = () => openGestorModal(g, body);
    const del = document.createElement('button'); del.className = 'btn-sm danger'; del.textContent = 'Remover';
    del.onclick = async () => {
      if(!(await showConfirm(`Remover o acesso de "${g.name}"?`))) return;

}

async function renderStageAssignments(){
  const wrap = $('stageAssignmentsWrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="loading-state">Carregando atribuições…</div>';
  const [{ data: readers }, { data: assignments }] = await Promise.all([
    sb.from('banca_readers').select('id,name,role,password_hash').order('name'),
    sb.from('banca_stage_readers').select('stage,reader_id'),
  ]);
  if(!readers){ wrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Erro ao carregar avaliadores.</p>'; return; }
  const assignedMap = {};
  (assignments || []).forEach(a => {
    if(!assignedMap[a.stage]) assignedMap[a.stage] = [];
    assignedMap[a.stage].push(a.reader_id);
  });
  const stageLabels = { 1: '1ª Banca', 2: '2ª Banca', 3: 'Banca Final' };
  wrap.innerHTML = '';
  [1, 2, 3].forEach(stage => {
    const assignedIds = assignedMap[stage] || [];
    const assignedReaders = readers.filter(r => assignedIds.includes(r.id));
    const section = document.createElement('div');
    section.style.cssText = 'margin-bottom:20px;';

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;';
    const label = document.createElement('span');
    label.style.cssText = 'font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.01em;';
    label.textContent = stageLabels[stage];
    const acts = document.createElement('div');
    acts.style.cssText = 'display:flex;gap:6px;align-items:center;';
    if(assignedReaders.length){
      const printBtn = document.createElement('button');
      printBtn.className = 'btn-sm';
      printBtn.innerHTML = `${phIcon('printer')} Imprimir QR`;
      printBtn.style.cssText = 'font-size:12px;';
      printBtn.onclick = () => printReaderQRCodes(assignedReaders, stageLabels[stage]);
      acts.appendChild(printBtn);
    }
    if(!gestorSession){
      const addBtn = document.createElement('button');
      addBtn.className = 'btn-sm primary-outline';
      addBtn.style.cssText = 'font-size:12px;';
      addBtn.textContent = '+ Adicionar';
      addBtn.onclick = () => openStageReaderPicker(stage, assignedIds, stageLabels[stage]);
      acts.appendChild(addBtn);
    }
    header.append(label, acts);
    section.appendChild(header);

    if(!assignedReaders.length){
      const empty = document.createElement('p');
      empty.style.cssText = 'font-size:13px;color:var(--ink-soft);padding:6px 0;';
      empty.textContent = 'Nenhum avaliador atribuído.';
      section.appendChild(empty);
    } else {
      const list = document.createElement('div'); list.className = 'simple-list';
      assignedReaders.forEach(r => {
        const row = document.createElement('div');
        row.className = 'simple-row';
        row.innerHTML = `
          <div class="meta" style="flex:1;">
            <strong>${esc(r.name)}</strong>
            ${r.role ? `<span>${esc(r.role)}</span>` : ''}
          </div>
          ${!gestorSession ? `<div class="row-acts">
            <button class="btn-sm danger" title="Remover da etapa">${phIcon('x')}</button>
          </div>` : ''}`;
        if(!gestorSession) row.querySelector('button').onclick = async () => {
          await sb.from('banca_stage_readers').delete().eq('stage', stage).eq('reader_id', r.id);
          renderStageAssignments();
        };
        list.appendChild(row);
      });
      section.appendChild(list);
    }
    wrap.appendChild(section);
  });
}

function openStageReaderPicker(stage, currentAssignedIds, stageLabel){
  showModal(async (box, close) => {
    box.innerHTML = `
      <h3>Adicionar avaliadores</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">${esc(stageLabel)}</p>
      <div class="loading-state" id="pickerLoading">Carregando avaliadores…</div>
      <div class="picker-list" id="pickerList" style="margin-bottom:16px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn-sm" id="pickerCancel">Cancelar</button>
        <button class="btn-primary auto" id="pickerConfirm" disabled>Adicionar</button>
      </div>`;
    box.querySelector('#pickerCancel').onclick = () => close(null);

    const { data: allReaders } = await sb.from('banca_readers').select('id,name,role').order('name');
    const assignedSet = new Set(currentAssignedIds);
    const available = (allReaders || []).filter(r => !assignedSet.has(r.id));

    box.querySelector('#pickerLoading').remove();
    const list = box.querySelector('#pickerList');
    list.style.display = '';

    if(!available.length){
      list.style.display = 'none';
      const empty = document.createElement('p');
      empty.style.cssText = 'font-size:13px;color:var(--ink-soft);margin-bottom:16px;';
      empty.textContent = 'Todos os avaliadores já estão atribuídos a esta etapa.';
      list.insertAdjacentElement('afterend', empty);
      return;
    }

    const selected = new Set();
    const confirmBtn = box.querySelector('#pickerConfirm');

    available.forEach(r => {
      const row = document.createElement('label');
      row.className = 'picker-row';
      row.htmlFor = `pick_${r.id}`;
      row.innerHTML = `
        <input type="checkbox" id="pick_${r.id}">
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;color:var(--ink);">${esc(r.name)}</div>
          ${r.role ? `<div style="font-size:12px;color:var(--ink-soft);">${esc(r.role)}</div>` : ''}
        </div>`;
      const cb = row.querySelector('input');
      cb.addEventListener('change', () => {
        if(cb.checked) selected.add(r.id); else selected.delete(r.id);
        confirmBtn.disabled = !selected.size;
      });
      list.appendChild(row);
    });

    confirmBtn.onclick = async () => {
      if(!selected.size) return;
      confirmBtn.disabled = true; confirmBtn.textContent = 'Salvando…';
      await Promise.all([...selected].map(rid =>
        sb.from('banca_stage_readers').insert({ stage, reader_id: rid })
      ));
      close(true);
      renderStageAssignments();
    };
  });
}

async function printReaderQRCodes(readers = null, stageLabel = null){
  if(!readers){
    const { data, error } = await sb.from('banca_readers').select('*').order('created_at');
    if(error || !data || !data.length){ showAlert('Nenhum membro cadastrado.'); return; }
    readers = data;
  }
  if(!readers.length){ showAlert('Nenhum avaliador atribuído a esta etapa.'); return; }

  const baseUrl = window.location.href.split('?')[0].split('#')[0];
  const bancaUrl = baseUrl + '?banca=1';
  const qrSize = 220;

  const cards = readers.map(r => {

        <div class="qr-img-wrap">

        </div>
        <div class="qr-name">${esc(r.name)}</div>
        ${r.role ? `<div class="qr-role">${esc(r.role)}</div>` : ''}
        <div class="qr-pw-label">Senha de acesso</div>
        <div class="qr-pw">${esc(r.password_hash || '—')}</div>
        <div class="qr-site">${esc(bancaUrl)}</div>
      </div>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>QR Codes — Acesso da Banca</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#fff;color:#111;padding:24px;}

    .qr-card{

      display:flex;flex-direction:column;align-items:center;text-align:center;
      break-inside:avoid;page-break-inside:avoid;
    }
    .qr-img-wrap{width:${qrSize}px;height:${qrSize}px;margin-bottom:14px;}
    .qr-img-wrap img{width:100%;height:100%;display:block;}
    .qr-name{font-size:15px;font-weight:700;margin-bottom:2px;}
    .qr-role{font-size:12px;color:#666;margin-bottom:10px;}
    .qr-pw-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:4px;margin-top:8px;}

async function renderBancaReadersList(body){
  const wrap = $('bancaReadersList');
  if(!wrap) return;
  wrap.innerHTML = '<div class="loading-state">Carregando membros…</div>';
  const { data: readers } = await sb.from('banca_readers').select('*').order('created_at');
  wrap.innerHTML = '';
  if(!readers || !readers.length){ wrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum membro cadastrado ainda.</p>'; return; }
  readers.forEach(r => wrap.appendChild(buildReaderDisplayRow(r, body)));
}
function buildReaderDisplayRow(r, body){
  const row = document.createElement('div'); row.className = 'simple-row';
  row.innerHTML = `<div class="meta"><strong>${esc(r.name)}</strong><span>${esc(r.role || '')}</span></div>`;
  const acts = document.createElement('div'); acts.className = 'row-acts';
  if(!gestorSession || gestorCanEdit){
    const edit = document.createElement('button'); edit.className = 'btn-sm'; edit.textContent = 'Editar';
    edit.onclick = () => openReaderModal(r, body);
    const del = document.createElement('button'); del.className = 'btn-sm danger'; del.textContent = 'Remover';
    del.onclick = async () => {
      if(!(await showConfirm(`Remover o acesso de "${r.name}"?`))) return;
      const { error } = gestorSession
        ? await sbAnon.rpc('gestor_remove_evaluator_reader', { p_reader_id: r.id })
        : await sb.from('banca_readers').delete().eq('id', r.id);
      if(error){ showAlert(error.message); return; }
      renderBancaReadersList(body);
    };
    acts.append(edit, del);
  }
  row.appendChild(acts);
  return row;
}

/* Modal única para criar/editar um membro da banca (nome, cargo, senha
   com gerador aleatório), no mesmo padrão do "+ Novo grupo". */
function openReaderModal(r, body){
  const isEdit = !!r;
  showModal((box, close) => {
    box.innerHTML = `
      <h3>${isEdit ? 'Editar membro' : 'Adicionar membro'}</h3>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Nome</span>
        <input class="field" id="modalReaderName" style="margin-bottom:0;" placeholder="Nome">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Cargo</span>
        <input class="field" id="modalReaderRole" style="margin-bottom:0;" placeholder="ex: Avaliador externo">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">${isEdit ? 'Nova senha (deixe em branco para manter)' : 'Senha'}</span>
        <div class="field-icon-wrap two-icons">
          <input class="field" id="modalReaderPassword" type="password" placeholder="Senha" autocomplete="off">
          <div class="field-icons">
            <button type="button" class="field-icon-btn" id="modalReaderPwEye" title="Mostrar senha">${phIcon('eye')}</button>
            <button type="button" class="field-icon-btn" id="modalGenPasswordBtn" title="Gerar senha aleatória">${phIcon('dice-five')}</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalSave">Salvar</button>
      </div>`;
    box.querySelector('#modalReaderName').value = isEdit ? r.name : '';
    box.querySelector('#modalReaderRole').value = isEdit ? (r.role || '') : '';
    const pwInput = box.querySelector('#modalReaderPassword');
    const eyeBtn = box.querySelector('#modalReaderPwEye');
    eyeBtn.onclick = () => {
      const showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      eyeBtn.innerHTML = showing ? phIcon('eye') : phIcon('eye-slash');
    };
    box.querySelector('#modalGenPasswordBtn').onclick = () => { pwInput.value = generateRandomPassword(); };
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalSave').onclick = async () => {
      const name = box.querySelector('#modalReaderName').value.trim();
      const role = box.querySelector('#modalReaderRole').value.trim();
      const pw = box.querySelector('#modalReaderPassword').value;
      if(!name){ showAlert('O nome não pode ficar em branco.'); return; }
      if(isEdit){
        const { error } = gestorSession
          ? await sbAnon.rpc('gestor_update_banca_reader', { p_reader_id: r.id, p_name: name, p_role: role })
          : await sb.from('banca_readers').update({ name, role }).eq('id', r.id);
        if(error){ showAlert(error.message); return; }
        if(pw){
          const { error: pwErr } = await (gestorSession ? sbAnon : sb).rpc('admin_set_banca_reader_password', { p_reader_id: r.id, p_password: pw });
          if(pwErr){ showAlert(pwErr.message); return; }
        }
      } else {
        if(!pw){ showAlert('Defina uma senha.'); return; }
        const { error } = await (gestorSession ? sbAnon : sb).rpc('admin_add_banca_reader', { p_name: name, p_role: role, p_password: pw });
        if(error){ showAlert(error.message); return; }
      }
      close(true);
      renderBancaReadersList(body);
    };
  });
}

const TIMER_CHANNEL = 'banca-cronometro';
const TIMER_STORE_KEY = 'pi-banca-cronometro';
const timer = {
  booted: false, channel: null, live: false, peers: 1, groups: [], lastKey: '', raf: 0, idleT: null, closeT: null,
  id: Math.random().toString(36).slice(2, 10),
  S: { phase: 'talk', status: 'ready', endsAt: 0, remaining: 600000, durations: { talk: 600000, banca: 300000 }, group: 'Grupo 1', groupIdx: -1, rev: 0, from: '' },
};
const TIMER_ORDER = ['talk', 'applause1', 'banca', 'applause2'];
const TIMER_PH = {
  talk: { hint: 'Tempo para apresentar a proposta', chip: 'Apresentação' },
  banca: { hint: 'Feedback e perguntas dos avaliadores', chip: 'Banca' },
};
function tmFmt(ms){ const s = Math.round(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function tmParse(v){ const m = String(v).trim().match(/^(\d{1,3})(?:[:.,](\d{1,2}))?$/); if(!m) return null; const ms = (+m[1] * 60 + (m[2] ? +m[2] : 0)) * 1000; return ms > 0 ? ms : null; }
function tmMins(ms){ const s = Math.round(ms / 1000); return s % 60 ? tmFmt(ms) : (s / 60) + ' min'; }
function tmRem(){ const S = timer.S; return S.status === 'running' ? S.endsAt - Date.now() : S.remaining; }
function tmView(){
  const S = timer.S;
  if(S.phase === 'talk' && S.status === 'running' && tmRem() <= 0) return 'applause1';
  if(S.phase === 'banca' && S.status === 'running' && tmRem() <= 0) return 'applause2';
  return S.phase;
}
function tmGroupLabel(g){ return (g && (g.group_name || g.project_title)) || ''; }
function tmShift(name, d){ const m = String(name).match(/^(.*?)(\d+)\s*$/); if(!m) return d > 0 ? name : null; const n = +m[2] + d; return n >= 1 ? m[1] + n : null; }
function tmNextGroup(d){
  const S = timer.S, list = timer.groups;
  if(list.length){
    const i = S.groupIdx >= 0 ? S.groupIdx + d : (d > 0 ? 0 : -1);
    if(i < 0 || i >= list.length) return null;
    return { group: tmGroupLabel(list[i]), groupIdx: i };
  }
  const g = tmShift(S.group, d);
  return g ? { group: g, groupIdx: -1 } : null;
}

/* ---- estado e sincronização ---- */
function tmWire(){ const S = timer.S; return { phase: S.phase, status: S.status, remaining: Math.max(0, tmRem()), durations: S.durations, group: S.group, groupIdx: S.groupIdx, rev: S.rev, from: S.from }; }
function tmSave(){ try { localStorage.setItem(TIMER_STORE_KEY, JSON.stringify({ ...tmWire(), savedAt: Date.now() })); } catch {} }
function tmLoad(){
  try {
    const d = JSON.parse(localStorage.getItem(TIMER_STORE_KEY) || 'null');
    if(d && d.durations){
      const elapsed = d.status === 'running' ? Date.now() - (d.savedAt || Date.now()) : 0;
      timer.S = { ...timer.S, ...d, remaining: d.remaining - elapsed, endsAt: Date.now() + d.remaining - elapsed };
    }
  } catch {}
}
function tmApply(d){
  if(!d || typeof d !== 'object' || !d.durations) return;
  const S = timer.S;
  if((d.rev || 0) < S.rev || ((d.rev || 0) === S.rev && String(d.from) <= String(S.from))) return;
  timer.S = { ...S, ...d, durations: { ...S.durations, ...d.durations }, endsAt: Date.now() + (+d.remaining || 0) };
  tmSave(); tmSyncInputs(); tmRender();
}
function tmCommit(next){
  next.rev = Math.max((timer.S.rev || 0) + 1, Date.now());
  next.from = timer.id;
  if(next.status === 'running' && next.endsAt == null) next.endsAt = Date.now() + next.remaining;
  timer.S = next;
  tmSave(); tmSyncInputs(); tmRender();
  if(timer.channel) timer.channel.send({ type: 'broadcast', event: 'state', payload: tmWire() }).catch(() => {});
}
function tmSetSync(){
  const el = $('tmSync'); if(!el) return;
  el.classList.toggle('on', timer.live);
  el.querySelector('span').textContent = timer.live
    ? 'Sincronizado · ' + timer.peers + (timer.peers === 1 ? ' tela aberta' : ' telas abertas')
    : (isMockMode ? 'Modo de teste · só nesta tela' : 'Conectando…');
}
function tmConnect(){
  if(isMockMode || !sbAnon || !sbAnon.channel || timer.channel) return;
  const ch = sbAnon.channel(TIMER_CHANNEL, { config: { broadcast: { self: false }, presence: { key: timer.id } } });
  ch.on('broadcast', { event: 'state' }, ({ payload }) => tmApply(payload));
  ch.on('broadcast', { event: 'hello' }, () => {
    if(timer.S.rev > 0) ch.send({ type: 'broadcast', event: 'state', payload: tmWire() }).catch(() => {});
  });
  ch.on('presence', { event: 'sync' }, () => {
    timer.peers = Math.max(1, Object.keys(ch.presenceState() || {}).length);
    tmSetSync();
  });
  ch.subscribe(status => {
    timer.live = status === 'SUBSCRIBED';
    if(timer.live){
      ch.track({ screen: true }).catch(() => {});
      ch.send({ type: 'broadcast', event: 'hello', payload: {} }).catch(() => {});
    }
    tmSetSync();
  });
  timer.channel = ch;
}
async function tmLoadGroups(){
  // Se houve sorteio recente neste navegador, "Próximo grupo" segue a ordem sorteada.
  const dw = typeof dwStored === 'function' ? dwStored() : null;
  timer.fromDraw = !!(dw && dw.order && dw.order.length && Date.now() - (dw.drawnAt || 0) < DRAW_MAX_AGE);
  if(timer.fromDraw) timer.groups = dw.order.map(n => ({ group_name: n }));
  else {
    try {
      const client = gestorSession ? sbAnon : sb;
      const { data } = await client.from('groups').select('id,group_name,project_title,order_index').order('order_index');
      timer.groups = (data || []).filter(g => tmGroupLabel(g));
    } catch { timer.groups = []; }
  }
  const field = $('tmGroupField'); if(!field) return;
  $('tmGroupSelLabel').textContent = timer.fromDraw ? 'Grupo · ordem do sorteio' : 'Grupo cadastrado';
  if(!timer.groups.length){ field.hidden = true; return; }
  field.hidden = false;
  tmSyncInputs();
}

/* ---- ações ---- */
function tmToggle(){
  const v = tmView(), S = timer.S;
  if(v === 'applause1' || v === 'applause2') return tmAdvance();
  if(S.status === 'running') tmCommit({ ...S, status: 'paused', remaining: Math.max(0, tmRem()) });
  else { const r = Math.max(1000, S.remaining); tmCommit({ ...S, status: 'running', remaining: r, endsAt: Date.now() + r }); }
}
function tmAdvance(){
  const v = tmView(), S = timer.S, d = S.durations;
  if(v === 'talk') tmCommit({ ...S, phase: 'applause1', status: 'ready' });
  else if(v === 'applause1') tmCommit({ ...S, phase: 'banca', status: 'running', remaining: d.banca, endsAt: Date.now() + d.banca });
  else if(v === 'banca') tmCommit({ ...S, phase: 'applause2', status: 'ready' });
  else { const n = tmNextGroup(1); tmCommit({ ...S, phase: 'talk', status: 'ready', remaining: d.talk, ...(n || {}) }); }
}
function tmBack(){
  const v = tmView(), S = timer.S, d = S.durations;
  if(v === 'applause1') tmCommit({ ...S, phase: 'talk', status: 'ready', remaining: d.talk });
  else if(v === 'banca') tmCommit({ ...S, phase: 'applause1', status: 'ready' });
  else if(v === 'applause2') tmCommit({ ...S, phase: 'banca', status: 'ready', remaining: d.banca });
  else { const p = tmNextGroup(-1); if(p) tmCommit({ ...S, phase: 'applause2', status: 'ready', ...p }); }
}
function tmReset(){
  const v = tmView(), k = (v === 'banca' || v === 'applause2') ? 'banca' : 'talk';
  tmCommit({ ...timer.S, phase: k, status: 'ready', remaining: timer.S.durations[k] });
}
function tmGoNextGroup(){ const n = tmNextGroup(1); if(n) tmCommit({ ...timer.S, phase: 'talk', status: 'ready', remaining: timer.S.durations.talk, ...n }); }
function tmBump(ms){
  const v = tmView(), S = timer.S; if(v !== 'talk' && v !== 'banca') return;
  if(S.status === 'running'){ const r = Math.max(1000, tmRem() + ms); tmCommit({ ...S, remaining: r, endsAt: Date.now() + r }); }
  else tmCommit({ ...S, remaining: Math.max(1000, S.remaining + ms) });
}
function tmSetDur(k, input){
  const ms = tmParse(input.value);
  if(!ms){ input.value = tmFmt(timer.S.durations[k]); return; }
  const c = { ...timer.S, durations: { ...timer.S.durations, [k]: ms } };
  if(timer.S.phase === k && timer.S.status === 'ready') c.remaining = ms;
  tmCommit(c);
}
async function tmFull(){ try { if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }
let tmWake = null;
async function tmKeepAwake(){ try { if(navigator.wakeLock && !tmWake){ tmWake = await navigator.wakeLock.request('screen'); tmWake.addEventListener('release', () => { tmWake = null; }); } } catch {} }

function tmDdBuild(){

function tmDdPick(i){

/* ---- render ---- */
function tmSyncInputs(){
  const a = document.activeElement, S = timer.S;
  if(!$('tmInGroup')) return;
  if(a !== $('tmInGroup')) $('tmInGroup').value = S.group;
  if(a !== $('tmInTalk')) $('tmInTalk').value = tmFmt(S.durations.talk);

  $('tmStTalk').textContent = tmMins(S.durations.talk);

function tmRender(){
  if(!$('tmPanel')) return;
  const S = timer.S, v = tmView(), clap = v === 'applause1' || v === 'applause2';
  const r = clap ? 0 : Math.max(0, tmRem());
  const total = S.durations[v === 'banca' ? 'banca' : 'talk'] || 1;
  const secs = Math.ceil(r / 1000);
  const warn = !clap && secs <= 60 && secs > 10, alert = !clap && secs <= 10 && S.status !== 'ready';
  $('tmBar').style.width = (clap ? 100 : Math.min(100, Math.max(0, (1 - r / total) * 100))) + '%';
  const key = [v, S.status, secs, S.group, warn, alert, S.rev].join('|');
  if(key === timer.lastKey) return;
  timer.lastKey = key;
  $('tmGroup').textContent = S.group;
  $('tmPanel').classList.toggle('clap', clap);
  $('tmPanel').classList.toggle('pulse', alert && S.status === 'running');
  if(!clap){
    const p = TIMER_PH[v];
    $('tmDigits').innerHTML = String(Math.floor(secs / 60)).padStart(2, '0') + '<span class="tm-colon">:</span>' + String(secs % 60).padStart(2, '0');
    $('tmDigits').className = 'tm-digits' + (alert ? ' alert' : warn ? ' warn' : '');
    $('tmTrack').className = 'tm-track' + (alert ? ' alert' : warn ? ' warn' : '');
    const chip = $('tmChip');
    chip.className = 'tm-chip' + (S.status === 'running' ? (warn || alert ? ' warn' : ' running') : '');
    chip.textContent = S.status === 'running' ? (alert ? 'Encerrando' : warn ? 'Último minuto' : p.chip) : S.status === 'paused' ? 'Pausado' : 'Pronto';
    $('tmHint').textContent = S.status === 'ready' ? 'Aguardando início · ' + tmMins(total) : S.status === 'paused' ? 'Tempo pausado' : p.hint;
  } else {
    const first = v === 'applause1', nxt = tmNextGroup(1);
    $('tmApEyebrow').textContent = first ? 'Fim da apresentação' : 'Fim das considerações';
    $('tmApText').textContent = (first ? 'Obrigado, ' : 'Parabéns, ') + S.group;
    $('tmApNext').textContent = first ? 'A seguir: considerações da banca · ' + tmMins(S.durations.banca) : (nxt ? 'A seguir: ' + nxt.group : 'Fim das apresentações');
  }
  const idx = TIMER_ORDER.indexOf(v);
  document.querySelectorAll('#tmSteps li').forEach(li => { const i = TIMER_ORDER.indexOf(li.dataset.k); li.className = i < idx ? 'done' : i === idx ? 'now' : ''; });
  $('tmToggle').textContent = clap ? (v === 'applause1' ? 'Iniciar banca' : 'Próximo grupo') : S.status === 'running' ? 'Pausar' : S.status === 'paused' ? 'Continuar' : 'Iniciar';
}

  if(getRoute() !== 'cronometro'){ timer.raf = 0; return; }
  tmRender();
  timer.raf = requestAnimationFrame(tmLoop);
}
