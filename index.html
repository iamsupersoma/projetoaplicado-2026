      <div class="simple-list" id="evaluatorList"></div>
      <div class="form-row" style="margin-top:12px;">
        <button class="btn-primary auto" id="addEvalBtn">+ Adicionar avaliador</button>
      </div>
      <div style="margin-top:10px;">
        <button class="btn-sm" id="seedEvalBtn">${phIcon('sparkle')} Adicionar avaliadores de exemplo (com notas)</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Notas</h3>
      <div class="hint">Selecione o conceito atribuído por cada avaliador para cada pergunta.</div>
      <div id="adminScoreGrid"></div>
    </div>`;

  $('saveBancaDateBtn').onclick = async () => {
    const dateVal = $('bDate').value || null;
    const { error } = await sb.from('bancas').update({ scheduled_date: dateVal }).eq('id', banca.id);
    if(error){ showAlert(error.message); return; }
    banca.scheduled_date = dateVal;
    showToast('Data salva.');
  };
  $('saveBancaAttachmentsBtn').onclick = async () => {
    const file = $('bReportFile').files[0];
    const payload = { presentation_link: $('bPresentation').value.trim() || null };
    if(file){
      const path = `${banca.id}/${Date.now()}-${file.name}`;
      const { error: upErr } = await sb.storage.from('group-attachments').upload(path, file, { upsert: true });
      if(upErr){ showAlert(upErr.message); return; }
      payload.report_file_path = path;
      payload.report_file_name = file.name;
    }
    const { error } = await sb.from('bancas').update(payload).eq('id', banca.id);
    if(error){ showAlert(error.message); return; }
    Object.assign(banca, payload);
    renderBancaStageBody();
  };

  renderEvaluatorList(banca);
  $('addEvalBtn').onclick = () => openEvaluatorModal(banca, () => { renderEvaluatorList(banca); loadGroupScoreGrid(banca); });
  $('seedEvalBtn').onclick = async () => {
    $('seedEvalBtn').disabled = true;
    $('seedEvalBtn').textContent = 'Adicionando…';
    const sampleEvaluators = [
      { name: 'Jonathan Pinto', role: 'Product Designer', comment: 'Importante refinar o modelo de negócios para ter retenção.' },
      { name: 'Guilherme Montelli', role: 'Product Designer', comment: null },
      { name: 'Coriolano Borges', role: 'Professor', comment: null },
      { name: 'Raul Torma', role: 'Conector de Inovação', comment: null },
      { name: 'Érica Martins', role: 'Empreendedora', comment: 'Para efetivar a implantação da solução, sugiro especialmente dar atenção à questão do meio de pagamento, conforme ponderei na apresentação oral.' },
    ];
    const ratingPool = ['bom', 'muito_bom', 'excelente', 'muito_bom', 'excelente', 'bom', 'regular'];
    let ratingIdx = 0;
    const nextRating = () => ratingPool[(ratingIdx++) % ratingPool.length];
    const errors = [];
    let createdCount = 0;

    for(const sample of sampleEvaluators){
      const { data: ev, error } = await sb.from('evaluators')
        .insert({ banca_id: banca.id, name: sample.name, role: sample.role, comment: sample.comment, order_index: 0 })
        .select().single();
      if(error || !ev){ errors.push(`${sample.name}: ${error?.message || 'falha desconhecida ao criar avaliador'}`); continue; }
      createdCount++;
      for(const cat of rubric){
        for(const q of (cat.questions || [])){
          const { error: scoreErr } = await sb.from('scores').upsert(
            { banca_id: banca.id, evaluator_id: ev.id, question_id: q.id, rating: nextRating(), updated_at: new Date().toISOString() },
            { onConflict: 'evaluator_id,question_id' }
          );
          if(scoreErr && !errors.some(e => e.startsWith('Notas:'))) errors.push(`Notas: ${scoreErr.message}`);
        }
      }
    }
    $('seedEvalBtn').disabled = false;
    $('seedEvalBtn').innerHTML = phIcon('sparkle') + ' Adicionar avaliadores de exemplo (com notas)';
    if(errors.length){
      showAlert(`Criado(s) ${createdCount} de ${sampleEvaluators.length} avaliador(es). Problemas encontrados:\n${errors.join('\n')}`, 'Concluído com avisos');
    }
    renderEvaluatorList(banca);
    loadGroupScoreGrid(banca);
  };

  loadGroupScoreGrid(banca);
}
/* Assistente de notas — uma pergunta por vez, estilo Typeform, com
   indicador de passos (check nos já respondidos) e etapa final de
   Considerações. Aberto por avaliador, dentro de uma banca específica. */
function openNotesWizard(rubricData, banca, evaluator, onClose){
  const steps = [];
  rubricData.forEach(cat => {
    (cat.questions || []).forEach(q => {
      steps.push({ type: 'question', category: cat.title, question: q });
    });
  });
  steps.push({ type: 'considerations' });

  const answers = {};
  (banca.scores || []).forEach(s => { if(s.evaluator_id === evaluator.id && s.rating) answers[s.question_id] = s.rating; });
  let commentValue = evaluator.comment || '';
  let stepIndex = steps.findIndex(st => st.type === 'question' && !answers[st.question.id]);
  if(stepIndex === -1) stepIndex = 0;

  const overlay = document.createElement('div');
  overlay.className = 'wizard-overlay';
  overlay.innerHTML = `
    <button type="button" class="wizard-close" id="wizClose">${phIcon('x')}</button>
    <div class="wizard-inner">
      <div class="wizard-steps" id="wizSteps"></div>
      <div class="wizard-body" id="wizBody"></div>
    </div>`;
  document.body.appendChild(overlay);

  function isStepComplete(i){
    const st = steps[i];
    if(st.type === 'question') return !!answers[st.question.id];
    return !!(commentValue && commentValue.trim());
  }
  function close(){
    overlay.remove();
    document.removeEventListener('keydown', onEsc);
    if(onClose) onClose();
  }
  function onEsc(e){ if(e.key === 'Escape') close(); }
  document.addEventListener('keydown', onEsc);
  overlay.querySelector('#wizClose').onclick = close;

  function renderStepsIndicator(){
    const stepsWrap = overlay.querySelector('#wizSteps');
    stepsWrap.innerHTML = '';
    steps.forEach((st, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'wizard-dot' + (i === stepIndex ? ' current' : '') + (isStepComplete(i) ? ' done' : '');
      dot.innerHTML = isStepComplete(i) ? phIcon('check', {weight:'bold'}) : (i === steps.length - 1 ? phIcon('pencil-simple') : String(i + 1));
      dot.title = st.type === 'question' ? st.question.question : 'Considerações';
      dot.onclick = () => { stepIndex = i; renderStep(); };
      stepsWrap.appendChild(dot);
    });
  }
  function renderStep(){
    renderStepsIndicator();
    const body = overlay.querySelector('#wizBody');
    const st = steps[stepIndex];
    if(st.type === 'question'){
      body.innerHTML = `
        <div class="wizard-eyebrow">${esc(st.category)}</div>
        <h2 class="wizard-question">${esc(st.question.question)}</h2>
        <div class="wizard-options" id="wizOptions"></div>
        <div class="wizard-nav">
          <button type="button" class="btn-sm" id="wizBack" ${stepIndex === 0 ? 'disabled' : ''}>${phIcon('arrow-left')} Voltar</button>
          <span class="wizard-progress">${stepIndex + 1} de ${steps.length}</span>
        </div>`;
      const optsWrap = overlay.querySelector('#wizOptions');
      RATING_ORDER.forEach(r => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wizard-option' + (answers[st.question.id] === r ? ' selected' : '');
        btn.textContent = RATING_LABELS[r];
        btn.onclick = async () => {
          answers[st.question.id] = r;
          const { data: ok } = await sb.rpc('reader_submit_score', {
            p_password: readerPassword, p_evaluator_id: evaluator.id, p_question_id: st.question.id, p_rating: r,
          });
          if(!ok){ showAlert('Não foi possível salvar a nota agora. Tente novamente.'); return; }
          const existing = banca.scores.find(s => s.evaluator_id === evaluator.id && s.question_id === st.question.id);
          if(existing) existing.rating = r; else banca.scores.push({ evaluator_id: evaluator.id, question_id: st.question.id, rating: r });
          if(stepIndex < steps.length - 1){
            setTimeout(() => { stepIndex++; renderStep(); }, 200);
          } else {
            renderStep();
          }
        };
        optsWrap.appendChild(btn);
      });
      overlay.querySelector('#wizBack').onclick = () => { if(stepIndex > 0){ stepIndex--; renderStep(); } };
    } else {
      body.innerHTML = `
        <div class="wizard-eyebrow">Última etapa</div>
        <h2 class="wizard-question">Considerações</h2>
        <textarea id="wizComment" class="wizard-textarea" placeholder="Comentário/observação (opcional)"></textarea>
        <div class="wizard-nav">
          <button type="button" class="btn-sm" id="wizBack">${phIcon('arrow-left')} Voltar</button>
          <button type="button" class="btn-primary auto" id="wizFinish">Concluir</button>
        </div>`;
      overlay.querySelector('#wizComment').value = commentValue;
      overlay.querySelector('#wizBack').onclick = () => { stepIndex--; renderStep(); };
      overlay.querySelector('#wizFinish').onclick = async () => {
        commentValue = overlay.querySelector('#wizComment').value;
        const { data: ok } = await sb.rpc('reader_submit_comment', {
          p_password: readerPassword, p_evaluator_id: evaluator.id, p_comment: commentValue.trim() || null,
        });
        if(!ok){ showAlert('Não foi possível salvar agora. Tente novamente.'); return; }
        evaluator.comment = commentValue.trim() || null;
        close();
      };
    }
  }
  renderStep();
}

/* Modal para adicionar avaliador a uma banca: escolhe um membro já
   cadastrado (liga o login dele ao registro) ou entra como convidado
   (sem acesso ao formulário, só informativo). */
async function openEvaluatorModal(banca, onDone){
  const { data: readers } = await sb.from('banca_readers').select('*').order('name');
  showModal((box, close) => {
    box.innerHTML = `
      <h3>Adicionar avaliador</h3>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Membro da banca</span>
        <select class="field" id="modalEvalReader" style="margin-bottom:0;">
          <option value="">Convidado (sem login, só informativo)</option>
          ${(readers || []).map(r => `<option value="${r.id}">${esc(r.name)}${r.role ? ' — ' + esc(r.role) : ''}</option>`).join('')}
        </select>
      </div>
      <div id="modalEvalGuestFields">
        <div style="margin-bottom:10px;">
          <span class="modal-field-label">Nome</span>
          <input class="field" id="modalEvalName" style="margin-bottom:0;" placeholder="Nome">
        </div>
        <div style="margin-bottom:10px;">
          <span class="modal-field-label">Cargo</span>
          <input class="field" id="modalEvalRole" style="margin-bottom:0;" placeholder="ex: Presidente da Banca">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalSave">Adicionar</button>
      </div>`;
    const select = box.querySelector('#modalEvalReader');
    const guestFields = box.querySelector('#modalEvalGuestFields');
    const syncVisibility = () => { guestFields.style.display = select.value ? 'none' : ''; };
    select.onchange = syncVisibility;
    syncVisibility();
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalSave').onclick = async () => {
      let payload;
      if(select.value){
        const reader = (readers || []).find(r => r.id === select.value);
        payload = { banca_id: banca.id, reader_id: reader.id, name: reader.name, role: reader.role || null, order_index: 0 };
      } else {
        const name = box.querySelector('#modalEvalName').value.trim();
        const role = box.querySelector('#modalEvalRole').value.trim();
        if(!name){ showAlert('Preencha o nome.'); return; }
        payload = { banca_id: banca.id, reader_id: null, name, role: role || null, order_index: 0 };
      }
      const { error } = await sb.from('evaluators').insert(payload);
      if(error){ showAlert(error.message); return; }
      close(true);
      if(onDone) onDone();
    };
  });
}

async function renderEvaluatorList(banca){
  const wrap = $('evaluatorList');
  const { data: evaluators } = await sb.from('evaluators').select('*').eq('banca_id', banca.id).order('order_index');
  wrap.innerHTML = '';
  if(!evaluators || !evaluators.length){ wrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum avaliador ainda.</p>'; return; }
  evaluators.forEach(ev => {
    const row = document.createElement('div'); row.className = 'evaluator-row';
    row.innerHTML = `<div class="meta"><strong>${esc(ev.name)}</strong><span>${esc(ev.role||'')}</span>${ev.comment ? `<div class="comment">${esc(ev.comment)}</div>` : ''}</div>`;
    const acts = document.createElement('div'); acts.className = 'row-acts';
    const edit = document.createElement('button'); edit.className = 'btn-sm'; edit.textContent = 'Editar';
    edit.onclick = async () => {
      const result = await showPrompt('Editar avaliador', [
        { key: 'name', label: 'Nome', value: ev.name },
        { key: 'role', label: 'Cargo', value: ev.role || '' },
        { key: 'comment', label: 'Comentário/observação (opcional)', value: ev.comment || '' },
      ]);
      if(!result) return;
      await sb.from('evaluators').update({ name: result.name || ev.name, role: result.role, comment: result.comment || null }).eq('id', ev.id);
      renderEvaluatorList(banca);
    };
    const del = document.createElement('button'); del.className = 'btn-sm danger'; del.textContent = 'Excluir';
    del.onclick = async () => {
      if(!(await showConfirm('Excluir este avaliador? As notas dele nesta banca também serão apagadas.'))) return;
      await sb.from('evaluators').delete().eq('id', ev.id);
      renderEvaluatorList(banca);
      loadGroupScoreGrid(banca);
    };
    acts.append(edit, del); row.appendChild(acts); wrap.appendChild(row);
  });
}
async function loadGroupScoreGrid(banca){
  const gridWrap = $('adminScoreGrid');
  const { data: evaluators } = await sb.from('evaluators').select('*').eq('banca_id', banca.id).order('order_index');
  const { data: scores } = await sb.from('scores').select('*').eq('banca_id', banca.id);
  const bancaForGrid = { evaluators: evaluators || [], scores: (scores||[]).map(s => ({ evaluator_id: s.evaluator_id, question_id: s.question_id, rating: s.rating })) };
  gridWrap.innerHTML = '';
  gridWrap.appendChild(renderRubricGrid(rubric, bancaForGrid, {
    canEdit: true,
    onScoreChange: async (evaluatorId, questionId, rating) => {
      await sb.from('scores').upsert({ banca_id: banca.id, evaluator_id: evaluatorId, question_id: questionId, rating, updated_at: new Date().toISOString() }, { onConflict: 'evaluator_id,question_id' });
    }
  }));
}

/* ======================= ADMIN: CONFIG TAB ======================= */
function renderAdminConfigTab(body){
  const alunoUrl = location.origin + location.pathname + '?aluno=1';
  const profUrl = location.origin + location.pathname + '?professores=1';

      <h3 style="margin-bottom:14px;">Links úteis para compartilhar</h3>

      </div>

/* ======================= ADMIN: USUÁRIOS TAB ======================= */
function renderAdminUsuariosTab(body){
  body.innerHTML = `
    <div class="admin-section">
      <h3>Membros da banca (acesso de leitura)</h3>
      <div class="hint">Cada um tem nome + cargo + senha próprios, sem precisar de conta — na página de acesso da banca, escolhem a aba "Banca" pra entrar com a senha própria e ver todos os grupos, sem editar nada.</div>
      <div class="simple-list" id="bancaReadersList" style="margin-bottom:14px;"></div>
      <button class="btn-primary auto" id="addReaderBtn">+ Adicionar membro</button>
    </div>`;
  renderBancaReadersList(body);
  $('addReaderBtn').onclick = () => openReaderModal(null, body);
}
async function renderBancaReadersList(body){
  const wrap = $('bancaReadersList');
  const { data: readers } = await sb.from('banca_readers').select('*').order('created_at');
  wrap.innerHTML = '';
  if(!readers || !readers.length){ wrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum membro cadastrado ainda.</p>'; return; }
  readers.forEach(r => wrap.appendChild(buildReaderDisplayRow(r, body)));
}
function buildReaderDisplayRow(r, body){
  const row = document.createElement('div'); row.className = 'simple-row';
  row.innerHTML = `<div class="meta"><strong>${esc(r.name)}</strong><span>${esc(r.role || '')}</span></div>`;
  const acts = document.createElement('div'); acts.className = 'row-acts';
  const edit = document.createElement('button'); edit.className = 'btn-sm'; edit.textContent = 'Editar';
  edit.onclick = () => openReaderModal(r, body);
  const del = document.createElement('button'); del.className = 'btn-sm danger'; del.textContent = 'Remover';
  del.onclick = async () => {
    if(!(await showConfirm(`Remover o acesso de "${r.name}"?`))) return;
    await sb.from('banca_readers').delete().eq('id', r.id);
    renderBancaReadersList(body);
  };
  acts.append(edit, del); row.appendChild(acts);
  return row;
}

/* Modal única para criar/editar um membro da banca (nome, cargo, senha
   com gerador aleatório), no mesmo padrão do "+ Novo grupo". */
function openReaderModal(r, body){
  const isEdit = !!r;
  showModal((box, close) => {
    box.innerHTML = `
      <h3>${isEdit ? 'Editar membro' : 'Adicionar membro'}</h3>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Nome</span>
        <input class="field" id="modalReaderName" style="margin-bottom:0;" placeholder="Nome">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Cargo</span>
        <input class="field" id="modalReaderRole" style="margin-bottom:0;" placeholder="ex: Avaliador externo">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">${isEdit ? 'Nova senha (deixe em branco para manter)' : 'Senha'}</span>
        <div style="display:flex; gap:6px;">
          <input class="field" id="modalReaderPassword" type="text" style="margin-bottom:0;" placeholder="Senha">
          <button type="button" class="btn-sm" id="modalGenPasswordBtn" title="Gerar senha aleatória">${phIcon('dice-five')}</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalSave">Salvar</button>
      </div>`;
    box.querySelector('#modalReaderName').value = isEdit ? r.name : '';
    box.querySelector('#modalReaderRole').value = isEdit ? (r.role || '') : '';
    box.querySelector('#modalGenPasswordBtn').onclick = () => { box.querySelector('#modalReaderPassword').value = generateRandomPassword(); };
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalSave').onclick = async () => {
      const name = box.querySelector('#modalReaderName').value.trim();
      const role = box.querySelector('#modalReaderRole').value.trim();
      const pw = box.querySelector('#modalReaderPassword').value;
      if(!name){ showAlert('O nome não pode ficar em branco.'); return; }
      if(isEdit){
        const { error } = await sb.from('banca_readers').update({ name, role }).eq('id', r.id);
        if(error){ showAlert(error.message); return; }
        if(pw){
          const { error: pwErr } = await sb.rpc('admin_set_banca_reader_password', { p_reader_id: r.id, p_password: pw });
          if(pwErr){ showAlert(pwErr.message); return; }
        }
      } else {
        if(!pw){ showAlert('Defina uma senha.'); return; }
        const { error } = await sb.rpc('admin_add_banca_reader', { p_name: name, p_role: role, p_password: pw });
        if(error){ showAlert(error.message); return; }
      }
      close(true);
      renderBancaReadersList(body);
    };
  });
}

/* ======================= INIT ======================= */
async function renderRoute(){
  renderHeaderNav();
  const route = getRoute();

  if(!sb){
    if(route === 'admin') renderAdminLogin();
    else if(route === 'aluno') renderAlunoPage();
    else if(route === 'grupo') renderGrupoGate(currentRoute.slug);
    else renderHomePage();
    return;
  }

  if(route === 'admin'){
    const { data: { session: s } } = await sb.auth.getSession();
    if(s){ session = s; await bootAdminPanel(); }
    else renderAdminLogin();
  } else if(route === 'aluno'){
    renderAlunoPage();
  } else if(route === 'grupo'){
    renderGrupoGate(currentRoute.slug);
  } else {
    await loadLinksData();
    renderHomePage();
  }
}

(async () => {
  $('logoArea').onclick = goHome;
  await renderRoute();
})();
