/* ======================= SORTEIO DA ORDEM (?sorteio=1) =======================
   Sorteia a ordem de apresentação dos grupos, na mesma identidade do cronômetro.
   Quem sorteia gera a ordem e envia para as outras telas (Supabase Realtime, canal
   broadcast); todas tocam a mesma revelação, posição por posição. O resultado fica
   salvo no navegador e o cronômetro passa a seguir essa ordem em "Próximo grupo". */
const DRAW_CHANNEL = 'banca-sorteio';
const DRAW_STORE_KEY = 'pi-banca-sorteio';
const DRAW_MAX_AGE = 12 * 3600 * 1000;
const draw = {
  booted: false, channel: null, live: false, peers: 1, raf: 0, idleT: null, closeT: null,
  id: Math.random().toString(36).slice(2, 10),
  S: { names: [], order: [], rev: 0, from: '', drawnAt: 0 },
  anim: null, lastKey: '', spinName: '', lastSwap: 0, landedAt: -1,
};
function dwStored(){
  try { const d = JSON.parse(localStorage.getItem(DRAW_STORE_KEY) || 'null'); return d && Array.isArray(d.names) ? d : null; } catch { return null; }
}
function dwSave(){ try { localStorage.setItem(DRAW_STORE_KEY, JSON.stringify(draw.S)); } catch {} }
function dwReduced(){ return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; }
function dwSlotMs(i, n){ if(dwReduced()) return 500; return i >= n - 1 ? 900 : 1900; }
function dwSpinMs(){ return dwReduced() ? 0 : 1400; }
function dwShuffle(list){
  const a = list.slice();
  for(let i = a.length - 1; i > 0; i--){
    let r; try { r = crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296; } catch { r = Math.random(); }
    const j = Math.floor(r * (i + 1)); [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function dwParseNames(text){
  const seen = new Set();
  return String(text).split('\n').map(s => s.trim()).filter(s => s && !seen.has(s.toLowerCase()) && seen.add(s.toLowerCase()));
}
/* Quantas posições já foram reveladas e em que ponto está a atual. */
function dwProgress(){
  const n = draw.S.order.length;
  if(!n) return { done: 0, n, cur: -1, t: 0 };
  if(!draw.anim) return { done: n, n, cur: -1, t: 1 };
  let el = Date.now() - draw.anim.start;
  for(let i = 0; i < n; i++){
    const d = dwSlotMs(i, n);
    if(el < d) return { done: i, n, cur: i, t: el / d, el };
    el -= d;
  }
  draw.anim = null;
  return { done: n, n, cur: -1, t: 1 };
}

/* ---- sincronização ---- */
function dwWire(animate){ return { ...draw.S, animate: !!animate }; }
function dwApply(d){
  if(!d || !Array.isArray(d.names)) return;
  const S = draw.S;
  if((d.rev || 0) < S.rev || ((d.rev || 0) === S.rev && String(d.from) <= String(S.from))) return;
  const { animate, ...rest } = d;
  draw.S = { ...S, ...rest };
  draw.anim = animate && rest.order && rest.order.length ? { start: Date.now() } : null;
  draw.lastKey = '';
  dwSave(); dwSyncInputs(); dwRender();
}
function dwCommit(next, animate){
  next.rev = Math.max((draw.S.rev || 0) + 1, Date.now());
  next.from = draw.id;
  draw.S = next;
  draw.anim = animate ? { start: Date.now() } : null;
  draw.lastKey = '';
  dwSave(); dwSyncInputs(); dwRender();
  if(draw.channel) draw.channel.send({ type: 'broadcast', event: 'state', payload: dwWire(animate) }).catch(() => {});
}
function dwSetSync(){
  const el = $('dwSync'); if(!el) return;
  el.classList.toggle('on', draw.live);
  el.querySelector('span').textContent = draw.live
    ? 'Sincronizado · ' + draw.peers + (draw.peers === 1 ? ' tela aberta' : ' telas abertas')
    : (isMockMode ? 'Modo de teste · só nesta tela' : 'Conectando…');
}
function dwConnect(){
  if(isMockMode || !sbAnon || !sbAnon.channel || draw.channel) return;
  const ch = sbAnon.channel(DRAW_CHANNEL, { config: { broadcast: { self: false }, presence: { key: draw.id } } });
  ch.on('broadcast', { event: 'state' }, ({ payload }) => dwApply(payload));
  ch.on('broadcast', { event: 'hello' }, () => {
    if(draw.S.rev > 0) ch.send({ type: 'broadcast', event: 'state', payload: dwWire(false) }).catch(() => {});
  });
  ch.on('presence', { event: 'sync' }, () => { draw.peers = Math.max(1, Object.keys(ch.presenceState() || {}).length); dwSetSync(); });
  ch.subscribe(status => {
    draw.live = status === 'SUBSCRIBED';
    if(draw.live){
      ch.track({ screen: true }).catch(() => {});
      ch.send({ type: 'broadcast', event: 'hello', payload: {} }).catch(() => {});
    }
    dwSetSync();
  });
  draw.channel = ch;
}
async function dwFetchGroupNames(){
  try {
    const client = gestorSession ? sbAnon : sb;
    const { data } = await client.from('groups').select('group_name,project_title,order_index').order('order_index');
    return (data || []).map(g => tmGroupLabel(g)).filter(Boolean);
  } catch { return []; }
}

/* ---- ações ---- */
function dwDraw(){
  if(draw.anim) return;
  const names = draw.S.names;
  if(names.length < 2){ dwOpenDrawer(); $('dwNames')?.focus(); return; }
  dwCommit({ ...draw.S, order: dwShuffle(names), drawnAt: Date.now(), manual: false }, true);
}
function dwClear(){ if(draw.S.order.length) dwCommit({ ...draw.S, order: [], drawnAt: 0, manual: false }, false); }
function dwSetNames(names){
  const same = names.length === draw.S.names.length && names.every((n, i) => n === draw.S.names[i]);
  if(same) return;
  dwCommit({ ...draw.S, names, order: [], drawnAt: 0, manual: false }, false);
}
async function dwReloadGroups(){
  const names = await dwFetchGroupNames();
  if(names.length) dwSetNames(names);
  else showToast('Nenhum grupo cadastrado encontrado');
}
function dwOpenDrawer(){ clearTimeout(draw.closeT); $('dwDrawer')?.classList.add('open'); }

/* ---- render ---- */
function dwSyncInputs(){
  const ta = $('dwNames'); if(!ta) return;
  if(document.activeElement !== ta) ta.value = draw.S.names.join('\n');
  $('dwCount').textContent = draw.S.names.length + (draw.S.names.length === 1 ? ' grupo' : ' grupos');
}
function dwRender(){
  if(!$('dwStage')) return;
  const S = draw.S, p = dwProgress(), now = Date.now();
  const n = S.order.length, pending = !n, total = pending ? S.names.length : n;
  const stage = $('dwStage');

  // nome girando na posição atual
  let shown = '', spinning = false;
  if(p.cur >= 0){
    const spin = dwSpinMs(), el = p.el || 0;
    const remaining = S.order.slice(p.cur);
    if(el < spin && remaining.length > 1){
      spinning = true;
      const t = el / spin, gap = 55 + 320 * t * t;
      if(now - draw.lastSwap > gap || !draw.spinName){
        let next = remaining[Math.floor(Math.random() * remaining.length)];
        if(next === draw.spinName && remaining.length > 1) next = remaining[(remaining.indexOf(next) + 1) % remaining.length];
        draw.spinName = next; draw.lastSwap = now;
      }
      shown = draw.spinName;
    } else shown = S.order[p.cur];
  }
  const key = [S.rev, p.done, p.cur, spinning ? shown : '', spinning, total].join('|');
  if(key === draw.lastKey) return;
  draw.lastKey = key;

  const chip = $('dwChip');
  const ord = i => `${i + 1}<sup>º</sup>`;
  stage.classList.toggle('spinning', spinning);
  $('dwCta').hidden = !pending;
  if(pending){
    chip.className = 'tm-chip'; chip.textContent = 'Pronto';
    $('dwEyebrow').textContent = 'Ordem dos grupos';
    $('dwPos').innerHTML = '?';
    $('dwName').textContent = total >= 2 ? 'Quem começa?' : 'Liste os grupos';
    $('dwSub').textContent = total >= 2 ? total + ' grupos no sorteio' : 'Abra os controles no canto inferior direito e liste pelo menos dois grupos.';
    stage.classList.remove('landed');
  } else if(p.cur >= 0){
    chip.className = 'tm-chip running'; chip.textContent = 'Sorteando';
    $('dwEyebrow').textContent = p.cur === 0 ? 'Primeiro da ordem' : p.cur === n - 1 ? 'Último da ordem' : 'Próxima posição';
    $('dwPos').innerHTML = ord(p.cur);
    $('dwName').textContent = shown;
    $('dwSub').textContent = (p.cur + 1) + ' de ' + n;
    stage.classList.toggle('landed', !spinning);
    if(!spinning && draw.landedAt !== p.cur){ draw.landedAt = p.cur; stage.classList.remove('landed'); void stage.offsetWidth; stage.classList.add('landed'); }
  } else {
    chip.className = 'tm-chip'; chip.textContent = S.manual ? 'Ordem ajustada' : 'Ordem definida';
    $('dwEyebrow').textContent = 'Primeiro da ordem';
    $('dwPos').innerHTML = ord(0);
    $('dwName').textContent = S.order[0];
    $('dwSub').textContent = 'Arraste os grupos na lista para ajustar · o cronômetro segue esta ordem';
    stage.classList.add('landed');
    draw.landedAt = -1;
  }

  if(draw.drag) return;
  const list = $('dwList');
  list.classList.toggle('two', total > 6);
  const shownDone = pending ? 0 : p.done + (p.cur >= 0 && !spinning ? 1 : 0);
  const movable = !pending && p.cur < 0;
  list.classList.toggle('movable', movable);
  let html = '';
  for(let i = 0; i < total; i++){
    const filled = !pending && i < shownDone;
    const isNow = filled && p.cur === i;
    html += dwItem(i, filled ? S.order[i] : null, isNow, movable);
  }
  list.innerHTML = html;
  if(draw.refocus != null){ list.children[draw.refocus]?.focus(); draw.refocus = null; }
}
function dwItem(i, name, isNow, movable, dragging){
  const cls = [name != null ? 'filled' : '', isNow ? 'now' : '', dragging ? 'dragging' : ''].filter(Boolean).join(' ');
  const attrs = movable ? ` data-i="${i}" tabindex="0" aria-label="${i + 1}º ${esc(name)}. Arraste ou use Alt e as setas para mudar a posição."` : '';
  return `<li class="${cls}"${attrs}><b>${i + 1}</b><span>${name != null ? esc(name) : '—'}</span>${movable ? '<i class="ph-bold ph-dots-six-vertical dw-grip" aria-hidden="true"></i>' : ''}</li>`;
}

/* ---- ajuste manual: arrastar (mouse ou toque) e Alt + setas ---- */
function dwMove(from, to){
  const order = draw.S.order.slice();
  if(to < 0 || to >= order.length || from === to) return;
  const [it] = order.splice(from, 1); order.splice(to, 0, it);
  dwCommit({ ...draw.S, order, manual: true }, false);
}
function dwDragStart(e){
  const li = e.target.closest('#dwList.movable li[data-i]');
  if(!li || draw.anim || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const from = +li.dataset.i;
  draw.drag = { from, to: from, order: draw.S.order.slice(), id: e.pointerId };
  document.body.classList.add('dw-dragging');
  dwDragPaint();
}
function dwDragMove(e){
  const d = draw.drag; if(!d || e.pointerId !== d.id) return;
  const items = [...$('dwList').children];
  let best = d.to, bestDist = Infinity;
  items.forEach((el, i) => {
    const r = el.getBoundingClientRect();
    const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
    if(dist < bestDist){ bestDist = dist; best = i; }
  });
  if(best !== d.to){ d.to = best; dwDragPaint(); }
}
function dwDragPaint(){
  const d = draw.drag, list = $('dwList');
  const order = d.order.slice(); const [it] = order.splice(d.from, 1); order.splice(d.to, 0, it);
  list.innerHTML = order.map((n, i) => dwItem(i, n, false, true, i === d.to)).join('');
}
function dwDragEnd(e){
  const d = draw.drag; if(!d || (e && e.pointerId !== d.id)) return;
  draw.drag = null;
  document.body.classList.remove('dw-dragging');
  draw.lastKey = '';
  if(d.to !== d.from) dwMove(d.from, d.to); else dwRender();
}
function dwListKey(e){
  const li = e.target.closest('#dwList.movable li[data-i]'); if(!li) return;
  e.stopPropagation();
  if(!e.altKey || !/^Arrow(Up|Down|Left|Right)$/.test(e.key)){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); (e.key === 'ArrowDown' ? li.nextElementSibling : li.previousElementSibling)?.focus(); }
    return;
  }
  e.preventDefault();
  const from = +li.dataset.i, to = from + (e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 1);
  if(to < 0 || to >= draw.S.order.length) return;
  draw.refocus = to;
  dwMove(from, to);
}
function dwLoop(){
  if(getRoute() !== 'sorteio'){ draw.raf = 0; return; }
  dwRender();
  draw.raf = requestAnimationFrame(dwLoop);
}

async function renderDrawPage(){
  document.body.classList.add('timer-mode');
  document.title = 'Sorteio da Ordem · Projeto Interdisciplinar';
  const stored = dwStored();
  if(stored) draw.S = { ...draw.S, ...stored };
  draw.anim = null; draw.lastKey = '';
  root().innerHTML = `
    <div id="timerApp">
      <div class="tm-stage">
        <section class="tm-panel">
          <div class="tm-head">
            <h1 class="tm-group">Sorteio da ordem</h1>
            <span class="tm-chip" id="dwChip">Pronto</span>
          </div>
          <div class="dw-body">
            <div class="dw-stage" id="dwStage" aria-live="polite">
              <p class="dw-eyebrow" id="dwEyebrow">Ordem dos grupos</p>
              <p class="dw-pos" id="dwPos">?</p>
              <p class="dw-name" id="dwName"></p>
              <p class="dw-sub" id="dwSub"></p>
              <button class="dw-cta" id="dwCta">Sortear ordem</button>
            </div>
            <ol class="dw-list" id="dwList"></ol>
          </div>
        </section>
        <div class="tm-foot">
          <div><strong>Projeto Interdisciplinar</strong><small>MBA Ciência de Dados &amp; MBA Liderança, Gestão de Equipe e People Analytics</small></div>
          <img class="tm-logo" alt="UniSenac" src="${TIMER_LOGO_SRC}">
        </div>
      </div>
      <div class="tm-hotspot" id="dwHotspot" aria-hidden="true"></div>
      <aside class="tm-drawer" id="dwDrawer" aria-label="Controles do sorteio">
        <button class="tm-close" id="dwClose" aria-label="Fechar controles">×</button>
        <div>
          <h3>Controles</h3>
          <div class="tm-sync" id="dwSync"><i></i><span>Conectando…</span></div>
        </div>
        <div class="tm-field"><label for="dwNames">Grupos no sorteio · <span id="dwCount"></span></label><textarea id="dwNames" spellcheck="false" placeholder="Um grupo por linha"></textarea></div>
        <p class="tm-note">Um grupo por linha. Serve para bancas ou atividades de aula; mudar a lista apaga o resultado atual.</p>
        <div class="tm-stack">
          <button class="primary" id="dwDraw">Sortear ordem</button>
          <div class="tm-row"><button id="dwClear">Limpar resultado</button><button id="dwReload">Recarregar grupos</button></div>
          <a class="tm-linkbtn" href="?cronometro=1" target="_blank" rel="noopener">Abrir o cronômetro</a>
          <button id="dwFull">Tela cheia</button>
        </div>
        <p class="tm-keys"><kbd>Espaço</kbd> sortear · <kbd>F</kbd> tela cheia · <kbd>Esc</kbd> fechar</p>
        <button class="tm-exit" id="dwExit">Sair do sorteio</button>
      </aside>
    </div>`;

  const drawer = $('dwDrawer');
  const close = () => { drawer.classList.remove('open'); if(drawer.contains(document.activeElement)) document.activeElement.blur(); };
  draw.closeDrawer = close;
  $('dwHotspot').addEventListener('mouseenter', dwOpenDrawer);
  $('dwHotspot').addEventListener('click', () => drawer.classList.contains('open') ? close() : dwOpenDrawer());
  drawer.addEventListener('mouseenter', () => clearTimeout(draw.closeT));
  drawer.addEventListener('mouseleave', () => {
    const a = document.activeElement;
    if(!drawer.contains(a) || a.tagName === 'BUTTON' || a.tagName === 'A') draw.closeT = setTimeout(close, 700);
  });
  $('dwClose').onclick = close;
  $('dwCta').onclick = () => { dwDraw(); };
  $('dwDraw').onclick = () => { close(); dwDraw(); };
  $('dwClear').onclick = dwClear;
  $('dwReload').onclick = dwReloadGroups;
  $('dwFull').onclick = tmFull;
  $('dwExit').onclick = () => { if(document.fullscreenElement) document.exitFullscreen().catch(() => {}); goHome(); };
  $('dwNames').addEventListener('change', e => dwSetNames(dwParseNames(e.target.value)));
  $('dwList').addEventListener('pointerdown', dwDragStart);
  $('dwList').addEventListener('keydown', dwListKey);
  if(!draw.dragWired){
    draw.dragWired = true;
    window.addEventListener('pointermove', dwDragMove);
    window.addEventListener('pointerup', dwDragEnd);
    window.addEventListener('pointercancel', dwDragEnd);
  }

  if(!draw.booted){
    draw.booted = true;
    document.addEventListener('keydown', e => {
      if(getRoute() !== 'sorteio' || /^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName) || e.target.closest?.('#dwList')) return;
      if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); dwDraw(); }
      else if(e.key === 'f' || e.key === 'F') tmFull();
      else if(e.key === 'Escape' && draw.closeDrawer) draw.closeDrawer();
    });
    document.addEventListener('mousemove', () => {
      if(getRoute() !== 'sorteio') return;
      document.body.classList.remove('tm-idle');
      clearTimeout(draw.idleT);
      draw.idleT = setTimeout(() => { if(getRoute() === 'sorteio' && !$('dwDrawer')?.classList.contains('open')) document.body.classList.add('tm-idle'); }, 2500);
    });
  }

  dwSyncInputs(); dwRender(); dwSetSync();
  dwConnect();
  if(!draw.raf) draw.raf = requestAnimationFrame(dwLoop);
  if(!draw.S.names.length){
    // carga inicial só local (rev 0): se outra tela já tem um sorteio, o dela prevalece
    const names = await dwFetchGroupNames();
    if(names.length && !draw.S.names.length){ draw.S = { ...draw.S, names }; draw.lastKey = ''; dwSyncInputs(); dwRender(); }
  }
}
function teardownDrawPage(){
  if(draw.channel){ try { sbAnon.removeChannel(draw.channel); } catch {} draw.channel = null; draw.live = false; }
}


/* ======================= INIT ======================= */
async function renderRoute(){
  renderHeaderNav();
  const route = getRoute();

  if(route === 'cronometro'){ teardownDrawPage(); renderTimerPage(); return; }
  if(route === 'sorteio'){ teardownTimerPage(); renderDrawPage(); return; }
  teardownTimerPage(); teardownDrawPage();

  if(!sb){
    if(route === 'admin') renderAdminLogin();
    else if(route === 'banca') renderBancaLoginPage();
    else if(route === 'aluno') renderAlunoPage();
    else if(route === 'grupo') renderGrupoGate(currentRoute.slug);
    else renderHomePage();
    return;
  }

  if(route === 'admin'){
    const { data: { session: s } } = await sb.auth.getSession();
    if(s){ session = s; await bootAdminPanel(); }
    else renderAdminLogin();
  } else if(route === 'banca'){
    renderBancaLoginPage();
  } else if(route === 'aluno'){
    renderAlunoPage();
  } else if(route === 'grupo'){
    renderGrupoGate(currentRoute.slug);
  } else {
    await loadLinksData();
    renderHomePage();
  }
}

(async () => {
  $('logoArea').onclick = goHome;
  await renderRoute();
})();
</script>
