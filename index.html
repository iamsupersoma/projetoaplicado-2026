/* Assistente de notas — uma pergunta por vez, estilo Typeform, com
   indicador de passos (check nos já respondidos) e etapa final de
   Considerações. Aberto por avaliador, dentro de uma banca específica. */
function openNotesWizard(rubricData, group, banca, evaluator, onClose){
  const steps = [];
  rubricData.forEach(cat => {
    (cat.questions || []).forEach(q => {
      steps.push({ type: 'question', category: cat.title, question: q });
    });
  });
  steps.push({ type: 'considerations' });

  // evaluator pode ser null (ainda não criado — auto-criado no primeiro submit)
  let myEvaluatorId = evaluator?.id || null;
  const answers = {};
  if(myEvaluatorId){
    (banca.scores || []).forEach(s => { if(s.evaluator_id === myEvaluatorId && s.rating) answers[s.question_id] = s.rating; });
  }
  let commentValue = evaluator?.comment || '';
  let stepIndex = steps.findIndex(st => st.type === 'question' && !answers[st.question.id]);
  if(stepIndex === -1) stepIndex = 0;

  const overlay = document.createElement('div');
  overlay.className = 'wizard-overlay';
  overlay.innerHTML = `
    <button type="button" class="wizard-close" id="wizClose">${phIcon('x')}</button>
    <div class="wizard-inner">
      <div class="wizard-steps" id="wizSteps"></div>
      <div class="wizard-body" id="wizBody"></div>
    </div>`;
  document.body.appendChild(overlay);

  function isStepComplete(i){
    const st = steps[i];
    if(st.type === 'question') return !!answers[st.question.id];
    return !!(commentValue && commentValue.trim());
  }
  function close(){
    overlay.remove();
    document.removeEventListener('keydown', onEsc);
    if(onClose) onClose();
  }
  function onEsc(e){ if(e.key === 'Escape') close(); }
  document.addEventListener('keydown', onEsc);
  overlay.querySelector('#wizClose').onclick = close;

  function renderStepsIndicator(){
    const stepsWrap = overlay.querySelector('#wizSteps');
    stepsWrap.innerHTML = '';
    steps.forEach((st, i) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'wizard-dot' + (i === stepIndex ? ' current' : '') + (isStepComplete(i) ? ' done' : '');
      dot.innerHTML = isStepComplete(i) ? phIcon('check', {weight:'bold'}) : (i === steps.length - 1 ? phIcon('pencil-simple') : String(i + 1));
      dot.title = st.type === 'question' ? st.question.question : 'Considerações';
      dot.onclick = () => { stepIndex = i; renderStep(); };
      stepsWrap.appendChild(dot);
    });
  }
  function renderStep(){
    renderStepsIndicator();
    const body = overlay.querySelector('#wizBody');
    const st = steps[stepIndex];
    if(st.type === 'question'){
      body.innerHTML = `
        <div class="wizard-eyebrow">${esc(st.category)}</div>
        <h2 class="wizard-question">${esc(st.question.question)}</h2>
        <div class="wizard-options" id="wizOptions"></div>
        <div class="wizard-nav">
          <button type="button" class="btn-sm" id="wizBack" ${stepIndex === 0 ? 'disabled' : ''}>${phIcon('arrow-left')} Voltar</button>
          <span class="wizard-progress">${stepIndex + 1} de ${steps.length}</span>
        </div>`;
      const optsWrap = overlay.querySelector('#wizOptions');
      RATING_ORDER.forEach(r => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'wizard-option' + (answers[st.question.id] === r ? ' selected' : '');
        btn.textContent = RATING_LABELS[r];
        btn.onclick = async () => {
          answers[st.question.id] = r;
          const { data: evId } = await sb.rpc('reader_submit_score', {
            p_password: readerPassword, p_group_slug: group.slug, p_stage: banca.stage, p_question_id: st.question.id, p_rating: r,
          });
          if(!evId){ showAlert('Não foi possível salvar a nota agora. Tente novamente.'); return; }
          if(!myEvaluatorId){
            myEvaluatorId = evId;
            banca.evaluators = banca.evaluators || [];
            if(!banca.evaluators.find(e => e.id === evId)){
              banca.evaluators.push({ id: evId, reader_id: leituraData.reader_id, comment: null });
            }
          }
          const existing = banca.scores.find(s => s.evaluator_id === myEvaluatorId && s.question_id === st.question.id);
          if(existing) existing.rating = r; else banca.scores.push({ evaluator_id: myEvaluatorId, question_id: st.question.id, rating: r });
          if(stepIndex < steps.length - 1){
            setTimeout(() => { stepIndex++; renderStep(); }, 200);
          } else {
            renderStep();
          }
        };
        optsWrap.appendChild(btn);
      });
      overlay.querySelector('#wizBack').onclick = () => { if(stepIndex > 0){ stepIndex--; renderStep(); } };
    } else {
      body.innerHTML = `
        <div class="wizard-eyebrow">Última etapa</div>
        <h2 class="wizard-question">Considerações</h2>
        <textarea id="wizComment" class="wizard-textarea" placeholder="Comentário/observação (opcional)"></textarea>
        <div class="wizard-nav">
          <button type="button" class="btn-sm" id="wizBack">${phIcon('arrow-left')} Voltar</button>
          <button type="button" class="btn-primary auto" id="wizFinish">Concluir</button>
        </div>`;
      overlay.querySelector('#wizComment').value = commentValue;
      overlay.querySelector('#wizBack').onclick = () => { stepIndex--; renderStep(); };
      overlay.querySelector('#wizFinish').onclick = async () => {
        const btn = overlay.querySelector('#wizFinish');
        btn.disabled = true; btn.textContent = 'Salvando…';
        commentValue = overlay.querySelector('#wizComment').value;
        const { data: ok } = await sb.rpc('reader_submit_comment', {
          p_password: readerPassword, p_group_slug: group.slug, p_stage: banca.stage, p_comment: commentValue.trim() || null,
        });
        if(!ok){ btn.disabled = false; btn.textContent = 'Concluir'; showAlert('Não foi possível salvar agora. Tente novamente.'); return; }
        const ev = banca.evaluators?.find(e => e.id === myEvaluatorId);
        if(ev) ev.comment = commentValue.trim() || null;
        renderThanksScreen();
      };
    }
  }
  function renderThanksScreen(){
    const allDone = steps.every((_, i) => isStepComplete(i));
    steps.forEach((_, i) => { if(i < steps.length - 1) answers[steps[i].question?.id || ''] = answers[steps[i].question?.id || '']; });
    renderStepsIndicator();
    const body = overlay.querySelector('#wizBody');
    body.innerHTML = `
      <div class="wizard-thanks">
        <div class="wizard-thanks-icon">${phIcon('check-circle', {weight:'fill'})}</div>
        <h2 class="wizard-thanks-title">Avaliação concluída!</h2>
        <p class="wizard-thanks-text">Obrigado pela sua participação. Suas notas e considerações foram registradas com sucesso.</p>
        <button type="button" class="btn-primary auto" id="wizDone">Fechar</button>
      </div>`;
    overlay.querySelector('#wizDone').onclick = close;
  }

  renderStep();
}

        const scoreSection = document.createElement('div');
        // overall avg
        const allScoreVals = bancaScores.filter(s => s.rating && RATING_VALUES[s.rating]).map(s => RATING_VALUES[s.rating]);
        const overallAvg = allScoreVals.length ? allScoreVals.reduce((a, b) => a + b, 0) / allScoreVals.length : null;
        const headerLine = document.createElement('div');
        headerLine.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;';
        headerLine.innerHTML = `
          <span style="font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;">Avaliações (${evaluators.length})</span>
          ${overallAvg != null ? `<span style="font-size:13px;font-weight:700;color:${RATING_BAR_COLORS[nearestRatingKey(overallAvg)]};">Média geral: ${overallAvg.toFixed(2)}/5</span>` : ''}`;
        scoreSection.appendChild(headerLine);

        evaluators.forEach(ev => {
          const evScores = bancaScores.filter(s => s.evaluator_id === ev.id && s.rating && RATING_VALUES[s.rating]);
          const evAvg = evScores.length ? evScores.reduce((sum, s) => sum + RATING_VALUES[s.rating], 0) / evScores.length : null;
          const evRow = document.createElement('div');
          evRow.style.cssText = 'border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;';

          let catHtml = '';
          if(rubric && rubric.length){
            catHtml = '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">' +
              rubric.map(cat => {
                const qIds = new Set((cat.questions||[]).map(q => q.id));
                const catVals = evScores.filter(s => qIds.has(s.question_id)).map(s => RATING_VALUES[s.rating]);
                const catAvg = catVals.length ? catVals.reduce((a,b)=>a+b,0)/catVals.length : null;
                const color = catAvg != null ? RATING_BAR_COLORS[nearestRatingKey(catAvg)] : 'var(--ink-soft)';
                const shortTitle = esc(cat.title.split(/\s/)[0]);
                return `<span style="font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid ${color};color:${color};white-space:nowrap;">${shortTitle}: ${catAvg != null ? catAvg.toFixed(1) : '—'}</span>`;
              }).join('') +
            '</div>';
          }

          evRow.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div>
                <span style="font-size:14px;font-weight:600;color:var(--ink);">${esc(ev.name || 'Avaliador')}</span>
                ${ev.role ? `<span style="font-size:12px;color:var(--ink-soft);margin-left:6px;">${esc(ev.role)}</span>` : ''}
              </div>
              ${evAvg != null ? `<span style="font-size:13px;font-weight:700;color:${RATING_BAR_COLORS[nearestRatingKey(evAvg)]};">${evAvg.toFixed(2)}/5</span>` : '<span style="font-size:12px;color:var(--ink-soft);">Sem notas</span>'}
            </div>
            ${catHtml}
            ${ev.comment ? `<div style="font-size:12.5px;color:var(--ink-mid);border-left:2px solid var(--warn);padding-left:10px;margin-top:10px;line-height:1.5;">${esc(ev.comment)}</div>` : ''}`;
          scoreSection.appendChild(evRow);
        });
        card.appendChild(scoreSection);
      }
    }

    content.appendChild(card);
  });
}

  body.innerHTML = `
    <div class="admin-bar">
      <div class="admin-bar-left">Membros com acesso de leitura à plataforma da banca.</div>
      <button class="btn-sm primary-outline" id="printQRBtn">${phIcon('printer')} Imprimir QR codes</button>
    </div>
    <div class="admin-section">
      <h3>Membros da banca (acesso de leitura)</h3>
      <div class="hint">Cada um tem nome + cargo + senha próprios. Na tela de acesso, escolhem "Banca" e entram com a senha própria para lançar as notas.</div>
      <div class="simple-list" id="bancaReadersList" style="margin-bottom:14px;"></div>
      <button class="btn-primary auto" id="addReaderBtn">+ Adicionar membro</button>
    </div>
    <div class="admin-section">
      <h3>Atribuição por etapa</h3>
      <div class="hint">Defina quais avaliadores participam de cada etapa. Cada avaliador atribuído avaliará <strong>todos os grupos</strong> daquele período.</div>

async function renderStageAssignments(){
  const wrap = $('stageAssignmentsWrap');
  if(!wrap) return;
  wrap.innerHTML = '<div class="loading-state">Carregando atribuições…</div>';
  const [{ data: readers }, { data: assignments }] = await Promise.all([
    sb.from('banca_readers').select('id,name,role').order('name'),
    sb.from('banca_stage_readers').select('stage,reader_id'),
  ]);
  if(!readers){ wrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Erro ao carregar avaliadores.</p>'; return; }
  const assignedMap = {};
  (assignments || []).forEach(a => {
    if(!assignedMap[a.stage]) assignedMap[a.stage] = [];
    assignedMap[a.stage].push(a.reader_id);
  });
  const stageLabels = { 1: '1ª Banca', 2: '2ª Banca', 3: 'Banca Final' };
  wrap.innerHTML = '';
  [1, 2, 3].forEach(stage => {
    const assignedIds = assignedMap[stage] || [];
    const assignedReaders = readers.filter(r => assignedIds.includes(r.id));
    const section = document.createElement('div');
    section.style.cssText = 'margin-bottom:20px;';

    const header = document.createElement('div');
    header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;';
    header.innerHTML = `
      <span style="font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.01em;">${stageLabels[stage]}</span>
      <button class="btn-sm primary-outline addStageBtn" style="font-size:12px;">+ Adicionar</button>`;
    header.querySelector('.addStageBtn').onclick = () =>
      openStageReaderPicker(stage, assignedIds, stageLabels[stage]);
    section.appendChild(header);

    if(!assignedReaders.length){
      const empty = document.createElement('p');
      empty.style.cssText = 'font-size:13px;color:var(--ink-soft);padding:6px 0;';
      empty.textContent = 'Nenhum avaliador atribuído.';
      section.appendChild(empty);
    } else {
      const list = document.createElement('div'); list.className = 'simple-list';
      assignedReaders.forEach(r => {
        const row = document.createElement('div');
        row.className = 'simple-row';
        row.innerHTML = `
          <div class="meta" style="flex:1;">
            <strong>${esc(r.name)}</strong>
            ${r.role ? `<span>${esc(r.role)}</span>` : ''}
          </div>
          <div class="row-acts">
            <button class="btn-sm danger" title="Remover da etapa">${phIcon('x')}</button>
          </div>`;
        row.querySelector('button').onclick = async () => {
          await sb.from('banca_stage_readers').delete().eq('stage', stage).eq('reader_id', r.id);
          renderStageAssignments();
        };
        list.appendChild(row);
      });
      section.appendChild(list);
    }
    wrap.appendChild(section);
  });
}

function openStageReaderPicker(stage, currentAssignedIds, stageLabel){
  showModal(async (box, close) => {
    box.innerHTML = `
      <h3>Adicionar avaliadores</h3>
      <p style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">${esc(stageLabel)}</p>
      <div class="loading-state" id="pickerLoading">Carregando avaliadores…</div>
      <div class="picker-list" id="pickerList" style="margin-bottom:16px;display:none;"></div>
      <div class="modal-actions">
        <button class="btn-sm" id="pickerCancel">Cancelar</button>
        <button class="btn-primary auto" id="pickerConfirm" disabled>Adicionar</button>
      </div>`;
    box.querySelector('#pickerCancel').onclick = () => close(null);

    const { data: allReaders } = await sb.from('banca_readers').select('id,name,role').order('name');
    const assignedSet = new Set(currentAssignedIds);
    const available = (allReaders || []).filter(r => !assignedSet.has(r.id));

    box.querySelector('#pickerLoading').remove();
    const list = box.querySelector('#pickerList');
    list.style.display = '';

    if(!available.length){
      list.style.display = 'none';
      const empty = document.createElement('p');
      empty.style.cssText = 'font-size:13px;color:var(--ink-soft);margin-bottom:16px;';
      empty.textContent = 'Todos os avaliadores já estão atribuídos a esta etapa.';
      list.insertAdjacentElement('afterend', empty);
      return;
    }

    const selected = new Set();
    const confirmBtn = box.querySelector('#pickerConfirm');

    available.forEach(r => {
      const row = document.createElement('label');
      row.className = 'picker-row';
      row.htmlFor = `pick_${r.id}`;
      row.innerHTML = `
        <input type="checkbox" id="pick_${r.id}">
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:600;color:var(--ink);">${esc(r.name)}</div>
          ${r.role ? `<div style="font-size:12px;color:var(--ink-soft);">${esc(r.role)}</div>` : ''}
        </div>`;
      const cb = row.querySelector('input');
      cb.addEventListener('change', () => {
        if(cb.checked) selected.add(r.id); else selected.delete(r.id);
        confirmBtn.disabled = !selected.size;
      });
      list.appendChild(row);
    });

    confirmBtn.onclick = async () => {
      if(!selected.size) return;
      confirmBtn.disabled = true; confirmBtn.textContent = 'Salvando…';
      await Promise.all([...selected].map(rid =>
        sb.from('banca_stage_readers').insert({ stage, reader_id: rid })
      ));
      close(true);
      renderStageAssignments();
    };
  });
}

async function printReaderQRCodes(){
  const { data: readers, error } = await sb.from('banca_readers').select('*').order('created_at');
  if(error || !readers || !readers.length){ showAlert('Nenhum membro cadastrado.'); return; }

  const baseUrl = window.location.href.split('?')[0].split('#')[0];
  const qrSize = 220;

  const cards = readers.map(r => {
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&data=${encodeURIComponent(baseUrl)}&bgcolor=ffffff&color=0f0f0f&margin=8`;
    return `
      <div class="qr-card">
        <div class="qr-img-wrap">
          <img src="${qrUrl}" width="${qrSize}" height="${qrSize}" alt="QR Code">
        </div>
        <div class="qr-name">${esc(r.name)}</div>
        ${r.role ? `<div class="qr-role">${esc(r.role)}</div>` : ''}
        <div class="qr-pw-label">Senha de acesso</div>
        <div class="qr-pw">${esc(r.password_hash || '—')}</div>
        <div class="qr-site">${esc(baseUrl)}</div>
      </div>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>QR Codes — Acesso da Banca</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#fff;color:#111;padding:24px;}
    h1{font-size:18px;font-weight:700;margin-bottom:4px;}
    .page-header{margin-bottom:28px;border-bottom:1.5px solid #e0e0e0;padding-bottom:14px;}
    .page-header p{font-size:12px;color:#555;margin-top:4px;}
    .cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
    .qr-card{
      border:1.5px solid #e0e0e0;border-radius:14px;padding:20px 16px 16px;
      display:flex;flex-direction:column;align-items:center;text-align:center;
      break-inside:avoid;page-break-inside:avoid;
    }
    .qr-img-wrap{width:${qrSize}px;height:${qrSize}px;margin-bottom:14px;}
    .qr-img-wrap img{width:100%;height:100%;display:block;}
    .qr-name{font-size:15px;font-weight:700;margin-bottom:2px;}
    .qr-role{font-size:12px;color:#666;margin-bottom:10px;}
    .qr-pw-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:4px;margin-top:8px;}
    .qr-pw{
      font-size:18px;font-weight:800;letter-spacing:.04em;
      background:#f5f5f5;border:1.5px solid #e0e0e0;border-radius:8px;
      padding:7px 16px;min-width:120px;
    }
    .qr-site{font-size:9px;color:#aaa;margin-top:10px;word-break:break-all;}
    @media print{
      body{padding:0;}
      .cards-grid{gap:14px;}
      .qr-card{border-color:#ccc;}
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Acessos da Banca — Projeto Interdisciplinar</h1>
    <p>Escaneie o QR code com o celular para abrir a plataforma, depois informe a senha de acesso abaixo.</p>
  </div>
  <div class="cards-grid">${cards}</div>
  <script>window.addEventListener('load', () => setTimeout(() => window.print(), 800));<\/script>
</body>
</html>`;

  const w = window.open('', '_blank');
  if(!w){ showAlert('Popup bloqueado pelo navegador. Permita popups para este site.'); return; }
  w.document.write(html);
  w.document.close();
}
async function renderBancaReadersList(body){
  const wrap = $('bancaReadersList');
  if(!wrap) return;
  wrap.innerHTML = '<div class="loading-state">Carregando membros…</div>';
  const { data: readers } = await sb.from('banca_readers').select('*').order('created_at');
  wrap.innerHTML = '';
  if(!readers || !readers.length){ wrap.innerHTML = '<p style="font-size:13px;color:var(--ink-soft)">Nenhum membro cadastrado ainda.</p>'; return; }
  readers.forEach(r => wrap.appendChild(buildReaderDisplayRow(r, body)));
}
function buildReaderDisplayRow(r, body){
  const row = document.createElement('div'); row.className = 'simple-row';
  row.innerHTML = `<div class="meta"><strong>${esc(r.name)}</strong><span>${esc(r.role || '')}</span></div>`;
  const acts = document.createElement('div'); acts.className = 'row-acts';
  const edit = document.createElement('button'); edit.className = 'btn-sm'; edit.textContent = 'Editar';
  edit.onclick = () => openReaderModal(r, body);
  const del = document.createElement('button'); del.className = 'btn-sm danger'; del.textContent = 'Remover';
  del.onclick = async () => {
    if(!(await showConfirm(`Remover o acesso de "${r.name}"?`))) return;
    await sb.from('banca_readers').delete().eq('id', r.id);
    renderBancaReadersList(body);
  };
  acts.append(edit, del); row.appendChild(acts);
  return row;
}

/* Modal única para criar/editar um membro da banca (nome, cargo, senha
   com gerador aleatório), no mesmo padrão do "+ Novo grupo". */
function openReaderModal(r, body){
  const isEdit = !!r;
  showModal((box, close) => {
    box.innerHTML = `
      <h3>${isEdit ? 'Editar membro' : 'Adicionar membro'}</h3>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Nome</span>
        <input class="field" id="modalReaderName" style="margin-bottom:0;" placeholder="Nome">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">Cargo</span>
        <input class="field" id="modalReaderRole" style="margin-bottom:0;" placeholder="ex: Avaliador externo">
      </div>
      <div style="margin-bottom:10px;">
        <span class="modal-field-label">${isEdit ? 'Nova senha (deixe em branco para manter)' : 'Senha'}</span>
        <div style="display:flex; gap:6px;">
          <input class="field" id="modalReaderPassword" type="text" style="margin-bottom:0;" placeholder="Senha">
          <button type="button" class="btn-sm" id="modalGenPasswordBtn" title="Gerar senha aleatória">${phIcon('dice-five')}</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-sm" id="modalCancel">Cancelar</button>
        <button class="btn-primary auto" id="modalSave">Salvar</button>
      </div>`;
    box.querySelector('#modalReaderName').value = isEdit ? r.name : '';
    box.querySelector('#modalReaderRole').value = isEdit ? (r.role || '') : '';
    box.querySelector('#modalGenPasswordBtn').onclick = () => { box.querySelector('#modalReaderPassword').value = generateRandomPassword(); };
    box.querySelector('#modalCancel').onclick = () => close(null);
    box.querySelector('#modalSave').onclick = async () => {
      const name = box.querySelector('#modalReaderName').value.trim();
      const role = box.querySelector('#modalReaderRole').value.trim();
      const pw = box.querySelector('#modalReaderPassword').value;
      if(!name){ showAlert('O nome não pode ficar em branco.'); return; }
      if(isEdit){
        const { error } = await sb.from('banca_readers').update({ name, role }).eq('id', r.id);
        if(error){ showAlert(error.message); return; }
        if(pw){
          const { error: pwErr } = await sb.rpc('admin_set_banca_reader_password', { p_reader_id: r.id, p_password: pw });
          if(pwErr){ showAlert(pwErr.message); return; }
        }
      } else {
        if(!pw){ showAlert('Defina uma senha.'); return; }
        const { error } = await sb.rpc('admin_add_banca_reader', { p_name: name, p_role: role, p_password: pw });
        if(error){ showAlert(error.message); return; }
      }
      close(true);
      renderBancaReadersList(body);
    };
  });
}

/* ======================= INIT ======================= */
async function renderRoute(){
  renderHeaderNav();
  const route = getRoute();

  if(!sb){
    if(route === 'admin') renderAdminLogin();
    else if(route === 'aluno') renderAlunoPage();
    else if(route === 'grupo') renderGrupoGate(currentRoute.slug);
    else renderHomePage();
    return;
  }

  if(route === 'admin'){
    const { data: { session: s } } = await sb.auth.getSession();
    if(s){ session = s; await bootAdminPanel(); }
    else renderAdminLogin();
  } else if(route === 'aluno'){
    renderAlunoPage();
  } else if(route === 'grupo'){
    renderGrupoGate(currentRoute.slug);
  } else {
    await loadLinksData();
    renderHomePage();
  }
}

(async () => {
  $('logoArea').onclick = goHome;
  await renderRoute();
})();
